################################################################################
# PAUSE/RESUME - CARTOGRAPHER + TOOLCHANGER COMPATIBLE (WITH BED RESTORE)
# Patched for viesturz/klipper-toolchanger-easy
# Fixes:
#   - printer.toolchanger.tool_current → printer.toolchanger.tool_number
#   - printer.toolchanger.tool_numbers (invalid) → extruder range loop for fans
#   - Integer key mismatch in RESUME active tool lookup → string key lookup
#   - SAVE_TOOL_TEMPS now saves dict keys as strings (i|string) to ensure
#     consistent key types after SET_GCODE_VARIABLE round-trip serialization
################################################################################

[gcode_macro DEBUG_SAVED_TEMPS]
gcode:
    {% set saved_temps = printer["gcode_macro SAVE_TOOL_TEMPS"].saved_temps %}
    {% set saved_bed = printer["gcode_macro SAVE_TOOL_TEMPS"].saved_bed_temp %}
    {% set active = printer["gcode_macro SAVE_TOOL_TEMPS"].saved_active_tool %}
    RESPOND MSG="Active: {active}"
    RESPOND MSG="Bed: {saved_bed}"
    RESPOND MSG="Temps dict: {saved_temps}"


[gcode_macro SAVE_TOOL_TEMPS]
description: Save current temperatures for all tools and the bed
variable_saved_temps: {}
variable_saved_active_tool: -1
variable_saved_bed_temp: 0
gcode:
    # --- PATCH: use printer.toolchanger.tool_number (not tool_current) ---
    {% set active = -1 %}
    {% if printer.toolchanger is defined and printer.toolchanger.tool_number is defined and printer.toolchanger.tool_number is not none %}
        {% set active = printer.toolchanger.tool_number|int %}
    {% elif printer.toolhead.extruder is defined %}
        {% if printer.toolhead.extruder == "extruder" %}
            {% set active = 0 %}
        {% else %}
            {% set parts = printer.toolhead.extruder.split('extruder') %}
            {% if parts|length > 1 and parts[1]|length > 0 %}
                {% set active = parts[1]|int %}
            {% endif %}
        {% endif %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=SAVE_TOOL_TEMPS VARIABLE=saved_active_tool VALUE={active}
    RESPOND TYPE='echo' MSG="Active tool saved as: T{active}"

    # SAVE BED TEMPERATURE
    {% set current_bed_target = printer.heater_bed.target|float %}
    SET_GCODE_VARIABLE MACRO=SAVE_TOOL_TEMPS VARIABLE=saved_bed_temp VALUE={current_bed_target}
    RESPOND TYPE='echo' MSG="Saved bed temperature target: {current_bed_target}°C"

    # --- PATCH: use i|string as dict key so round-trip through SET_GCODE_VARIABLE
    #     preserves string keys, preventing silent key-mismatch in RESUME/RESTORE ---
    {% set temps = {} %}
    {% for i in range(20) %}
        {% set extruder_name = "extruder" if i == 0 else "extruder" ~ i %}
        {% if extruder_name in printer %}
            {% set temp = printer[extruder_name].target %}
            {% set _ = temps.update({i|string: temp}) %}
            RESPOND TYPE='echo' MSG="Saved temperature T{i} = {temp}°C"
        {% endif %}
    {% endfor %}

    SET_GCODE_VARIABLE MACRO=SAVE_TOOL_TEMPS VARIABLE=saved_temps VALUE="{temps}"


[gcode_macro RESTORE_TOOL_TEMPS]
description: Restore saved temperatures (Parallel Heating)
gcode:
    {% set active_tool = printer["gcode_macro SAVE_TOOL_TEMPS"].saved_active_tool|int %}
    {% set saved_temps = printer["gcode_macro SAVE_TOOL_TEMPS"].saved_temps %}
    {% set saved_bed = printer["gcode_macro SAVE_TOOL_TEMPS"].saved_bed_temp|float %}

    RESPOND TYPE='echo' MSG="Restoring Bed and Tool temperatures in parallel..."

    #########################################
    # 1. START ALL HEATERS (Non-blocking)
    #########################################

    # Start Bed
    {% if saved_bed > 0 %}
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={saved_bed|int}
    {% endif %}

    # Start all Extruders — keys are strings after round-trip
    {% for i in range(20) %}
        {% set extruder_name = "extruder" if i == 0 else "extruder" ~ i %}
        {% set key = i|string %}
        {% if extruder_name in printer and key in saved_temps %}
            {% set temp = saved_temps[key]|float %}
            {% if temp > 0 %}
                SET_HEATER_TEMPERATURE HEATER={extruder_name} TARGET={temp|int}
            {% endif %}
        {% endif %}
    {% endfor %}

    #########################################
    # 2. WAIT FOR ALL (Blocking)
    #########################################

    # Wait for Bed
    {% if saved_bed > 40 %}
        RESPOND TYPE='echo' MSG="Waiting for bed..."
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={saved_bed|int - 1}
    {% endif %}

    # Wait for Active Tool only
    {% if active_tool >= 0 %}
        {% set tool_key = active_tool|string %}
        {% if tool_key in saved_temps %}
            {% set temp = saved_temps[tool_key]|float %}
            {% if temp > 50 %}
                RESPOND TYPE='echo' MSG="Waiting for active tool T{active_tool}..."
                {% set extruder_wait = "extruder" if active_tool == 0 else "extruder" ~ active_tool %}
                TEMPERATURE_WAIT SENSOR={extruder_wait} MINIMUM={temp|int - 1}
                RESPOND TYPE='echo' MSG="All temperatures stabilized."
            {% endif %}
        {% endif %}
    {% endif %}






[gcode_macro PAUSE]
description: Pause the print and park the toolhead
rename_existing: PAUSE_BASE
gcode:
    RESPOND TYPE='echo' MSG="=======PAUSE CALLED========"

    {% set z = params.Z|default(10)|int %}

    {% if printer['pause_resume'].is_paused|int == 1 %}
        RESPOND TYPE='error' MSG="Print is already paused"
    {% else %}
        # --- FIX: save original logical position for explicit restore later ---
        {% set pos = printer.gcode_move.position %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=orig_x VALUE={pos.x}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=orig_y VALUE={pos.y}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=orig_z VALUE={pos.z}

        SAVE_TOOL_TEMPS
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}

        SAVE_GCODE_STATE NAME=PAUSE
        PAUSE_BASE

        # --- FIX: clear tool offsets before parking so park coords are raw ---
        SET_GCODE_OFFSET X=0 Y=0 Z=0

        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}
            G91
            G1 Z{z} F900
        {% else %}
            RESPOND MSG="Pause Z-hop exceeds maximum Z height."
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}

        G90
        {% set safe_y = 300 %}
        G1 X{printer.toolhead.axis_maximum.x/2} Y{safe_y} F6000
        SAVE_GCODE_STATE NAME=PAUSEPARK

        # Shuts off extruders only (bed stays on)
        {% for i in range(20) %}
            {% set extruder_name = "extruder" if i == 0 else "extruder" ~ i %}
            {% if extruder_name in printer %}
                SET_HEATER_TEMPERATURE HEATER={extruder_name} TARGET=0
            {% endif %}
        {% endfor %}

        SET_IDLE_TIMEOUT TIMEOUT=432000
        M117 Print Paused
    {% endif %}









[gcode_macro RESUME]
description: Resume the print after pause
rename_existing: RESUME_BASE
variable_zhop: 0
variable_etemp: 0
variable_orig_x: 0
variable_orig_y: 0
variable_orig_z: 0
gcode:
    RESPOND TYPE='echo' MSG="=======RESUME CALLED========"

    {% set e = params.E|default(0.5)|float %}

    {% if printer['pause_resume'].is_paused|int == 1 %}
        INITIALIZE_TOOLCHANGER
        
        {% set active_tool = printer["gcode_macro SAVE_TOOL_TEMPS"].saved_active_tool|int %}
        {% if active_tool >= 0 %}
            VERIFY_TOOL_DETECTED T={active_tool}
        {% endif %}
        
        {% set saved_temps = printer["gcode_macro SAVE_TOOL_TEMPS"].saved_temps %}
        {% set saved_bed = printer["gcode_macro SAVE_TOOL_TEMPS"].saved_bed_temp|float %}

        RESPOND TYPE='echo' MSG="Restoring bed and tool temperatures..."

        # Restore bed
        {% if saved_bed > 0 %}
            SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={saved_bed|int}
        {% endif %}

        # Restore all extruders
        {% for i in range(20) %}
            {% set extruder_name = "extruder" if i == 0 else "extruder" ~ i %}
            {% set key = i|string %}
            {% if extruder_name in printer and key in saved_temps %}
                {% set temp = saved_temps[key]|float %}
                {% if temp > 0 %}
                    SET_HEATER_TEMPERATURE HEATER={extruder_name} TARGET={temp|int}
                    RESPOND TYPE='echo' MSG="Set T{i} -> {temp|int}°C"
                {% endif %}
            {% endif %}
        {% endfor %}

        # Wait for bed
        {% if saved_bed > 40 %}
            RESPOND TYPE='echo' MSG="Waiting for bed..."
            TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={saved_bed|int - 1}
        {% endif %}

        # Wait for active tool
        {% set tool_key = active_tool|string %}
        {% if active_tool >= 0 and tool_key in saved_temps %}
            {% set temp = saved_temps[tool_key]|float %}
            {% if temp > 50 %}
                {% set extruder_name = "extruder" if active_tool == 0 else "extruder" ~ active_tool %}
                RESPOND TYPE='echo' MSG="Waiting for T{active_tool} to reach {temp|int}°C..."
                TEMPERATURE_WAIT SENSOR={extruder_name} MINIMUM={temp|int - 2}
                RESPOND TYPE='echo' MSG="T{active_tool} ready. Resuming."
            {% endif %}
        {% endif %}

        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
        M117 Resuming...

        # --- Move back to park position (raw coords) ---
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100

        # --- Restore original coordinate system (offsets, absolute mode, etc.) ---
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=0

        # --- FIX: XY first at current safe Z, then descend + prime ---
        G90
        G1 X{orig_x} Y{orig_y} F3600

        G91
        M83
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            G1 Z{zhop * -1} E{e} F900
        {% else %}
            G1 Z{zhop * -1} F900
        {% endif %}

        M117 Printing...
        RESUME_BASE
    {% else %}
        RESPOND TYPE='error' MSG="Print is not paused"
    {% endif %}



  


[gcode_macro CANCEL_PRINT]
description: Cancel the print and perform cleanup
rename_existing: BASE_CANCEL_PRINT
gcode:
    # 1. Immediate Notification
    RESPOND TYPE='echo' MSG="Print cancelled"

    # 2. Set Status Variables
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=False
    SET_GCODE_VARIABLE MACRO=_PRINT_TRACKER VARIABLE=is_printing VALUE=False

    # 3. Handle Pause State
    {% if printer['pause_resume'].is_paused|int == 1 %}
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=0
    {% endif %}

    # 4. Safe Toolhead Movement
    # Move Z up 10mm (clamped to max height) and move XY to a safe spot
    {% set z_safe = [printer.gcode_move.position.z + 10, printer.toolhead.axis_maximum.z]|min %}
    G90 ; Absolute positioning
    G1 Z{z_safe} F900
    G1 X{printer.toolhead.axis_maximum.x/2} Y300 F6000

    # 5. Run Print_end WHILE STILL HOT
    # This prevents "Extrude below minimum temp" if Print_end contains a retraction
    PRINT_END

    # 6. Safety Shutdown
    STOP_CRASH_DETECTION
    TURN_OFF_HEATERS
    M107 ; Turn off standard fans

    # 7. Dynamic Part Fan Shutdown (T0-T19)
    {% for i in range(20) %}
        {% set extruder_name = "extruder" if i == 0 else "extruder" ~ i %}
        {% if extruder_name in printer %}
            SET_FAN_SPEED FAN=t{i}_partfan SPEED=0
        {% endif %}
    {% endfor %}

    # 8. Reset Workspace
    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    
    # 9. Finalize
    M117 Print Cancelled
    BASE_CANCEL_PRINT

