###########################################################################
# ADC IN 1-4
# ADC channels 1-4 have 4.7kΩ pull-up resistors; you can connect ADC sensors, such as thermistors. The following is an example:
###########################################################################
# [temperature_sensor ADC1]
# sensor_type: Generic 3950
# sensor_pin: hexa:PA0
# min_temp:-200
# max_temp:300

[temperature_sensor Frame]
sensor_type: Generic 3950
sensor_pin:  hexa:PA3
min_temp:0
max_temp:100

# [temperature_sensor Chamber2]
# sensor_type: Generic 3950
# sensor_pin: hexa:PA1
