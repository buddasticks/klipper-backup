# Standalone file — place outside ktc-easy readonly folder
# and include AFTER ktc-easy in printer.cfg:
#   [include ktc-easy/...]
#   [include sv08_homing.cfg]   <-- must come after
#
# Overrides: homing_override_config, [homing_override], _SENSORLESS_HOME
# Adds:      _VALIDATED_HOME, _TEST_ENDSTOP, _HOMED_CHECK
# Retained:  _ADJUST_Z_HOME_FOR_TOOL_OFFSET, TOOL_BED_MESH_CALIBRATE
# ============================================================

[gcode_macro homing_override_config]
variable_sensorless_x: True
variable_sensorless_y: True
variable_homing_rebound_y: 65
variable_stepper_driver: "tmc2209"
variable_homing_current: 0.71
gcode:


