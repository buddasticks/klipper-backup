################################################################################
#                    TOOL CHANGER CONFIGURATION - TOOL 0                       #
#                              Sovol SV08 Printer                              #
################################################################################

################################################################################
# TOOL 0 MICROCONTROLLER (BigTreeTech EBB CAN V1.2)
################################################################################

[mcu tool0]
canbus_uuid:  8fb9c635cef9

################################################################################
# TOOL 0 EXTRUDER CONFIGURATION
################################################################################

[extruder]
step_pin: tool0:PD0
dir_pin: !tool0:PD1
enable_pin: !tool0:PD2
heater_pin: tool0:PB13
sensor_pin: tool0:PA3
sensor_type: ATC Semitec 104NT-4-R025H42G
pullup_resistor: 4700
full_steps_per_rotation: 200
microsteps: 16

rotation_distance: 22.67895
gear_ratio: 50:10

nozzle_diameter: 0.400
filament_diameter: 1.75
min_temp: 0
max_temp: 305
max_power: 1.0
min_extrude_temp: 50

max_extrude_only_distance: 1500
max_extrude_cross_section: 10
max_extrude_only_velocity: 75
max_extrude_only_accel: 1500

# control: pid
# pid_Kp: 43.595
# pid_Ki: 13.839
# pid_Kd: 34.333
pressure_advance: 0.02
pressure_advance_smooth_time: 0.035

################################################################################
# TOOL 0 EXTRUDER STEPPER DRIVER (TMC2209)
################################################################################

[tmc2209 extruder]
uart_pin: tool0:PA15
interpolate: True
run_current: 0.65
sense_resistor: 0.150

################################################################################
# TOOL 0 HEATER SAFETY VERIFICATION
################################################################################

[verify_heater extruder]
max_error: 120
check_gain_time: 20
hysteresis: 5
heating_gain: 2

################################################################################
# TOOL 0 TEMPERATURE MONITORING
################################################################################

[temperature_sensor Tool_0_Temp]
sensor_type: temperature_mcu
sensor_mcu: tool0

################################################################################
# TOOL 0 PART COOLING FAN
################################################################################

[fan_generic t0_partfan]
pin: tool0:PA0

################################################################################
# TOOL 0 HOTEND COOLING FAN
################################################################################

[heater_fan t0_hotend_fan]
pin: tool0:PA1
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 45.0

################################################################################
# TOOL 0 DEFINITION
################################################################################

[tool T0]
tool_number: 0
params_accel: 'tool0'
extruder: extruder
fan: t0_partfan
detection_pin: ^!tool0:PB6

# params_park_x: 146
# params_park_y: 20
# params_park_z: 292.4

gcode_x_offset: 0.0
gcode_y_offset: 0.0
gcode_z_offset: 0.0

params_retract_length: 0.7
params_retract_speed: 30
params_unretract_extra_length: 0
params_unretract_speed: 30

params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 56.0
params_input_shaper_damping_ratio_x: 0.077

params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 37.0
params_input_shaper_damping_ratio_y: 0.060

after_change_gcode:
    # Set input shaper for T0
    SET_INPUT_SHAPER SHAPER_TYPE_X={printer["tool T0"].params_input_shaper_type_x} SHAPER_FREQ_X={printer["tool T0"].params_input_shaper_freq_x} DAMPING_RATIO_X={printer["tool T0"].params_input_shaper_damping_ratio_x} SHAPER_TYPE_Y={printer["tool T0"].params_input_shaper_type_y} SHAPER_FREQ_Y={printer["tool T0"].params_input_shaper_freq_y} DAMPING_RATIO_Y={printer["tool T0"].params_input_shaper_damping_ratio_y}

    #RESPOND MSG="T0 after_change: is_printing={printer['gcode_macro _PRINT_TRACKER'].is_printing}"

    # Set retraction - use slicer values if printing, config defaults otherwise
    {% if printer["gcode_macro _PRINT_TRACKER"].is_printing %}
      {% set rmap = printer["gcode_macro _SLICER_TOOL_PARAMS"].retract %}
      #RESPOND MSG="T0 retract map={rmap}"
      {% if '0' in rmap %}
        {% set r = rmap['0'] %}
        #RESPOND MSG="T0 using slicer retract len={r['length']} speed={r['speed']} unretract={r['unretract']}"
        SET_RETRACTION RETRACT_LENGTH={r['length']} RETRACT_SPEED={r['speed']} UNRETRACT_EXTRA_LENGTH={printer["tool T0"].params_unretract_extra_length} UNRETRACT_SPEED={r['unretract']}
      {% else %}
        #RESPOND MSG="T0 using default retract len={printer['tool T0'].params_retract_length} speed={printer['tool T0'].params_retract_speed} unretract={printer['tool T0'].params_unretract_speed}"
        SET_RETRACTION RETRACT_LENGTH={printer["tool T0"].params_retract_length} RETRACT_SPEED={printer["tool T0"].params_retract_speed} UNRETRACT_EXTRA_LENGTH={printer["tool T0"].params_unretract_extra_length} UNRETRACT_SPEED={printer["tool T0"].params_unretract_speed}
      {% endif %}
    {% else %}
      #RESPOND MSG="T0 not printing, using default retract len={printer['tool T0'].params_retract_length} speed={printer['tool T0'].params_retract_speed} unretract={printer['tool T0'].params_unretract_speed}"
      SET_RETRACTION RETRACT_LENGTH={printer["tool T0"].params_retract_length} RETRACT_SPEED={printer["tool T0"].params_retract_speed} UNRETRACT_EXTRA_LENGTH={printer["tool T0"].params_unretract_extra_length} UNRETRACT_SPEED={printer["tool T0"].params_unretract_speed}
    {% endif %}

    # Set pressure advance - use slicer values if printing, config defaults otherwise
    {% if printer["gcode_macro _PRINT_TRACKER"].is_printing %}
      {% set pamap = printer["gcode_macro _SLICER_TOOL_PA"].pa %}
      #RESPOND MSG="T0 PA map={pamap}"
      {% if '0' in pamap %}
        #RESPOND MSG="T0 using slicer PA={pamap['0']}"
        SET_PRESSURE_ADVANCE EXTRUDER={printer["tool T0"].extruder} ADVANCE={pamap['0']}
      {% else %}
        #RESPOND MSG="T0 using default PA={printer[printer['tool T0'].extruder].pressure_advance}"
        SET_PRESSURE_ADVANCE EXTRUDER={printer["tool T0"].extruder} ADVANCE={printer[printer["tool T0"].extruder].pressure_advance}
      {% endif %}
    {% else %}
      #RESPOND MSG="T0 not printing, using default PA={printer[printer['tool T0'].extruder].pressure_advance}"
      SET_PRESSURE_ADVANCE EXTRUDER={printer["tool T0"].extruder} ADVANCE={printer[printer["tool T0"].extruder].pressure_advance}
    {% endif %}

    # Purge and clean nozzle if printing (only if homed)
    {% if printer["gcode_macro _PRINT_TRACKER"].is_printing %}
      {% if 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes and 'z' in printer.toolhead.homed_axes %}
        #CLEAN_NOZZLE PURGE=50 WIPE=5
      {% endif %}
    {% endif %}

################################################################################
# TOOL 0 MACRO
################################################################################
[gcode_macro T0]
variable_active: 0
variable_color: ""
variable_spool_id: None
gcode:
    {% set svv = printer.save_variables.variables %}
    SELECT_TOOL T=0
    {% if svv.t0__spool_id is defined and svv.t0__spool_id %}
        SET_GCODE_VARIABLE MACRO=T0 VARIABLE=spool_id VALUE={svv.t0__spool_id}
        SET_ACTIVE_SPOOL ID={svv.t0__spool_id}
    {% endif %}

################################################################################
# TOOL 0 ACCELEROMETER (ADXL345)
################################################################################

[adxl345 tool0]
cs_pin: tool0:PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x, z, -y