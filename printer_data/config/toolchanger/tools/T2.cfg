################################################################################
# TOOL 2 MACRO
################################################################################

[gcode_macro T2]
variable_active: 0
variable_color: ""
variable_spool_id: None
gcode:
    {% set svv = printer.save_variables.variables %}
    SELECT_TOOL T=2
    {% if svv.t2__spool_id is defined and svv.t2__spool_id %}
        SET_GCODE_VARIABLE MACRO=T2 VARIABLE=spool_id VALUE={svv.t2__spool_id}
        SET_ACTIVE_SPOOL ID={svv.t2__spool_id}
    {% endif %}

################################################################################
# TOOL 2 ACCELEROMETER (ADXL345)
################################################################################

[adxl345 tool2]
cs_pin: tool2:PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x, z, -y