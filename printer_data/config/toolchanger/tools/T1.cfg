################################################################################
#                    TOOL CHANGER CONFIGURATION - TOOL 1                       #
#                              Sovol SV08 Printer                              #
################################################################################

################################################################################
# TOOL 1 MICROCONTROLLER (BigTreeTech EBB CAN V1.2)
################################################################################

[mcu tool1]
canbus_uuid: 135d1dc6482d
#c4123f19b1d1  pink fans
##fefa57fa0cd6  dogdy temp mcu

################################################################################
# TOOL 1 EXTRUDER CONFIGURATION
################################################################################

[extruder1]
step_pin: tool1:PD0
dir_pin: !tool1:PD1
enable_pin: !tool1:PD2
heater_pin: tool1:PB13
sensor_pin: tool1:PA3
sensor_type: ATC Semitec 104NT-4-R025H42G
pullup_resistor: 4700
full_steps_per_rotation: 200
microsteps: 16

rotation_distance: 22.67895
gear_ratio: 50:10

nozzle_diameter: 0.400
filament_diameter: 1.75
min_temp: 0
max_temp: 305
max_power: 1.0
min_extrude_temp: 30

max_extrude_only_distance: 1500
max_extrude_cross_section: 10
max_extrude_only_velocity: 75
max_extrude_only_accel: 1500

# control: pid
# pid_Kp: 43.595
# pid_Ki: 13.839
# pid_Kd: 34.333
pressure_advance: 0.02
pressure_advance_smooth_time: 0.035

################################################################################
# TOOL 1 EXTRUDER STEPPER DRIVER (TMC2209)
################################################################################

[tmc2209 extruder1]
uart_pin: tool1:PA15
interpolate: True
run_current: 0.65
sense_resistor: 0.150

################################################################################
# TOOL 1 HEATER SAFETY VERIFICATION
################################################################################

[verify_heater extruder1]
max_error: 120
check_gain_time: 20
hysteresis: 5
heating_gain: 2

################################################################################
# TOOL 1 TEMPERATURE MONITORING
################################################################################

[temperature_sensor Tool_1_Temp]
sensor_type: temperature_mcu
sensor_mcu: tool1
min_temp: -200
max_temp: 300

################################################################################
# TOOL 1 PART COOLING FAN
################################################################################

[fan_generic t1_partfan]
pin: tool1:PA0
max_power: 1.0
cycle_time: 0.020
kick_start_time: 0.3
off_below: 0.80

# [fan_generic t1_partfan]
# pin: tool1:PA0
# max_power: 0.99
# kick_start_time: 0.2
# off_below: 0.30

################################################################################
# TOOL 1 HOTEND COOLING FAN
################################################################################

[heater_fan t1_hotend_fan]
pin: tool1:PA1
max_power: 1.0
kick_start_time: 0.5
heater: extruder1
heater_temp: 45.0

################################################################################
# TOOL 1 DEFINITION
################################################################################

[tool T1]
tool_number: 1
params_accel: 'tool1'
extruder: extruder1
fan: t1_partfan
#detection_pin: ^!tool1:PB6

# params_park_x: 146
# params_park_y: 20
# params_park_z: 292.4

# gcode_x_offset: 0.460
# gcode_y_offset: -0.460
# gcode_z_offset: 1.150

gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0

params_retract_length: 0.7
params_retract_speed: 30
params_unretract_extra_length: 0
params_unretract_speed: 30

params_input_shaper_type_x: 'ei'
params_input_shaper_freq_x: 77.0
params_input_shaper_damping_ratio_x: 0.043

params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 43.2
params_input_shaper_damping_ratio_y: 0.049

after_change_gcode:
    # Set input shaper for T1
    SET_INPUT_SHAPER SHAPER_TYPE_X={printer["tool T1"].params_input_shaper_type_x} SHAPER_FREQ_X={printer["tool T1"].params_input_shaper_freq_x} DAMPING_RATIO_X={printer["tool T1"].params_input_shaper_damping_ratio_x} SHAPER_TYPE_Y={printer["tool T1"].params_input_shaper_type_y} SHAPER_FREQ_Y={printer["tool T1"].params_input_shaper_freq_y} DAMPING_RATIO_Y={printer["tool T1"].params_input_shaper_damping_ratio_y}

   # RESPOND MSG="T1 after_change: is_printing={printer['gcode_macro _PRINT_TRACKER'].is_printing}"

    # Set retraction - use slicer values if printing, config defaults otherwise
    {% if printer["gcode_macro _PRINT_TRACKER"].is_printing %}
      {% set rmap = printer["gcode_macro _SLICER_TOOL_PARAMS"].retract %}
     # RESPOND MSG="T1 retract map={rmap}"
      {% if '1' in rmap %}
        {% set r = rmap['1'] %}
    #    RESPOND MSG="T1 using slicer retract len={r['length']} speed={r['speed']} unretract={r['unretract']}"
        SET_RETRACTION RETRACT_LENGTH={r['length']} RETRACT_SPEED={r['speed']} UNRETRACT_EXTRA_LENGTH={printer["tool T1"].params_unretract_extra_length} UNRETRACT_SPEED={r['unretract']}
      {% else %}
   #     RESPOND MSG="T1 using default retract len={printer['tool T1'].params_retract_length} speed={printer['tool T1'].params_retract_speed} unretract={printer['tool T1'].params_unretract_speed}"
        SET_RETRACTION RETRACT_LENGTH={printer["tool T1"].params_retract_length} RETRACT_SPEED={printer["tool T1"].params_retract_speed} UNRETRACT_EXTRA_LENGTH={printer["tool T1"].params_unretract_extra_length} UNRETRACT_SPEED={printer["tool T1"].params_unretract_speed}
      {% endif %}
    {% else %}
    #  RESPOND MSG="T1 not printing, using default retract len={printer['tool T1'].params_retract_length} speed={printer['tool T1'].params_retract_speed} unretract={printer['tool T1'].params_unretract_speed}"
      SET_RETRACTION RETRACT_LENGTH={printer["tool T1"].params_retract_length} RETRACT_SPEED={printer["tool T1"].params_retract_speed} UNRETRACT_EXTRA_LENGTH={printer["tool T1"].params_unretract_extra_length} UNRETRACT_SPEED={printer["tool T1"].params_unretract_speed}
    {% endif %}

    # Set pressure advance - use slicer values if printing, config defaults otherwise
    {% if printer["gcode_macro _PRINT_TRACKER"].is_printing %}
      {% set pamap = printer["gcode_macro _SLICER_TOOL_PA"].pa %}
  #    RESPOND MSG="T1 PA map={pamap}"
      {% if '1' in pamap %}
   #     RESPOND MSG="T1 using slicer PA={pamap['1']}"
        SET_PRESSURE_ADVANCE EXTRUDER={printer["tool T1"].extruder} ADVANCE={pamap['1']}
      {% else %}
  #      RESPOND MSG="T1 using default PA={printer[printer['tool T1'].extruder].pressure_advance}"
        SET_PRESSURE_ADVANCE EXTRUDER={printer["tool T1"].extruder} ADVANCE={printer[printer["tool T1"].extruder].pressure_advance}
      {% endif %}
    {% else %}
#      RESPOND MSG="T1 not printing, using default PA={printer[printer['tool T1'].extruder].pressure_advance}"
      SET_PRESSURE_ADVANCE EXTRUDER={printer["tool T1"].extruder} ADVANCE={printer[printer["tool T1"].extruder].pressure_advance}
    {% endif %}

    # Purge and clean nozzle if printing (only if homed)
    {% if printer["gcode_macro _PRINT_TRACKER"].is_printing %}
      {% if 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes and 'z' in printer.toolhead.homed_axes %}
        #CLEAN_NOZZLE PURGE=50 WIPE=5
      {% endif %}
    {% endif %}

################################################################################
# TOOL 1 MACRO
################################################################################
[gcode_macro T1]
variable_active: 0
variable_color: ""
variable_spool_id: None
gcode:

    RESPOND MSG="========== TOOL CHANGE =========="
    RESPOND MSG="Selected: T1"

    {% set pa = printer["gcode_macro _SLICER_TOOL_PA"].pa.get('1', 'default') %}
    {% set r = printer["gcode_macro _SLICER_TOOL_PARAMS"].retract.get('1', {}) %}

    RESPOND MSG="PA: {pa}"
    RESPOND MSG="Retract: {r.get('length','default')}mm"

    {% set svv = printer.save_variables.variables %}
    SELECT_TOOL T=1
    
    {% if svv.t1__spool_id is defined and svv.t1__spool_id %}
        SET_GCODE_VARIABLE MACRO=T1 VARIABLE=spool_id VALUE={svv.t1__spool_id}
        SET_ACTIVE_SPOOL ID={svv.t1__spool_id}
    {% endif %}
# [gcode_macro T1]
# variable_active: 0
# variable_color: ""
# variable_spool_id: None
# gcode:
#     {% set svv = printer.save_variables.variables %}
#     SELECT_TOOL T=1
#     {% if svv.t1__spool_id is defined and svv.t1__spool_id %}
#         SET_GCODE_VARIABLE MACRO=T1 VARIABLE=spool_id VALUE={svv.t1__spool_id}
#         SET_ACTIVE_SPOOL ID={svv.t1__spool_id}
#     {% endif %}

################################################################################
# TOOL 1 ACCELEROMETER (ADXL345)
################################################################################

[adxl345 tool1]
cs_pin: tool1:PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x, z, -y