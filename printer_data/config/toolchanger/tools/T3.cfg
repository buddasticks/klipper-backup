
################################################################################
#                    TOOL CHANGER CONFIGURATION - TOOL 3                       #
#                              Sovol SV08 Printer                              #
################################################################################

################################################################################
# TOOL 3 MICROCONTROLLER (BigTreeTech EBB CAN V1.2)
################################################################################

[mcu tool3]
canbus_uuid: fefa57fa0cd6   # Run: ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0

################################################################################
# TOOL 3 EXTRUDER CONFIGURATION
################################################################################

[extruder3]
step_pin: tool3:PD0
dir_pin: !tool3:PD1
enable_pin: !tool3:PD2
heater_pin: tool3:PB13
sensor_pin: tool3:PA3
sensor_type: ATC Semitec 104NT-4-R025H42G
pullup_resistor: 4700
full_steps_per_rotation: 200
microsteps: 16

rotation_distance: 22.67895
gear_ratio: 50:10

nozzle_diameter: 0.400
filament_diameter: 1.75
min_temp: 0
max_temp: 305
max_power: 1.0
min_extrude_temp: 30

max_extrude_only_distance: 1500
max_extrude_cross_section: 10
max_extrude_only_velocity: 75
max_extrude_only_accel: 1500

# control: pid
# pid_Kp: 32.094
# pid_Ki: 11.260
# pid_Kd: 22.868
pressure_advance: 0.02
pressure_advance_smooth_time: 0.035

################################################################################
# TOOL 3 EXTRUDER STEPPER DRIVER (TMC2209)
################################################################################

[tmc2209 extruder3]
uart_pin: tool3:PA15
interpolate: True
run_current: 0.65
sense_resistor: 0.150

################################################################################
# TOOL 3 HEATER SAFETY VERIFICATION
################################################################################

[verify_heater extruder3]
max_error: 120
check_gain_time: 20
hysteresis: 5
heating_gain: 2

################################################################################
# TOOL 3 TEMPERATURE MONITORING
################################################################################

[temperature_sensor Tool_3_Temp]
sensor_type: temperature_mcu
sensor_mcu: tool3

################################################################################
# TOOL 3 PART COOLING FAN
################################################################################

[fan_generic t3_partfan]
pin: tool3:PA0

################################################################################
# TOOL 3 HOTEND COOLING FAN
################################################################################

# [heater_fan t3_hotend_fan]
# pin: tool3:PA1
# max_power: 1.0
# kick_start_time: 0.5
# heater: extruder3
# heater_temp: 45.0

################################################################################
# TOOL 3 DEFINITION
################################################################################

[tool T3]
tool_number: 3
params_accel: 'tool3'
extruder: extruder3
fan: t3_partfan
detection_pin: ^!tool3:PB6

# params_park_x: 263.8
# params_park_y: 10.4
# params_park_z: 315.0


gcode_x_offset: -0.030
gcode_y_offset: -0.935
gcode_z_offset: 1.128


params_retract_length: 0.7
params_retract_speed: 30
params_unretract_extra_length: 0
params_unretract_speed: 30

params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 55.8
params_input_shaper_damping_ratio_x: 0.070

params_input_shaper_type_y: 'ei'
params_input_shaper_freq_y: 47.8
params_input_shaper_damping_ratio_y: 0.134

after_change_gcode:
    # Set input shaper for T3
    SET_INPUT_SHAPER SHAPER_TYPE_X={printer["tool T3"].params_input_shaper_type_x} SHAPER_FREQ_X={printer["tool T3"].params_input_shaper_freq_x} DAMPING_RATIO_X={printer["tool T3"].params_input_shaper_damping_ratio_x} SHAPER_TYPE_Y={printer["tool T3"].params_input_shaper_type_y} SHAPER_FREQ_Y={printer["tool T3"].params_input_shaper_freq_y} DAMPING_RATIO_Y={printer["tool T3"].params_input_shaper_damping_ratio_y}

    #RESPOND MSG="T3 after_change: is_printing={printer['gcode_macro _PRINT_TRACKER'].is_printing}"

    # Set retraction - use slicer values if printing, config defaults otherwise
    {% if printer["gcode_macro _PRINT_TRACKER"].is_printing %}
      {% set rmap = printer["gcode_macro _SLICER_TOOL_PARAMS"].retract %}
      #RESPOND MSG="T3 retract map={rmap}"
      {% if '3' in rmap %}
        {% set r = rmap['3'] %}
        #RESPOND MSG="T3 using slicer retract len={r['length']} speed={r['speed']} unretract={r['unretract']}"
        SET_RETRACTION RETRACT_LENGTH={r['length']} RETRACT_SPEED={r['speed']} UNRETRACT_EXTRA_LENGTH={printer["tool T3"].params_unretract_extra_length} UNRETRACT_SPEED={r['unretract']}
      {% else %}
        #RESPOND MSG="T3 using default retract len={printer['tool T3'].params_retract_length} speed={printer['tool T3'].params_retract_speed} unretract={printer['tool T3'].params_unretract_speed}"
        SET_RETRACTION RETRACT_LENGTH={printer["tool T3"].params_retract_length} RETRACT_SPEED={printer["tool T3"].params_retract_speed} UNRETRACT_EXTRA_LENGTH={printer["tool T3"].params_unretract_extra_length} UNRETRACT_SPEED={printer["tool T3"].params_unretract_speed}
      {% endif %}
    {% else %}
      #RESPOND MSG="T3 not printing, using default retract len={printer['tool T3'].params_retract_length} speed={printer['tool T3'].params_retract_speed} unretract={printer['tool T3'].params_unretract_speed}"
      SET_RETRACTION RETRACT_LENGTH={printer["tool T3"].params_retract_length} RETRACT_SPEED={printer["tool T3"].params_retract_speed} UNRETRACT_EXTRA_LENGTH={printer["tool T3"].params_unretract_extra_length} UNRETRACT_SPEED={printer["tool T3"].params_unretract_speed}
    {% endif %}

    # Set pressure advance - use slicer values if printing, config defaults otherwise
    {% if printer["gcode_macro _PRINT_TRACKER"].is_printing %}
      {% set pamap = printer["gcode_macro _SLICER_TOOL_PA"].pa %}
      #RESPOND MSG="T3 PA map={pamap}"
      {% if '3' in pamap %}
        #RESPOND MSG="T3 using slicer PA={pamap['3']}"
        SET_PRESSURE_ADVANCE EXTRUDER={printer["tool T3"].extruder} ADVANCE={pamap['3']}
      {% else %}
        #RESPOND MSG="T3 using default PA={printer[printer['tool T3'].extruder].pressure_advance}"
        SET_PRESSURE_ADVANCE EXTRUDER={printer["tool T3"].extruder} ADVANCE={printer[printer["tool T3"].extruder].pressure_advance}
      {% endif %}
    {% else %}
      #RESPOND MSG="T3 not printing, using default PA={printer[printer['tool T3'].extruder].pressure_advance}"
      SET_PRESSURE_ADVANCE EXTRUDER={printer["tool T3"].extruder} ADVANCE={printer[printer["tool T3"].extruder].pressure_advance}
    {% endif %}

    # Purge and clean nozzle if printing (only if homed)
    {% if printer["gcode_macro _PRINT_TRACKER"].is_printing %}
      {% if 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes and 'z' in printer.toolhead.homed_axes %}
        #CLEAN_NOZZLE PURGE=50 WIPE=5
      {% endif %}
    {% endif %}

################################################################################
# TOOL 3 MACRO
################################################################################
[gcode_macro T3]
variable_active: 0
variable_color: ""
variable_spool_id: None
gcode:

    RESPOND MSG="========== TOOL CHANGE =========="
    RESPOND MSG="Selected: T3"

    {% set pa = printer["gcode_macro _SLICER_TOOL_PA"].pa.get('3', 'default') %}
    {% set r = printer["gcode_macro _SLICER_TOOL_PARAMS"].retract.get('3', {}) %}

    RESPOND MSG="PA: {pa}"
    RESPOND MSG="Retract: {r.get('length','default')}mm"

    {% set svv = printer.save_variables.variables %}
    SELECT_TOOL T=3
    
    {% if svv.t3__spool_id is defined and svv.t3__spool_id %}
        SET_GCODE_VARIABLE MACRO=T3 VARIABLE=spool_id VALUE={svv.t3__spool_id}
        SET_ACTIVE_SPOOL ID={svv.t3__spool_id}
    {% endif %}

