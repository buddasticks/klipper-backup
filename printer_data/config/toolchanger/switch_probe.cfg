# Scanner/detect-only mode - Cartographer handles all probing.
# switch_probe pins are used only for tool presence + crash detection.


# Crash detection is configured on the bare [switch_probe] section
# and is off until START_CRASH_DETECTION is called - see
# SwitchProbeBase for details.
[switch_probe]
crash_gcode:
     M117 Crash detected!
recover_gcode:
     M117 Tool recovered, resuming.
crash_debounce_delay: 0.05
#     Seconds a pin change must persist before it counts. This delays
#     the crash response by the same amount - the toolhead keeps moving
#     meanwhile - so raise it only as far as noise actually requires.
#
scanner: True
#     Set when a scanning probe (Cartographer, Beacon, ...) is the
#     printer's probe. That scanner does all the probing; every
#     [switch_probe <tool>] section becomes detection-only, needing
#     just 'pin' (plus optional 'tool' and 'flip_trigger'). Any
#     leftover probing options are ignored with a warning in klippy.log.
#     Leave the scanner's own register_as_probe at its default.


# [switch_probe]
# scanner: True
# crash_gcode:
#     M117 Crash detected!
#     STOP_CRASH_DETECTION
# recover_gcode:
#     M117 Tool recovered.
# crash_debounce_delay: 0.05

[switch_probe T0]
pin: ^!tool0:PB6
tool: 0
flip_trigger: True

[switch_probe T1]
pin: ^!tool1:PB6
tool: 1
flip_trigger: True

[switch_probe T2]
pin: ^!tool2:PB6
tool: 2

[gcode_macro INITIALIZE_TOOLCHANGER]
rename_existing: INITIALIZE_TOOLCHANGER_ORIG
gcode:
    DETECT_ACTIVE_SWITCH_PROBE
    _INITIALIZE_TOOLCHANGER_FROM_PROBE

[gcode_macro _INITIALIZE_TOOLCHANGER_FROM_PROBE]
gcode:
    {% if printer.switch_probe.detected_tool_number | int == -1 %}
        RESPOND TYPE=error MSG='switch_probe: no tool detected at startup'
        INITIALIZE_TOOLCHANGER_ORIG
    {% else %}
        RESPOND TYPE=echo MSG='switch_probe: initializing from detected tool T{printer.switch_probe.detected_tool_number}'
        INITIALIZE_TOOLCHANGER_ORIG T={printer.switch_probe.detected_tool_number}
    {% endif %}
