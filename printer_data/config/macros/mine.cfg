[z_thermal_adjust]
# Start with a conservative estimate for SV08 aluminum uprights
# ~400mm vertical extrusion * 23e-6 /°C ≈ 0.0092 mm/°C
# Actual will vary based on gantry geometry; calibrate empirically.
temp_coeff: 0.060

smooth_time: 3.0
z_adjust_off_above: 10.0      # Disable above 10mm — first-layer compensation only
max_z_adjustment: 0.4         # Hard safety limit

# Sensor: Generic 3950 thermistor taped to rear vertical extrusion
sensor_type: Generic 3950
sensor_pin: hexa:PA3               # <-- CHANGE THIS to an available ADC pin on your board
min_temp: 0
max_temp: 100
gcode_id: FRAME



# -------------------------------------------------------------
# 1. SSR TEMPERATURE-CONTROLLED FAN (Using Mainboard PA2)
# -------------------------------------------------------------
[temperature_fan SSR_fan]
pin: PA2                             # Stock SV08 Exhaust Fan port
max_power: 0.40                      # STRICTLY CRITICAL: Protects your 12V 4010 fan from 24V!
shutdown_speed: 0.0                  # CORRECT OPTION: Safely shuts the fan off if Klipper crashes
hardware_pwm: false                  # Software PWM prevents harsh motor whining on mismatched voltages
cycle_time: 0.01                    # Softens the pulses for a smoother, quieter fan spin
min_speed: 0.0
kick_start_time: 0.15       
sensor_type: Generic 3950            
sensor_pin: hexa:PA0                 # Linked to your Hexa board sensor
control: pid                        # FIXED: Removed the duplicate duplicate line
pid_Kp: 2.0                         # PID proportional value
pid_Ki: 5.0                         # PID integral value
pid_Kd: 0.5                         # PID derivative value
pid_deriv_time: 2.0                 # Derivative time constant
target_temp: 35                   # Automatically spins up when the SSR heatsink reaches 50°C
min_temp: 0
max_temp: 90



  
################################################################################
# CARTOGRAPHER MACROS
################################################################################

[gcode_macro BACKLASH5]
description: Cartographer backlash test at 4 corners and center
gcode:
  G90
  G28

  G1 Z10 F600

  M118 BACKLASH_FL
  G1 X40 Y40 F12000
  CARTOGRAPHER_ESTIMATE_BACKLASH CALIBRATE=no ITERATIONS=15 DELTA=0.2

  G1 Z10 F600
  M118 BACKLASH_FR
  G1 X310 Y40 F12000
  CARTOGRAPHER_ESTIMATE_BACKLASH CALIBRATE=no ITERATIONS=15 DELTA=0.2

  G1 Z10 F600
  M118 BACKLASH_RR
  G1 X310 Y300 F12000
  CARTOGRAPHER_ESTIMATE_BACKLASH CALIBRATE=no ITERATIONS=15 DELTA=0.2

  G1 Z10 F600
  M118 BACKLASH_RL
  G1 X40 Y300 F12000
  CARTOGRAPHER_ESTIMATE_BACKLASH CALIBRATE=no ITERATIONS=15 DELTA=0.2

  G1 Z10 F600
  M118 BACKLASH_CENTER
  G1 X175 Y175 F12000
  CARTOGRAPHER_ESTIMATE_BACKLASH CALIBRATE=no ITERATIONS=15 DELTA=0.2

  G1 Z10 F600
  M118 BACKLASH_DONE

  

[gcode_macro AXIS_TWIST_CALIBRATE_ALL]
description: Calibrate X and Y axis twist with Cartographer
gcode:
    RESPOND MSG="Homing..."
    G28

    RESPOND MSG="Running QGL..."
    QUAD_GANTRY_LEVEL
    G28 Z

    RESPOND MSG="Starting X Axis Twist Compensation..."
    CARTOGRAPHER_AXIS_TWIST_COMPENSATION AXIS=X

    RESPOND MSG="X Axis Complete"

    G28 Z

    RESPOND MSG="Starting Y Axis Twist Compensation..."
    CARTOGRAPHER_AXIS_TWIST_COMPENSATION AXIS=Y

    RESPOND MSG="Y Axis Complete"

    RESPOND MSG="Run SAVE_CONFIG to store results"

################################################################################
# CLEAR LOG MACROS
################################################################################

# Klipper macro to clear klippy.log
# Add this to your printer.cfg or include it as a separate config file

[gcode_shell_command clear_klippy_log]
command: sh -c 'truncate -s 0 /home/biqu/printer_data/logs/klippy.log'
timeout: 5.0
verbose: True

[gcode_macro CLEAR_KLIPPY_LOG]
description: Clear the klippy.log file
gcode:
    RUN_SHELL_COMMAND CMD=clear_klippy_log
    RESPOND MSG="Klippy.log cleared"
    




################################################################################
# MOVEMENT MACROS
################################################################################

[gcode_macro MOVE_TO_CENTER]
description: Moves the toolhead to the center of the build plate
gcode:
  {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
  {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
  home_if_needed
  G90  # Absolute positioning mode
  G0 X{max_x//2} Y{max_y//2} F12000



[gcode_macro home_if_needed]
description: Homes all axes only if not already homed
gcode:
  {% if printer.toolhead.homed_axes == "xyz" %}
    M118 HOME_IF_NEEDED - Printer is already homed
  {% else %}
    G28  # Home all axes
  {% endif %}


[gcode_macro QGL_IF_NEEDED]
description: Runs QGL only if not already leveled
gcode:
  {% if printer.quad_gantry_level.applied %}
    M118 QGL_IF_NEEDED - Quad gantry is already leveled
  {% else %}
    HOME_IF_NEEDED  # Home first if not homed
    QUAD_GANTRY_LEVEL
  {% endif %}














