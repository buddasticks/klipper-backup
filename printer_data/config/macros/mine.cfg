[gcode_macro DIAL_ABORT]
description: Abort the dial probe grid
gcode:
    {action_respond_info("action:prompt_end")}
    SET_GCODE_VARIABLE MACRO=DIAL_PROBE_GRID VARIABLE=is_probing VALUE=0
    G90
    G0 Z{printer["gcode_macro DIAL_PROBE_GRID"].probe_z_height|float + 10} F{printer["gcode_macro DIAL_PROBE_GRID"].travel_speed|int}
    RESTORE_GCODE_STATE NAME=dial_probe_state MOVE=1
    RESPOND TYPE=command MSG="DIAL_PROBE_ABORTED"


[gcode_macro DIAL_STATUS]
description: Show current probe position
gcode:
    {% set x_idx = printer["gcode_macro DIAL_PROBE_GRID"].current_x_index|int %}
    {% set y_idx = printer["gcode_macro DIAL_PROBE_GRID"].current_y_index|int %}
    {% set size = printer["gcode_macro DIAL_PROBE_GRID"].grid_size|int %}
    {% set probing = printer["gcode_macro DIAL_PROBE_GRID"].is_probing|int %}
    
    {% set min_x = printer["gcode_macro DIAL_PROBE_GRID"].grid_min_x|float %}
    {% set max_x = printer["gcode_macro DIAL_PROBE_GRID"].grid_max_x|float %}
    {% set min_y = printer["gcode_macro DIAL_PROBE_GRID"].grid_min_y|float %}
    {% set max_y = printer["gcode_macro DIAL_PROBE_GRID"].grid_max_y|float %}
    
    {% set max_idx = size - 1 %}
    {% set x_step = (max_x - min_x) / max_idx %}
    {% set y_step = (max_y - min_y) / max_idx %}
    {% set current_x = min_x + (x_idx * x_step) %}
    {% set current_y = min_y + (y_idx * y_step) %}
    
    {% if probing %}
        RESPOND TYPE=command MSG="DIAL_PROBE_STATUS {size}x{size} grid Point X{x_idx} Y{y_idx}"
        RESPOND TYPE=command MSG="Position X{current_x|round(1)} Y{current_y|round(1)}"
        RESPOND TYPE=command MSG="Enter DIAL_ENTER_VALUE VALUE=0.05"
    {% else %}
        RESPOND TYPE=command MSG="DIAL_PROBE_STATUS Not probing. Run DIAL_PROBE_GRID to start."
    {% endif %}






# [z_thermal_adjust]
# # Start with a conservative estimate for SV08 aluminum uprights
# # ~400mm vertical extrusion * 23e-6 /°C ≈ 0.0092 mm/°C
# # Actual will vary based on gantry geometry; calibrate empirically.
# temp_coeff: 0.060

# smooth_time: 3.0
# z_adjust_off_above: 10.0      # Disable above 10mm — first-layer compensation only
# max_z_adjustment: 0.4         # Hard safety limit

# # Sensor: Generic 3950 thermistor taped to rear vertical extrusion
# sensor_type: Generic 3950
# sensor_pin: hexa:PA3               # <-- CHANGE THIS to an available ADC pin on your board
# min_temp: 0
# max_temp: 100
# gcode_id: FRAME



# -------------------------------------------------------------
# SSR TEMPERATURE-CONTROLLED FAN (Using Mainboard PA2)
# -------------------------------------------------------------
[temperature_fan SSR_fan]
pin: PA2                             # Stock SV08 Exhaust Fan port
max_power: 0.40                      # STRICTLY CRITICAL: Protects your 12V 4010 fan from 24V!
shutdown_speed: 0.0                  # CORRECT OPTION: Safely shuts the fan off if Klipper crashes
hardware_pwm: false                  # Software PWM prevents harsh motor whining on mismatched voltages
cycle_time: 0.01                    # Softens the pulses for a smoother, quieter fan spin
min_speed: 0.0
kick_start_time: 0.15       
sensor_type: Generic 3950            
sensor_pin: hexa:PA0                 # Linked to your Hexa board sensor
control: pid                        # FIXED: Removed the duplicate duplicate line
pid_Kp: 2.0                         # PID proportional value
pid_Ki: 5.0                         # PID integral value
pid_Kd: 0.5                         # PID derivative value
pid_deriv_time: 2.0                 # Derivative time constant
target_temp: 35                   # Automatically spins up when the SSR heatsink reaches 50°C
min_temp: 0
max_temp: 90



  
