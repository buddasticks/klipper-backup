# ============================================
# DIAL INDICATOR GANTRY SAG/BEND MAPPING
# 10x10 or 5x5 Grid with Mainsail Popup UI
# ============================================

[gcode_macro DIAL_PROBE_GRID]
description: Run manual dial indicator grid probe (shows mesh size selector first)
variable_grid_min_x: 10
variable_grid_max_x: 290
variable_grid_min_y: 10
variable_grid_max_y: 290
variable_probe_z_height: 24.0
variable_travel_speed: 6000
variable_probe_speed: 1200
variable_dwell_ms: 500
variable_current_x_index: 0
variable_current_y_index: 0
variable_is_probing: 0
variable_grid_size: 10
variable_max_index: 9
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        {action_raise_error("Must home XYZ first!")}
    {% endif %}
    
    _DIAL_MESH_SELECTOR


[gcode_macro _DIAL_MESH_SELECTOR]
description: Show popup to select 10x10 or 5x5 mesh size
gcode:
    {% set ui = 'action:prompt_' %}
    
    {action_respond_info(ui ~ 'begin Dial Indicator — Select Mesh Size')}
    {action_respond_info(ui ~ 'text Choose your grid resolution:')}
    {action_respond_info(ui ~ 'text 10x10 = 100 points (higher detail, slower)')}
    {action_respond_info(ui ~ 'text 5x5 = 25 points (faster overview)')}
    
    {action_respond_info(ui ~ 'button_group_start')}
    {action_respond_info(ui ~ 'button [ 10 x 10 Mesh ]|_DIAL_START_MESH SIZE=10|rgba(120,200,140,0.90)')}
    {action_respond_info(ui ~ 'button [ 5 x 5 Mesh ]|_DIAL_START_MESH SIZE=5|rgba(200,180,100,0.85)')}
    {action_respond_info(ui ~ 'button_group_end')}
    
    {action_respond_info(ui ~ 'footer_button [ Cancel ]|DIAL_ABORT|rgba(210,110,110,0.85)')}
    {action_respond_info(ui ~ 'show')}


[gcode_macro _DIAL_START_MESH]
description: Internal: initialize and start the selected mesh
gcode:
    {% set size = params.SIZE|default(10)|int %}
    {% set max_idx = size - 1 %}
    
    SET_GCODE_VARIABLE MACRO=DIAL_PROBE_GRID VARIABLE=grid_size VALUE={size}
    SET_GCODE_VARIABLE MACRO=DIAL_PROBE_GRID VARIABLE=max_index VALUE={max_idx}
    SET_GCODE_VARIABLE MACRO=DIAL_PROBE_GRID VARIABLE=current_x_index VALUE=0
    SET_GCODE_VARIABLE MACRO=DIAL_PROBE_GRID VARIABLE=current_y_index VALUE=0
    SET_GCODE_VARIABLE MACRO=DIAL_PROBE_GRID VARIABLE=is_probing VALUE=1
    
    SAVE_GCODE_STATE NAME=dial_probe_state
    
    G90
    G0 Z{printer["gcode_macro DIAL_PROBE_GRID"].probe_z_height + 5} F{printer["gcode_macro DIAL_PROBE_GRID"].travel_speed}
    
    _DIAL_MOVE_TO_POINT X_INDEX=0 Y_INDEX=0
    _DIAL_PROBE_UI


[gcode_macro _DIAL_MOVE_TO_POINT]
gcode:
    {% set x_idx = params.X_INDEX|int %}
    {% set y_idx = params.Y_INDEX|int %}
    {% set size = printer["gcode_macro DIAL_PROBE_GRID"].grid_size|int %}
    {% set max_idx = printer["gcode_macro DIAL_PROBE_GRID"].max_index|int %}
    
    {% set min_x = printer["gcode_macro DIAL_PROBE_GRID"].grid_min_x|float %}
    {% set max_x = printer["gcode_macro DIAL_PROBE_GRID"].grid_max_x|float %}
    {% set min_y = printer["gcode_macro DIAL_PROBE_GRID"].grid_min_y|float %}
    {% set max_y = printer["gcode_macro DIAL_PROBE_GRID"].grid_max_y|float %}
    
    {% set x_step = (max_x - min_x) / max_idx %}
    {% set y_step = (max_y - min_y) / max_idx %}
    
    {% set target_x = min_x + (x_idx * x_step) %}
    {% set target_y = min_y + (y_idx * y_step) %}
    {% set z_height = printer["gcode_macro DIAL_PROBE_GRID"].probe_z_height|float %}
    {% set travel_speed = printer["gcode_macro DIAL_PROBE_GRID"].travel_speed|int %}
    
    G90
    G0 X{target_x} Y{target_y} F{travel_speed}
    G0 Z{z_height} F{printer["gcode_macro DIAL_PROBE_GRID"].probe_speed|int}
    G4 P{printer["gcode_macro DIAL_PROBE_GRID"].dwell_ms|int}


[gcode_macro DIAL_ENTER_VALUE]
description: Enter the dial indicator reading at current position and continue
variable_last_value: 0.0
gcode:
    {% set value = params.VALUE|float %}
    {% set x_idx = printer["gcode_macro DIAL_PROBE_GRID"].current_x_index|int %}
    {% set y_idx = printer["gcode_macro DIAL_PROBE_GRID"].current_y_index|int %}
    {% set skip = params.SKIP|default(0)|int %}
    {% set size = printer["gcode_macro DIAL_PROBE_GRID"].grid_size|int %}
    
    SET_GCODE_VARIABLE MACRO=DIAL_ENTER_VALUE VARIABLE=last_value VALUE={value}
    
    {% if skip %}
        RESPOND TYPE=command MSG="DIAL_PROBE_DATA X={x_idx} Y={y_idx} VALUE={value} GRID={size}x{size} SKIPPED"
    {% else %}
        RESPOND TYPE=command MSG="DIAL_PROBE_DATA X={x_idx} Y={y_idx} VALUE={value} GRID={size}x{size}"
    {% endif %}
    
    _DIAL_ADVANCE_GRID


[gcode_macro _DIAL_ADVANCE_GRID]
gcode:
    {% set x_idx = printer["gcode_macro DIAL_PROBE_GRID"].current_x_index|int %}
    {% set y_idx = printer["gcode_macro DIAL_PROBE_GRID"].current_y_index|int %}
    {% set max_idx = printer["gcode_macro DIAL_PROBE_GRID"].max_index|int %}
    {% set size = printer["gcode_macro DIAL_PROBE_GRID"].grid_size|int %}
    
    {% if y_idx % 2 == 0 %}
        {% if x_idx < max_idx %}
            {% set next_x = x_idx + 1 %}
            {% set next_y = y_idx %}
        {% else %}
            {% set next_x = max_idx %}
            {% set next_y = y_idx + 1 %}
        {% endif %}
    {% else %}
        {% if x_idx > 0 %}
            {% set next_x = x_idx - 1 %}
            {% set next_y = y_idx %}
        {% else %}
            {% set next_x = 0 %}
            {% set next_y = y_idx + 1 %}
        {% endif %}
    {% endif %}
    
    {% if next_y > max_idx %}
        {action_respond_info("action:prompt_end")}
        SET_GCODE_VARIABLE MACRO=DIAL_PROBE_GRID VARIABLE=is_probing VALUE=0
        RESPOND TYPE=command MSG="DIAL_PROBE_COMPLETE {size}x{size} grid finished!"
        
        G90
        G0 Z{printer["gcode_macro DIAL_PROBE_GRID"].probe_z_height|float + 10} F{printer["gcode_macro DIAL_PROBE_GRID"].travel_speed|int}
        RESTORE_GCODE_STATE NAME=dial_probe_state MOVE=1
    {% else %}
        SET_GCODE_VARIABLE MACRO=DIAL_PROBE_GRID VARIABLE=current_x_index VALUE={next_x}
        SET_GCODE_VARIABLE MACRO=DIAL_PROBE_GRID VARIABLE=current_y_index VALUE={next_y}
        
        _DIAL_MOVE_TO_POINT X_INDEX={next_x} Y_INDEX={next_y}
        _DIAL_PROBE_UI
    {% endif %}


[gcode_macro _DIAL_PROBE_UI]
description: Show Mainsail popup UI for current dial probe point
gcode:
    {% set x_idx = printer["gcode_macro DIAL_PROBE_GRID"].current_x_index|int %}
    {% set y_idx = printer["gcode_macro DIAL_PROBE_GRID"].current_y_index|int %}
    {% set size = printer["gcode_macro DIAL_PROBE_GRID"].grid_size|int %}
    {% set max_idx = printer["gcode_macro DIAL_PROBE_GRID"].max_index|int %}
    
    {% set min_x = printer["gcode_macro DIAL_PROBE_GRID"].grid_min_x|float %}
    {% set max_x = printer["gcode_macro DIAL_PROBE_GRID"].grid_max_x|float %}
    {% set min_y = printer["gcode_macro DIAL_PROBE_GRID"].grid_min_y|float %}
    {% set max_y = printer["gcode_macro DIAL_PROBE_GRID"].grid_max_y|float %}
    
    {% set x_step = (max_x - min_x) / max_idx %}
    {% set y_step = (max_y - min_y) / max_idx %}
    {% set current_x = min_x + (x_idx * x_step) %}
    {% set current_y = min_y + (y_idx * y_step) %}
    {% set point_num = (y_idx * size) + x_idx + 1 %}
    {% set total_points = size * size %}
    
    {% set ui = 'action:prompt_' %}
    
    {action_respond_info(ui ~ 'begin Dial Indicator — Point ' ~ point_num ~ ' / ' ~ total_points ~ ' (' ~ size ~ 'x' ~ size ~ ')')}
    {action_respond_info(ui ~ 'text Grid: [X' ~ x_idx ~ ', Y' ~ y_idx ~ ']  |  Physical: X=' ~ current_x|round(1) ~ ' Y=' ~ current_y|round(1))}
