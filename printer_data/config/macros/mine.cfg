# ============================================
# DIAL INDICATOR GANTRY SAG/BEND MAPPING
# 10x10 Grid with Manual Value Entry
# ============================================

[gcode_macro DIAL_PROBE_GRID]
description: Run 10x10 manual dial indicator grid probe
variable_grid_min_x: 30
variable_grid_max_x: 290
variable_grid_min_y: 30
variable_grid_max_y: 290
variable_probe_z_height: 20.0
variable_travel_speed: 6000
variable_probe_speed: 1200
variable_dwell_ms: 500
variable_current_x_index: 0
variable_current_y_index: 0
variable_is_probing: 0
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        {action_raise_error("Must home XYZ first!")}
    {% endif %}
    
    SET_GCODE_VARIABLE MACRO=DIAL_PROBE_GRID VARIABLE=current_x_index VALUE=0
    SET_GCODE_VARIABLE MACRO=DIAL_PROBE_GRID VARIABLE=current_y_index VALUE=0
    SET_GCODE_VARIABLE MACRO=DIAL_PROBE_GRID VARIABLE=is_probing VALUE=1
    
    SAVE_GCODE_STATE NAME=dial_probe_state
    
    G90
    G0 Z{probe_z_height + 5} F{travel_speed}
    
    # Move to first point and STOP - wait for user input
    _DIAL_MOVE_TO_POINT X_INDEX=0 Y_INDEX=0
    
    {action_respond_info("DIAL_PROBE: At point [X0, Y0]. Read dial and enter: DIAL_ENTER_VALUE VALUE=<reading>")}


[gcode_macro _DIAL_MOVE_TO_POINT]
gcode:
    {% set x_idx = params.X_INDEX|int %}
    {% set y_idx = params.Y_INDEX|int %}
    
    {% set min_x = printer["gcode_macro DIAL_PROBE_GRID"].grid_min_x|float %}
    {% set max_x = printer["gcode_macro DIAL_PROBE_GRID"].grid_max_x|float %}
    {% set min_y = printer["gcode_macro DIAL_PROBE_GRID"].grid_min_y|float %}
    {% set max_y = printer["gcode_macro DIAL_PROBE_GRID"].grid_max_y|float %}
    
    {% set x_step = (max_x - min_x) / 9 %}
    {% set y_step = (max_y - min_y) / 9 %}
    
    {% set target_x = min_x + (x_idx * x_step) %}
    {% set target_y = min_y + (y_idx * y_step) %}
    {% set z_height = printer["gcode_macro DIAL_PROBE_GRID"].probe_z_height|float %}
    {% set travel_speed = printer["gcode_macro DIAL_PROBE_GRID"].travel_speed|int %}
    
    G90
    G0 X{target_x} Y{target_y} F{travel_speed}
    G0 Z{z_height} F{printer["gcode_macro DIAL_PROBE_GRID"].probe_speed|int}
    G4 P{printer["gcode_macro DIAL_PROBE_GRID"].dwell_ms|int}


[gcode_macro DIAL_ENTER_VALUE]
description: Enter the dial indicator reading at current position and continue
variable_last_value: 0.0
gcode:
    {% set value = params.VALUE|float %}
    {% set x_idx = printer["gcode_macro DIAL_PROBE_GRID"].current_x_index|int %}
    {% set y_idx = printer["gcode_macro DIAL_PROBE_GRID"].current_y_index|int %}
    
    SET_GCODE_VARIABLE MACRO=DIAL_ENTER_VALUE VARIABLE=last_value VALUE={value}
    
    {action_respond_info("DIAL_PROBE_POINT X={x_idx} Y={y_idx} VALUE={value}")}
    
    # Now advance to next point
    _DIAL_ADVANCE_GRID


[gcode_macro _DIAL_ADVANCE_GRID]
gcode:
    {% set x_idx = printer["gcode_macro DIAL_PROBE_GRID"].current_x_index|int %}
    {% set y_idx = printer["gcode_macro DIAL_PROBE_GRID"].current_y_index|int %}
    
    # Snake pattern: even rows left->right, odd rows right->left
    {% if y_idx % 2 == 0 %}
        {% if x_idx < 9 %}
            {% set next_x = x_idx + 1 %}
            {% set next_y = y_idx %}
        {% else %}
            {% set next_x = 9 %}
            {% set next_y = y_idx + 1 %}
        {% endif %}
    {% else %}
        {% if x_idx > 0 %}
            {% set next_x = x_idx - 1 %}
            {% set next_y = y_idx %}
        {% else %}
            {% set next_x = 0 %}
            {% set next_y = y_idx + 1 %}
        {% endif %}
    {% endif %}
    
    {% if next_y >= 10 %}
        SET_GCODE_VARIABLE MACRO=DIAL_PROBE_GRID VARIABLE=is_probing VALUE=0
        {action_respond_info("DIAL_PROBE_COMPLETE: All 100 points measured!")}
        
        G90
        G0 Z{printer["gcode_macro DIAL_PROBE_GRID"].probe_z_height|float + 10} F{printer["gcode_macro DIAL_PROBE_GRID"].travel_speed|int}
        RESTORE_GCODE_STATE NAME=dial_probe_state MOVE=1
    {% else %}
        SET_GCODE_VARIABLE MACRO=DIAL_PROBE_GRID VARIABLE=current_x_index VALUE={next_x}
        SET_GCODE_VARIABLE MACRO=DIAL_PROBE_GRID VARIABLE=current_y_index VALUE={next_y}
        
        _DIAL_MOVE_TO_POINT X_INDEX={next_x} Y_INDEX={next_y}
        
        {action_respond_info("DIAL_PROBE: At point [X{next_x}, Y{next_y}]. Read dial and enter: DIAL_ENTER_VALUE VALUE=<reading>")}
    {% endif %}


[gcode_macro DIAL_ABORT]
description: Abort the dial probe grid
gcode:
    SET_GCODE_VARIABLE MACRO=DIAL_PROBE_GRID VARIABLE=is_probing VALUE=0
    G90
    G0 Z{printer["gcode_macro DIAL_PROBE_GRID"].probe_z_height|float + 10} F{printer["gcode_macro DIAL_PROBE_GRID"].travel_speed|int}
    RESTORE_GCODE_STATE NAME=dial_probe_state MOVE=1
    {action_respond_info("DIAL_PROBE_ABORTED")}


[gcode_macro DIAL_STATUS]
description: Show current probe position
gcode:
    {% set x_idx = printer["gcode_macro DIAL_PROBE_GRID"].current_x_index|int %}
    {% set y_idx = printer["gcode_macro DIAL_PROBE_GRID"].current_y_index|int %}
    {% set probing = printer["gcode_macro DIAL_PROBE_GRID"].is_probing|int %}
    
    {% set min_x = printer["gcode_macro DIAL_PROBE_GRID"].grid_min_x|float %}
    {% set max_x = printer["gcode_macro DIAL_PROBE_GRID"].grid_max_x|float %}
    {% set min_y = printer["gcode_macro DIAL_PROBE_GRID"].grid_min_y|float %}
    {% set max_y = printer["gcode_macro DIAL_PROBE_GRID"].grid_max_y|float %}
    
    {% set x_step = (max_x - min_x) / 9 %}
    {% set y_step = (max_y - min_y) / 9 %}
    {% set current_x = min_x + (x_idx * x_step) %}
    {% set current_y = min_y + (y_idx * y_step) %}
    
    {% if probing %}
        {action_respond_info("DIAL_PROBE_STATUS: Point [X{x_idx}, Y{y_idx}] of 10x10")}
        {action_respond_info("Position: X={current_x:.1f}, Y={current_y:.1f}")}
        {action_respond_info("Enter: DIAL_ENTER_VALUE VALUE=<reading>")}
    {% else %}
        {action_respond_info("DIAL_PROBE_STATUS: Not probing. Run DIAL_PROBE_GRID to start.")}
    {% endif %}












# [z_thermal_adjust]
# # Start with a conservative estimate for SV08 aluminum uprights
# # ~400mm vertical extrusion * 23e-6 /°C ≈ 0.0092 mm/°C
# # Actual will vary based on gantry geometry; calibrate empirically.
# temp_coeff: 0.060

# smooth_time: 3.0
# z_adjust_off_above: 10.0      # Disable above 10mm — first-layer compensation only
# max_z_adjustment: 0.4         # Hard safety limit

# # Sensor: Generic 3950 thermistor taped to rear vertical extrusion
# sensor_type: Generic 3950
# sensor_pin: hexa:PA3               # <-- CHANGE THIS to an available ADC pin on your board
# min_temp: 0
# max_temp: 100
# gcode_id: FRAME



# -------------------------------------------------------------
# 1. SSR TEMPERATURE-CONTROLLED FAN (Using Mainboard PA2)
# -------------------------------------------------------------
[temperature_fan SSR_fan]
pin: PA2                             # Stock SV08 Exhaust Fan port
max_power: 0.40                      # STRICTLY CRITICAL: Protects your 12V 4010 fan from 24V!
shutdown_speed: 0.0                  # CORRECT OPTION: Safely shuts the fan off if Klipper crashes
hardware_pwm: false                  # Software PWM prevents harsh motor whining on mismatched voltages
cycle_time: 0.01                    # Softens the pulses for a smoother, quieter fan spin
min_speed: 0.0
kick_start_time: 0.15       
sensor_type: Generic 3950            
sensor_pin: hexa:PA0                 # Linked to your Hexa board sensor
control: pid                        # FIXED: Removed the duplicate duplicate line
pid_Kp: 2.0                         # PID proportional value
pid_Ki: 5.0                         # PID integral value
pid_Kd: 0.5                         # PID derivative value
pid_deriv_time: 2.0                 # Derivative time constant
target_temp: 35                   # Automatically spins up when the SSR heatsink reaches 50°C
min_temp: 0
max_temp: 90



  
################################################################################
# CARTOGRAPHER MACROS
################################################################################

[gcode_macro BACKLASH5]
description: Cartographer backlash test at 4 corners and center
gcode:
  G90
  G28

  G1 Z10 F600

  M118 BACKLASH_FL
  G1 X40 Y40 F12000
  CARTOGRAPHER_ESTIMATE_BACKLASH CALIBRATE=no ITERATIONS=15 DELTA=0.2

  G1 Z10 F600
  M118 BACKLASH_FR
  G1 X310 Y40 F12000
  CARTOGRAPHER_ESTIMATE_BACKLASH CALIBRATE=no ITERATIONS=15 DELTA=0.2

  G1 Z10 F600
  M118 BACKLASH_RR
  G1 X310 Y300 F12000
  CARTOGRAPHER_ESTIMATE_BACKLASH CALIBRATE=no ITERATIONS=15 DELTA=0.2

  G1 Z10 F600
  M118 BACKLASH_RL
  G1 X40 Y300 F12000
  CARTOGRAPHER_ESTIMATE_BACKLASH CALIBRATE=no ITERATIONS=15 DELTA=0.2

  G1 Z10 F600
  M118 BACKLASH_CENTER
  G1 X175 Y175 F12000
  CARTOGRAPHER_ESTIMATE_BACKLASH CALIBRATE=no ITERATIONS=15 DELTA=0.2

  G1 Z10 F600
  M118 BACKLASH_DONE

  

[gcode_macro AXIS_TWIST_CALIBRATE_ALL]
description: Calibrate X and Y axis twist with Cartographer
gcode:
    RESPOND MSG="Homing..."
    G28

    RESPOND MSG="Running QGL..."
    QUAD_GANTRY_LEVEL
    G28 Z

    RESPOND MSG="Starting X Axis Twist Compensation..."
    CARTOGRAPHER_AXIS_TWIST_COMPENSATION AXIS=X

    RESPOND MSG="X Axis Complete"

    G28 Z

    RESPOND MSG="Starting Y Axis Twist Compensation..."
    CARTOGRAPHER_AXIS_TWIST_COMPENSATION AXIS=Y

    RESPOND MSG="Y Axis Complete"

    RESPOND MSG="Run SAVE_CONFIG to store results"



################################################################################
# MOVEMENT MACROS
################################################################################

[gcode_macro MOVE_TO_CENTER]
description: Moves the toolhead to the center of the build plate
gcode:
  {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
  {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
  home_if_needed
  G90  # Absolute positioning mode
  G0 X{max_x//2} Y{max_y//2} F12000



[gcode_macro home_if_needed]
description: Homes all axes only if not already homed
gcode:
  {% if printer.toolhead.homed_axes == "xyz" %}
    M118 HOME_IF_NEEDED - Printer is already homed
  {% else %}
    G28  # Home all axes
  {% endif %}


[gcode_macro QGL_IF_NEEDED]
description: Runs QGL only if not already leveled
gcode:
  {% if printer.quad_gantry_level.applied %}
    M118 QGL_IF_NEEDED - Quad gantry is already leveled
  {% else %}
    HOME_IF_NEEDED  # Home first if not homed
    QUAD_GANTRY_LEVEL
  {% endif %}














