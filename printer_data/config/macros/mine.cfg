# ── VOC Filter Fan Control (Filament Based, No Temperature Dependency) ─────
[fan_generic abs_filter]
pin: hexa:PB6
enable_pin: hexa:PB7
kick_start_time: 0.5

[gcode_macro _VOC_FILTER_CONFIG]
# ── Filament → fan speed mappings (0.0 = off, 1.0 = 100%) ──
variable_filament_speeds: {'PLA': 0.0, 'TPU': 0.0, 'PETG': 0.0, 'ABS': 1.0, 'ASA': 1.0, 'PC': 1.0, 'PA': 1.0, 'NYLON': 1.0}
# ── Fan hardware name (must match [fan_generic] section name) ──
variable_fan_name: "abs_filter"
# ── Post-run purge duration in seconds (default 600 = 10 min) ──
variable_postrun_duration: 600
# ── Post-run purge fan speed (0.0–1.0) ──
variable_postrun_speed: 1.0
# ── Speed threshold for LOW vs FULL label in responses ──
variable_speed_threshold_low: 0.5
# ── Default filament if none provided to VOC_FILTER_START ──
variable_default_filament: "PLA"
# ── Internal state — do not edit ──
variable_active: False
variable_target_speed: 0.0
gcode:

[gcode_macro VOC_FILTER_START]
description: Start VOC filter fan based on filament type
gcode:
  {% set cfg = printer['gcode_macro _VOC_FILTER_CONFIG'] %}
  {% set filament = params.FILAMENT | default(cfg.default_filament) | upper %}
  {% set speeds = cfg.filament_speeds %}

  {% if filament in speeds %}
    {% set speed = speeds[filament] | float %}
  {% else %}
    {% set speed = 0.0 %}
    RESPOND PREFIX="⚠️ VOC Filter" MSG="Unknown filament '{filament}' — defaulting to fan OFF"
  {% endif %}

  SET_GCODE_VARIABLE MACRO=_VOC_FILTER_CONFIG VARIABLE=target_speed VALUE={speed}
  SET_GCODE_VARIABLE MACRO=_VOC_FILTER_CONFIG VARIABLE=active VALUE=True
  SET_FAN_SPEED FAN={cfg.fan_name} SPEED={speed}

  {% if speed == 0.0 %}
    RESPOND PREFIX="💨 VOC Filter" MSG="Filament: {filament} — fan OFF (no VOC risk)"
  {% elif speed < cfg.speed_threshold_low %}
    RESPOND PREFIX="💨 VOC Filter" MSG="Filament: {filament} — fan at LOW speed ({(speed * 100) | int}%)"
  {% else %}
    RESPOND PREFIX="💨 VOC Filter" MSG="Filament: {filament} — fan at FULL speed ({(speed * 100) | int}%)"
  {% endif %}

[gcode_macro VOC_FILTER_STOP]
description: Stop VOC filter fan and begin post-run timer
gcode:
  {% set cfg = printer['gcode_macro _VOC_FILTER_CONFIG'] %}
  SET_GCODE_VARIABLE MACRO=_VOC_FILTER_CONFIG VARIABLE=active VALUE=False
  SET_GCODE_VARIABLE MACRO=_VOC_FILTER_CONFIG VARIABLE=target_speed VALUE=0.0
  SET_FAN_SPEED FAN={cfg.fan_name} SPEED=0
  RESPOND PREFIX="🛑 VOC Filter" MSG="Fan stopped — call VOC_FILTER_POSTRUN_START if post-run purge is needed"

# ── VOC filter post-print timer (non-blocking) ────────────────────
[delayed_gcode VOC_FILTER_POSTRUN]
gcode:
  {% set cfg = printer['gcode_macro _VOC_FILTER_CONFIG'] %}
  SET_FAN_SPEED FAN={cfg.fan_name} SPEED=0
  SET_GCODE_VARIABLE MACRO=_VOC_FILTER_CONFIG VARIABLE=active VALUE=False
  RESPOND PREFIX="✅ VOC Filter" MSG="Post-run purge complete — fan OFF"

[gcode_macro VOC_FILTER_POSTRUN_START]
description: Run VOC filter after print to purge residual fumes
gcode:
  {% set cfg = printer['gcode_macro _VOC_FILTER_CONFIG'] %}
  SET_FAN_SPEED FAN={cfg.fan_name} SPEED={cfg.postrun_speed}
  SET_GCODE_VARIABLE MACRO=_VOC_FILTER_CONFIG VARIABLE=active VALUE=True
  UPDATE_DELAYED_GCODE ID=VOC_FILTER_POSTRUN DURATION={cfg.postrun_duration}
  RESPOND PREFIX="💨 VOC Filter" MSG="Post-run purge started — fan at {(cfg.postrun_speed * 100) | int}% for {(cfg.postrun_duration / 60) | int} minutes"

