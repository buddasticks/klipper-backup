[gcode_macro _DIAL_PROBE_UI]
description: Show Mainsail popup UI for current dial probe point
gcode:
    {% set x_idx = printer["gcode_macro DIAL_PROBE_GRID"].current_x_index|int %}
    {% set y_idx = printer["gcode_macro DIAL_PROBE_GRID"].current_y_index|int %}
    {% set min_x = printer["gcode_macro DIAL_PROBE_GRID"].grid_min_x|float %}
    {% set max_x = printer["gcode_macro DIAL_PROBE_GRID"].grid_max_x|float %}
    {% set min_y = printer["gcode_macro DIAL_PROBE_GRID"].grid_min_y|float %}
    {% set max_y = printer["gcode_macro DIAL_PROBE_GRID"].grid_max_y|float %}
    {% set x_step = (max_x - min_x) / 9 %}
    {% set y_step = (max_y - min_y) / 9 %}
    {% set current_x = min_x + (x_idx * x_step) %}
    {% set current_y = min_y + (y_idx * y_step) %}
    {% set point_num = (y_idx * 10) + x_idx + 1 %}
    
    {% macro ui(m) %}{- action_respond_info('action:prompt_' ~ m) -}{% endmacro %}
    
    { ui('begin Dial Indicator — Point ' ~ point_num ~ ' / 100') }
    { ui('text Grid: [X' ~ x_idx ~ ', Y' ~ y_idx ~ ']  |  Physical: X=' ~ current_x|round(1) ~ ' Y=' ~ current_y|round(1)) }
    { ui('text Read your dial and click a value, or type: DIAL_ENTER_VALUE VALUE=0.05') }
    
    # ── Row 1: 0.00, ±0.05, ±0.10, ±0.15 ──
    { ui('button_group_start') }
    { ui('button [ 0.00 ]|DIAL_ENTER_VALUE VALUE=0.00|rgba(120,200,140,0.90)') }
    { ui('button [ +0.05 ]|DIAL_ENTER_VALUE VALUE=0.05|rgba(200,200,120,0.80)') }
    { ui('button [ -0.05 ]|DIAL_ENTER_VALUE VALUE=-0.05|rgba(200,200,120,0.80)') }
    { ui('button [ +0.10 ]|DIAL_ENTER_VALUE VALUE=0.10|rgba(200,200,120,0.80)') }
    { ui('button [ -0.10 ]|DIAL_ENTER_VALUE VALUE=-0.10|rgba(200,200,120,0.80)') }
    { ui('button [ +0.15 ]|DIAL_ENTER_VALUE VALUE=0.15|rgba(200,200,120,0.80)') }
    { ui('button [ -0.15 ]|DIAL_ENTER_VALUE VALUE=-0.15|rgba(200,200,120,0.80)') }
    { ui('button_group_end') }
    
    # ── Row 2: ±0.20, ±0.30, ±0.40 ──
    { ui('button_group_start') }
    { ui('button [ +0.20 ]|DIAL_ENTER_VALUE VALUE=0.20|rgba(200,180,100,0.80)') }
    { ui('button [ -0.20 ]|DIAL_ENTER_VALUE VALUE=-0.20|rgba(200,180,100,0.80)') }
    { ui('button [ +0.30 ]|DIAL_ENTER_VALUE VALUE=0.30|rgba(200,180,100,0.80)') }
    { ui('button [ -0.30 ]|DIAL_ENTER_VALUE VALUE=-0.30|rgba(200,180,100,0.80)') }
    { ui('button [ +0.40 ]|DIAL_ENTER_VALUE VALUE=0.40|rgba(200,180,100,0.80)') }
    { ui('button [ -0.40 ]|DIAL_ENTER_VALUE VALUE=-0.40|rgba(200,180,100,0.80)') }
    { ui('button_group_end') }
    
    # ── Row 3: ±0.50, ±0.60, ±0.70 ──
    { ui('button_group_start') }
    { ui('button [ +0.50 ]|DIAL_ENTER_VALUE VALUE=0.50|rgba(210,160,90,0.80)') }
    { ui('button [ -0.50 ]|DIAL_ENTER_VALUE VALUE=-0.50|rgba(210,160,90,0.80)') }
    { ui('button [ +0.60 ]|DIAL_ENTER_VALUE VALUE=0.60|rgba(210,160,90,0.80)') }
    { ui('button [ -0.60 ]|DIAL_ENTER_VALUE VALUE=-0.60|rgba(210,160,90,0.80)') }
    { ui('button [ +0.70 ]|DIAL_ENTER_VALUE VALUE=0.70|rgba(210,160,90,0.80)') }
    { ui('button [ -0.70 ]|DIAL_ENTER_VALUE VALUE=-0.70|rgba(210,160,90,0.80)') }
    { ui('button_group_end') }
    
    # ── Row 4: ±0.80, ±0.90, ±1.00 ──
    { ui('button_group_start') }
    { ui('button [ +0.80 ]|DIAL_ENTER_VALUE VALUE=0.80|rgba(220,140,80,0.80)') }
    { ui('button [ -0.80 ]|DIAL_ENTER_VALUE VALUE=-0.80|rgba(220,140,80,0.80)') }
    { ui('button [ +0.90 ]|DIAL_ENTER_VALUE VALUE=0.90|rgba(220,140,80,0.80)') }
    { ui('button [ -0.90 ]|DIAL_ENTER_VALUE VALUE=-0.90|rgba(220,140,80,0.80)') }
    { ui('button [ +1.00 ]|DIAL_ENTER_VALUE VALUE=1.00|rgba(230,120,70,0.85)') }
    { ui('button [ -1.00 ]|DIAL_ENTER_VALUE VALUE=-1.00|rgba(230,120,70,0.85)') }
    { ui('button_group_end') }
    
    { ui('footer_button [ Skip Point ]|DIAL_ENTER_VALUE VALUE=0.00 SKIP=1|rgba(150,150,150,0.70)') }
    { ui('footer_button [ Abort Grid ]|DIAL_ABORT|rgba(210,110,110,0.85)') }
    { ui('show') }









# [z_thermal_adjust]
# # Start with a conservative estimate for SV08 aluminum uprights
# # ~400mm vertical extrusion * 23e-6 /°C ≈ 0.0092 mm/°C
# # Actual will vary based on gantry geometry; calibrate empirically.
# temp_coeff: 0.060

# smooth_time: 3.0
# z_adjust_off_above: 10.0      # Disable above 10mm — first-layer compensation only
# max_z_adjustment: 0.4         # Hard safety limit

# # Sensor: Generic 3950 thermistor taped to rear vertical extrusion
# sensor_type: Generic 3950
# sensor_pin: hexa:PA3               # <-- CHANGE THIS to an available ADC pin on your board
# min_temp: 0
# max_temp: 100
# gcode_id: FRAME



# -------------------------------------------------------------
# 1. SSR TEMPERATURE-CONTROLLED FAN (Using Mainboard PA2)
# -------------------------------------------------------------
[temperature_fan SSR_fan]
pin: PA2                             # Stock SV08 Exhaust Fan port
max_power: 0.40                      # STRICTLY CRITICAL: Protects your 12V 4010 fan from 24V!
shutdown_speed: 0.0                  # CORRECT OPTION: Safely shuts the fan off if Klipper crashes
hardware_pwm: false                  # Software PWM prevents harsh motor whining on mismatched voltages
cycle_time: 0.01                    # Softens the pulses for a smoother, quieter fan spin
min_speed: 0.0
kick_start_time: 0.15       
sensor_type: Generic 3950            
sensor_pin: hexa:PA0                 # Linked to your Hexa board sensor
control: pid                        # FIXED: Removed the duplicate duplicate line
pid_Kp: 2.0                         # PID proportional value
pid_Ki: 5.0                         # PID integral value
pid_Kd: 0.5                         # PID derivative value
pid_deriv_time: 2.0                 # Derivative time constant
target_temp: 35                   # Automatically spins up when the SSR heatsink reaches 50°C
min_temp: 0
max_temp: 90



  
