# CARTOGRAPHER MACROS
################################################################################

[gcode_macro BACKLASH5]
description: Cartographer backlash test at 4 corners and center
gcode:
  G90
  G28

  G1 Z10 F600

  M118 BACKLASH_FL
  G1 X40 Y40 F12000
  CARTOGRAPHER_ESTIMATE_BACKLASH CALIBRATE=no ITERATIONS=15 DELTA=0.2

  G1 Z10 F600
  M118 BACKLASH_FR
  G1 X310 Y40 F12000
  CARTOGRAPHER_ESTIMATE_BACKLASH CALIBRATE=no ITERATIONS=15 DELTA=0.2

  G1 Z10 F600
  M118 BACKLASH_RR
  G1 X310 Y300 F12000
  CARTOGRAPHER_ESTIMATE_BACKLASH CALIBRATE=no ITERATIONS=15 DELTA=0.2

  G1 Z10 F600
  M118 BACKLASH_RL
  G1 X40 Y300 F12000
  CARTOGRAPHER_ESTIMATE_BACKLASH CALIBRATE=no ITERATIONS=15 DELTA=0.2

  G1 Z10 F600
  M118 BACKLASH_CENTER
  G1 X175 Y175 F12000
  CARTOGRAPHER_ESTIMATE_BACKLASH CALIBRATE=no ITERATIONS=15 DELTA=0.2

  G1 Z10 F600
  M118 BACKLASH_DONE

  

[gcode_macro AXIS_TWIST_CALIBRATE_ALL]
description: Calibrate X and Y axis twist with Cartographer
gcode:
    RESPOND MSG="Homing..."
    G28

    RESPOND MSG="Running QGL..."
    QUAD_GANTRY_LEVEL
    G28 Z

    RESPOND MSG="Starting X Axis Twist Compensation..."
    CARTOGRAPHER_AXIS_TWIST_COMPENSATION AXIS=X

    RESPOND MSG="X Axis Complete"

    G28 Z

    RESPOND MSG="Starting Y Axis Twist Compensation..."
    CARTOGRAPHER_AXIS_TWIST_COMPENSATION AXIS=Y

    RESPOND MSG="Y Axis Complete"

    RESPOND MSG="Run SAVE_CONFIG to store results"



################################################################################
# MOVEMENT MACROS
################################################################################

[gcode_macro MOVE_TO_CENTER]
description: Moves the toolhead to the center of the build plate
gcode:
  {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
  {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
  home_if_needed
  G90  # Absolute positioning mode
  G0 X{max_x//2} Y{max_y//2} F12000



[gcode_macro home_if_needed]
description: Homes all axes only if not already homed
gcode:
  {% if printer.toolhead.homed_axes == "xyz" %}
    M118 HOME_IF_NEEDED - Printer is already homed
  {% else %}
    G28  # Home all axes
  {% endif %}


[gcode_macro QGL_IF_NEEDED]
description: Runs QGL only if not already leveled
gcode:
  {% if printer.quad_gantry_level.applied %}
    M118 QGL_IF_NEEDED - Quad gantry is already leveled
  {% else %}
    HOME_IF_NEEDED  # Home first if not homed
    QUAD_GANTRY_LEVEL
  {% endif %}














