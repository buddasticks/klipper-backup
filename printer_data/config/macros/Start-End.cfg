# -- Print State Tracker ----------------------------------------------------

[gcode_macro _PRINT_TRACKER]
description: Tracks printing state for toolchanger
variable_is_printing: False
variable_filament: "PLA"
gcode:
  # This macro just holds the variable, no gcode needed


[gcode_macro _SLICER_TOOL_PARAMS]
variable_retract: {'0': {'length': 0.5, 'speed': 31, 'unretract': 31}, '1': {'length': 0.6, 'speed': 30, 'unretract': 30},  '2': {'length': 0.6, 'speed': 30, 'unretract': 30},'3': {'length': 0.6, 'speed': 30, 'unretract': 30}}
gcode:
  # Storage only


[gcode_macro _SLICER_TOOL_PA]
variable_pa: {'0': 0.02, '1': 0.02, '2': 0.02, '3': 0.02}
gcode:
  # Storage only


# -- Print Start ------------------------------------------------------------

[gcode_macro PRINT_START]
description: Toolchanger print start - compliant with KTC-Easy and Cartographer touch docs
variable_printing: False
gcode:

  # -- Parameters ------------------------------------------------------------
  {% set TOOL = params.TOOL | default(-1) | int %}
  {% set TOOL_TEMP = params.TOOL_TEMP | default(0) | int %}
  {% set BED_TEMP = params.BED_TEMP | default(60) | int %}
  {% set FILAMENT = params.FILAMENT | default("PLA") | upper %}

  # >>> ADDED: store filament for PRINT_END tracking
  SET_GCODE_VARIABLE MACRO=_PRINT_TRACKER VARIABLE=filament VALUE="'{FILAMENT}'"

  # -- Reset chamber fan  ------------------------------------------------------------
  
  UPDATE_DELAYED_GCODE ID=_CHAMBER_PURGE_STOP DURATION=0
  SET_FAN_SPEED FAN=chamber_fan SPEED=0
  
  # -- Bed thermal control ---------------------------------------------------
  {% set BED_SOAK = 0 %}
  {% set PREHEAT_TEMP = BED_TEMP %}

  {% set empty_dict = {} %}
  SET_GCODE_VARIABLE MACRO=SAVE_TOOL_TEMPS VARIABLE=saved_temps VALUE="{empty_dict}"
  SET_GCODE_VARIABLE MACRO=SAVE_TOOL_TEMPS VARIABLE=saved_active_tool VALUE=-1
  

  # -- Build slicer retraction map ------------------------------------------
  {% set retract_map = {} %}
  {% for tool_num in printer.toolchanger.tool_numbers %}
    {% set rl = 'T' ~ tool_num|string ~ '_RETRACT_LEN' %}
    {% set rs = 'T' ~ tool_num|string ~ '_RETRACT_SPEED' %}
    {% set us = 'T' ~ tool_num|string ~ '_UNRETRACT_SPEED' %}
    {% set tool_obj = printer['tool T' ~ tool_num|string] %}
    {% set r_len = params[rl] | default(tool_obj.params_retract_length) | float %}
    {% set r_spd = params[rs] | default(tool_obj.params_retract_speed) | float %}
    {% set u_spd = params[us] | default(tool_obj.params_unretract_speed) | float %}
    {% set _ = retract_map.update({tool_num|string: {'length': r_len, 'speed': r_spd, 'unretract': u_spd}}) %}
  {% endfor %}

  SET_GCODE_VARIABLE MACRO=_SLICER_TOOL_PARAMS VARIABLE=retract VALUE="{retract_map}"

  # -- PA map ---------------------------------------------------
  {% set pa_map = {} %}
  {% for tool_num in printer.toolchanger.tool_numbers %}
    {% set pa_param = 'T' ~ tool_num|string ~ '_PA' %}
    {% set tool_obj = printer['tool T' ~ tool_num|string] %}
    {% set extruder_name = tool_obj.extruder %}
    {% set pa_default = printer[extruder_name].pressure_advance %}
    {% set pa_val = params[pa_param] | default(pa_default) | float %}
    {% set _ = pa_map.update({tool_num|string: pa_val}) %}
  {% endfor %}

  SET_GCODE_VARIABLE MACRO=_SLICER_TOOL_PA VARIABLE=pa VALUE="{pa_map}"

  M117 Initializing...

  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=False
  SET_GCODE_VARIABLE MACRO=_PRINT_TRACKER VARIABLE=is_printing VALUE=False

  STOP_CRASH_DETECTION

  SET_GCODE_OFFSET Z=0
  BED_MESH_CLEAR

  # -- Bed heat --------------------------------------------------------------
  M117 Bed preheat {PREHEAT_TEMP}C
  M140 S{PREHEAT_TEMP}
  M190 S{PREHEAT_TEMP}

  M117 Bed soak {BED_SOAK}m
  G4 P{BED_SOAK * 60000}

  M117 Settling to {BED_TEMP}C
  M140 S{BED_TEMP}
  M190 S{BED_TEMP}

  # -- Homing ---------------------------------------------------------------
  M117 Homing
  G28
  G90

  # -- Chamber ---------------------------------------------------------------
  M117 Chamber Fan Start
  CHAMBER_START FILAMENT={FILAMENT}

  M117 VOC Filter Start
  VOC_FILTER_START FILAMENT={FILAMENT}
  
  # -- Quad Gantry Level -----------------------------------------------------
  M117 Quad Gantry Level
  QUAD_GANTRY_LEVEL

  # -- Tool select ----------------------------------------------------------
  {% if TOOL >= 0 %}
    M117 Selecting T{TOOL}
    T{TOOL}
  {% endif %}

  # -- Z home ---------------------------------------------------------------
  M117 Home Z
  G28 Z

  # -- Bed mesh -------------------------------------------------------------
  M117 Bed mesh
  BED_MESH_CALIBRATE METHOD=scan ADAPTIVE=1

  SET_GCODE_VARIABLE MACRO=_PRINT_TRACKER VARIABLE=is_printing VALUE=True
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=True

  M117 Parking nozzle
  PARK_NOZZLE

  # -- Apply slicer settings --------------------------------------------
  {% if TOOL >= 0 %}
    {% set r = retract_map[TOOL|string] %}
    {% set pa = pa_map[TOOL|string] %}
    {% set tool_obj = printer["tool T" ~ TOOL|string] %}

    SET_RETRACTION RETRACT_LENGTH={r['length']} RETRACT_SPEED={r['speed']} UNRETRACT_EXTRA_LENGTH={tool_obj.params_unretract_extra_length} UNRETRACT_SPEED={r['unretract']}
    SET_PRESSURE_ADVANCE EXTRUDER={tool_obj.extruder} ADVANCE={pa}
  {% endif %}

  {% if TOOL >= 0 %}
    {% set initialToolTempParam = 'T' ~ TOOL|string ~ '_TEMP' %}
    {% set initialToolTemp = params[initialToolTempParam] | default(TOOL_TEMP) | int %}
    M109 S{initialToolTemp}
  {% else %}
    M109 S{TOOL_TEMP}
  {% endif %}

  START_CRASH_DETECTION
  TDD_POLLING_START
  TDD_START

  CLEAN_NOZZLE PURGE=50 WIPE=0

  G0 Z2 F300
  G92 E0

  M117 Printing
  RESPOND MSG="[PRINT_START] Complete - T{TOOL} filament={FILAMENT}"












# ── Helper: move to absolute Z after tool unselect ─────────────────────────
[gcode_macro _POST_UNSELECT_SET_Z]
description: Move to absolute Z after tool unselect without exceeding max Z
gcode:
  {% set z_target = params.Z|default(10)|float %}
  {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
  {% set final_z = [z_target, max_z]|min %}
  G90
  G0 Z{final_z} F1200


# ── Print End ──────────────────────────────────────────────────────────────
[gcode_macro PRINT_END]
description: Clean print end sequence for klipper-toolchanger-easy
gcode:
  # ── Configuration ────────────────────────────────────────────────────────
  {% set RETRACT_LENGTH = 2.0 %}
  {% set RETRACT_FEEDRATE = 3600 %}
  {% set Z_LIFT = 20 %}
  {% set PARK_X = 175 %}
  {% set PARK_Y = 350 %}

  # ── Stop detection and update state ──────────────────────────────────────
  STOP_CRASH_DETECTION
  TDD_STOP
  TDD_POLLING_STOP
  
  
  {% set filament = printer["gcode_macro _PRINT_TRACKER"].filament | replace("'", "") %}
  
  CHAMBER_STOP
  CHAMBER_PURGE
  
  VOC_FILTER_POSTRUN_START

  M400
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=False
  SET_GCODE_VARIABLE MACRO=_PRINT_TRACKER VARIABLE=is_printing VALUE=False

# ── Retract filament only if active tool is hot ─────────────────────────
  {% set t = printer.toolchanger.tool_number|default(-1)|int %}
  
    {% if t >= 0 %}
      {% set extruder_name = printer["tool T" ~ t].extruder %}
  
      {% if extruder_name %}
        {% set current_temp = printer[extruder_name].temperature|float %}
  
        {% if printer[extruder_name].can_extrude %}
          RESPOND MSG="Retracting T{t} at {current_temp|round(1)}C"
          G92 E0
          G1 E-{RETRACT_LENGTH} F{RETRACT_FEEDRATE}
          M400
        {% else %}
          RESPOND MSG="Skipping retract: T{t} cold ({current_temp|round(1)}C)"
        {% endif %}
      {% else %}
        RESPOND MSG="Skipping retract: T{t} has no extruder"
      {% endif %}
    {% else %}
      RESPOND MSG="Skipping retract: no active tool"
    {% endif %}

  # ── Turn off all heaters ─────────────────────────────────────────────────
  TURN_OFF_HEATERS

  # ── Lift Z to clear the print ────────────────────────────────────────────
  {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
  {% set current_z = printer.toolhead.position[2]|float %}
  {% set target_z = [current_z + Z_LIFT, max_z]|min %}
  G90
  G0 Z{target_z} F1200

  # ── Move to park position ────────────────────────────────────────────────
  G0 X{PARK_X} Y{PARK_Y} F15000
  M400

  # ── Park (dock) the active tool without selecting T0 ────────────────────
  {% set current_tool = printer.toolchanger.tool_number|default(-1)|int %}
  {% if current_tool >= 0 %}
    RESPOND MSG="Parking T{current_tool}"
    UNSELECT_TOOL RESTORE_AXIS="XY"
    _POST_UNSELECT_SET_Z Z=10
  {% endif %}

  # ── Turn off all tool fans ───────────────────────────────────────────────
  {% for tool_num in printer.toolchanger.tool_numbers %}
    {% set tool_obj = printer['tool T' ~ tool_num] %}
    {% if tool_obj.fan is defined and tool_obj.fan %}
      SET_FAN_SPEED FAN={tool_obj.fan} SPEED=0
    {% endif %}
  {% endfor %}

  # ── Clear bed mesh and finish up ─────────────────────────────────────────
  BED_MESH_CLEAR
  M400

  # ── Reset motion limits ──────────────────────────────────────────────────
  {% set cfg = printer.configfile.config["printer"] %}
  {% set max_vel = cfg["max_velocity"]|float %}
  {% set max_accel = cfg["max_accel"]|float %}
  {% set mcr = cfg["minimum_cruise_ratio"]|default(0.5)|float %}
  {% set scv = cfg["square_corner_velocity"]|default(5.0)|float %}
  SET_VELOCITY_LIMIT VELOCITY={max_vel} ACCEL={max_accel} MINIMUM_CRUISE_RATIO={mcr} SQUARE_CORNER_VELOCITY={scv}

  # ── Reset Flow / Speed ───────────────────────────────────────────────────
  M221 S100
  M220 S100
  M84
  M117 Print Complete







