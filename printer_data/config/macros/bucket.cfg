#######################################################################################################################################
# GLOBAL CLEANING CONFIGURATION
#######################################################################################################################################

[gcode_macro _CLEAN_NOZZLE_GLOBALS]
description: Global settings for nozzle cleaning
variable_purge_temp_min: 210       # Minimum nozzle temperature to permit a purge
variable_purge_spd: 8              # Purge extrusion speed in mm/s
variable_purge_ret: 0.8            # Retract length in mm after purging
variable_prep_spd_xy: 200          # Travel speed in mm/s
variable_prep_spd_z: 20            # Z travel speed in mm/s
variable_clearance_z: 5            # Safe Z clearance for travel
variable_purge_z: 0.3              # Z height during purge line (layer height)
variable_purge_y: 8                # Y position for purge line (front of bed)
variable_purge_x_start: 10         # X start of purge line
variable_purge_x_end: 100          # X end of purge line
variable_purge_len: 50             # mm of filament to extrude
gcode:


#######################################################################################################################################
# MAIN CLEANING MACRO — simple front purge line
#######################################################################################################################################

[gcode_macro CLEAN_NOZZLE]
description: Purge a line at the front of the bed. PURGE=mm to extrude (default from globals).
gcode:
    SAVE_GCODE_STATE NAME=BEFORE_NOZZLE_CLEAN

    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESTORE_GCODE_STATE NAME=BEFORE_NOZZLE_CLEAN
        {action_raise_error("Please home all axes first!")}
    {% endif %}

    {% set g     = printer['gcode_macro _CLEAN_NOZZLE_GLOBALS'] %}
    {% set purge_len = params.PURGE | default(g.purge_len) | float %}

    # Resolve active extruder temp
    {% set current_tool = printer.toolchanger.tool | default('') %}
    {% if current_tool != '' and current_tool != -1 and current_tool in printer %}
        {% set extruder_name = printer[current_tool].extruder %}
    {% else %}
        {% set extruder_name = 'extruder' %}
    {% endif %}
    {% set extruder_temp = printer[extruder_name].temperature %}

    {% set current_z = printer.toolhead.position.z %}
    {% set safe_z    = [current_z, g.clearance_z] | max %}

    G90
    G1 Z{safe_z}        F{g.prep_spd_z  * 60}   ; lift to safe Z
    G1 X{g.purge_x_start} Y{g.purge_y} F{g.prep_spd_xy * 60}  ; move to start
    G1 Z{g.purge_z}     F{g.prep_spd_z  * 60}   ; drop to purge height

    {% if extruder_temp >= g.purge_temp_min and purge_len > 0 %}
        M117 Purging...
        M83
        G1 X{g.purge_x_end} E{purge_len} F{g.purge_spd * 60}  ; purge line
        {% if g.purge_ret > 0 %}
            G1 E-{g.purge_ret} F{g.purge_spd * 60 * 5}        ; retract
        {% endif %}
        G92 E0
    {% else %}
        M118 CLEAN_NOZZLE: skipping purge — nozzle not hot enough ({extruder_temp}°C < {g.purge_temp_min}°C)
    {% endif %}

    G1 Z{safe_z} F{g.prep_spd_z * 60}   ; lift clear
    M117 Purge done

    RESTORE_GCODE_STATE NAME=BEFORE_NOZZLE_CLEAN


#######################################################################################################################################
# UTILITY MACROS
#######################################################################################################################################

[gcode_macro CLEAN_NOZZLE_FAN_ON]
gcode:
    M106 S255

[gcode_macro CLEAN_NOZZLE_FAN_OFF]
gcode:
    M107
















































