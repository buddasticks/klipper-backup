# tool_drop_detection.cfg
# Requires tool_drop_detection.py in ~/klipper/klippy/extras/
# ─────────────────────────────────────────────────────────────

[tool_drop_detection]
# "tool0" and "tool1" resolve to [adxl345 tool0] and [adxl345 tool1] automatically
accelerometer: tool0, tool1, tool2, tool3

polling_freq: 5          # Hz - how often to evaluate (1-20)
polling_rate: 25         # Hz - ADXL sample rate sent to MCU

# ── Drop/crash detection ──────────────────────────────────────
rotation_threshold: 28.0  # degrees vector deviation to flag as dropped
drop_mintime: 0.5         # seconds threshold must be exceeded before triggering
peak_g_threshold: 15.0   # instant trigger on hard impact regardless of angle

crash_gcode:
    RESPOND TYPE=error MSG="Tool drop detected ({accelerometer})! Pausing print."
    PAUSE


# ── Optional: angle templates (comment out if not needed) ─────
# angle_exceed_gcode:
#     RESPOND MSG="Tool {accelerometer} tilted beyond threshold"
# angle_return_gcode:
#     RESPOND MSG="Tool {accelerometer} returned to normal"
# angle_hysteresis: 5.0

# ── Tuning ────────────────────────────────────────────────────
current_samples: 10
session_time: 1.0
samples_result: median
decimals: 3

# Baseline orientation — tools docked, captured 2026-03-20
default_tool3: [g:1.003  p:1.686°  r:-4.368°  vec:(-0.03,-0.076,1.0)]
default_tool2: [g:1.019  p:3.77°  r:0.46°  vec:(-0.067,0.008,1.016)]
default_tool1: [g:1.018  p:0.627°  r:-0.216°  vec:(-0.011,-0.004,1.018)]
default_tool0: [g:1.008  p:3.174°  r:-3.51°  vec:(-0.056,-0.062,1.005)]



[gcode_macro TDD_SET_SHUTTLE_DEFAULTS]
description: Set shuttle-baseline 'TDD_SET_SHUTTLE_DEFAULTS [T=<1,2,3...>]'
gcode:
  {% set P   = printer %}
  {% set tc  = P.toolchanger %}
  {% set tns = tc.tool_numbers %}
  {% set cur = tc.tool_number %}
  {% set req = params.T|default('all') %}
  {% set queue = [] %}

  # ---------- Build tool queue (current tool first) ----------
  {% for raw in (tns if req == 'all' else req.split(',')|map('trim')) %}
    {% set n = raw|int(-1) %}
    {% if n in tns and n not in queue %}
      {% set _ = queue.insert(0, n) if n == cur else queue.append(n) %}
    {% elif raw|trim and n not in tns %}
      RESPOND MSG="Tool '{raw}' invalid, skipping."
    {% endif %}
  {% endfor %}
  {% if queue|length == 0 %}
    RESPOND TYPE=error MSG="No valid tools to process."
  {% endif %}

  # ---------- Homing guard ----------
  {% if P.toolhead.homed_axes != 'xyz' %}
    {% if P.configfile.settings.toolchanger.on_axis_not_homed == 'home' %}
      RESPOND MSG="homing first"
      G28
    {% else %}
      RESPOND TYPE=error MSG="Please home all axes first."
    {% endif %}
  {% endif %}
  # ---------- Validate accelerometers ----------
  {% set tinfo = [] %}{% set missing = [] %}
  {% for n in queue %}
    {% set name   = tc.tool_names[n] %}
    {% set accel  = P[name].get('params_accel', name|replace('tool ', '')) %}
    {% set _ = missing.append(name) if accel not in P.tool_drop_detection else tinfo.append([n, accel]) %}
  {% endfor %}
  {% if missing %}
    RESPOND TYPE=error MSG="Missing accel in tool_drop_detection for: {missing|join(', ')}"
  {% endif %}

  RESPOND MSG="Capturing shuttle baselines for: {% for t,a in tinfo %}{ tc.tool_names[t]|replace('tool ', '') } {% endfor %}"

  {% set accel_list = (tinfo|map(attribute=1)|unique|join(','))|string %}

  TDD_POLLING_START ACCEL={accel_list}

  # ---------- Select -> wait -> set ----------
  {% for t, accel in tinfo %}
    {% if t != cur %} T{t} {% endif %}
    G4 P5000                       # let sensors settle
    TDD_REFERENCE_SET  ACCEL={accel}
    TDD_POLLING_STOP   ACCEL={accel}
  {% endfor %}

  TDD_REFERENCE_DUMP ACCEL={accel_list}
  RESPOND MSG="Shuttle baselines updated for ACCEL={accel_list}."

