# ==============================================================================
# CARTOGRAPHER CALIBRATION SUITE - Mainsail UI Ready
# Updated: All Z positioning, MAX_VERIFY_RANGE, and model checks fixed
# ==============================================================================

[gcode_macro CARTO_FULL_CALIBRATION]
description: Full pipeline. Params: MODE, SCAN_MODEL, TOUCH_MODEL, TOUCH_MAX_VERIFY_RANGE, BED_TEMP, AUTO_SAVE
gcode:
    {% set mode = params.MODE|default("scan")|string|lower %}
    {% set scan_model = params.SCAN_MODEL|default("default")|string %}
    {% set touch_model = params.TOUCH_MODEL|default("default")|string %}
    {% set touch_max_verify = params.TOUCH_MAX_VERIFY_RANGE|default(0.04)|float %}
    {% set bed_temp = params.BED_TEMP|default(0)|int %}
    {% set auto_save = params.AUTO_SAVE|default(1)|int %}
    {% set x_pos = params.X_POS|default(printer.toolhead.axis_maximum.x|float / 2)|float %}
    {% set y_pos = params.Y_POS|default(printer.toolhead.axis_maximum.y|float / 2)|float %}
    
    RESPOND TYPE=command MSG=">>> Full Calibration (MODE={mode}) <<<"
    
    {% if bed_temp > 0 %}
        M140 S{bed_temp}
        M190 S{bed_temp}
    {% endif %}
    
    G28 X Y
    G0 X{x_pos} Y{y_pos} F6000
    
    {% if mode == "scan" %}
        RESPOND TYPE=command MSG="Scan calibration: manual paper test required"
        PROBE_SWITCH MODE=scan
        CARTOGRAPHER_SCAN_CALIBRATE MODEL={scan_model} METHOD=manual
        RESPOND TYPE=command MSG="Use TESTZ until paper catches, then ACCEPT"
        ; User must manually ACCEPT - macro pauses here
    {% elif mode == "touch" %}
        RESPOND TYPE=command MSG="Survey Touch calibration..."
        PROBE_SWITCH MODE=touch
        CARTOGRAPHER_TOUCH_CALIBRATE MAX_VERIFY_RANGE={touch_max_verify} MODEL={touch_model}
        RESPOND TYPE=command MSG="Creating scan model from touch data..."
        CARTOGRAPHER_SCAN_CALIBRATE MODEL={scan_model} METHOD=touch
    {% endif %}
    
    {% if auto_save %}
        SAVE_CONFIG
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_SCAN_CALIBRATE]
description: Calibrate scan model. Params: MODEL, METHOD, X_POS, Y_POS, AUTO_SAVE
gcode:
    {% set model = params.MODEL|default("default")|string %}
    {% set method = params.METHOD|default("manual")|string|lower %}
    {% set x_pos = params.X_POS|default(printer.toolhead.axis_maximum.x|float / 2)|float %}
    {% set y_pos = params.Y_POS|default(printer.toolhead.axis_maximum.y|float / 2)|float %}
    {% set auto_save = params.AUTO_SAVE|default(0)|int %}
    {% set bed_temp = params.BED_TEMP|default(0)|int %}
    
    RESPOND TYPE=command MSG=">>> Scan Cal (MODEL={model}, METHOD={method}) <<<"
    
    {% if method == "touch" %}
        ; Touch method requires existing touch model
        {% if not printer.configfile.config["cartographer touch_model " ~ model] is defined %}
            RESPOND TYPE=error MSG="No touch model '{model}' found! Run touch cal first."
        {% endif %}
    {% endif %}
    
    {% if not 'x' in printer.toolhead.homed_axes or not 'y' in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    
    {% if bed_temp > 0 %}
        M140 S{bed_temp}
        M190 S{bed_temp}
    {% endif %}
    
    G0 X{x_pos} Y{y_pos} F6000
    
    CARTOGRAPHER_SCAN_CALIBRATE MODEL={model} METHOD={method}
    
    {% if auto_save %}
        SAVE_CONFIG
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_TOUCH_CALIBRATE]
description: Survey Touch calibration. Params: MAX_VERIFY_RANGE, MODEL, SPEED, START, MAX, VERIFICATION_SAMPLES, AUTO_SAVE
gcode:
    {% set max_verify = params.MAX_VERIFY_RANGE|default(0.04)|float %}
    {% set model = params.MODEL|default("default")|string %}
    {% set speed = params.SPEED|default(2)|int %}
    {% set start = params.START|default(500)|int %}
    {% set max_val = params.MAX|default(5000)|int %}
    {% set verification = params.VERIFICATION_SAMPLES|default(10)|int %}
    {% set auto_save = params.AUTO_SAVE|default(1)|int %}
    {% set x_pos = params.X_POS|default(printer.toolhead.axis_maximum.x|float / 2)|float %}
    {% set y_pos = params.Y_POS|default(printer.toolhead.axis_maximum.y|float / 2)|float %}
    
    RESPOND TYPE=command MSG=">>> Touch Cal (MODEL={model}, MAX_VERIFY={max_verify}) <<<"
    
    {% if not 'x' in printer.toolhead.homed_axes or not 'y' in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    
    G0 X{x_pos} Y{y_pos} F6000
    
    CARTOGRAPHER_TOUCH_CALIBRATE MAX_VERIFY_RANGE={max_verify} MODEL={model} SPEED={speed} START={start} MAX={max_val} VERIFICATION_SAMPLES={verification}
    
    {% if auto_save %}
        SAVE_CONFIG
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_THRESHOLD_SCAN]
description: Find optimal touch threshold. Params: MIN, MAX, STEP, SPEED, AUTO_SAVE
gcode:
    {% set ts_min = params.MIN|default(500)|int %}
    {% set ts_max = params.MAX|default(5000)|int %}
    {% set ts_step = params.STEP|default(250)|int %}
    {% set ts_speed = params.SPEED|default(2)|int %}
    {% set auto_save = params.AUTO_SAVE|default(0)|int %}
    {% set x_pos = params.X_POS|default(printer.toolhead.axis_maximum.x|float / 2)|float %}
    {% set y_pos = params.Y_POS|default(printer.toolhead.axis_maximum.y|float / 2)|float %}
    {% set nozzle_clean = params.CLEAN_NOZZLE|default(1)|int %}
    
    RESPOND TYPE=command MSG=">>> Threshold Scan <<<"
    
    {% if not 'x' in printer.toolhead.homed_axes or not 'y' in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    
    {% if nozzle_clean %}
        RESPOND TYPE=command MSG="Ensure nozzle CLEAN, bed CLEAN, probe 2.6-3mm above nozzle"
        G4 P5000
    {% endif %}
    
    G0 X{x_pos} Y{y_pos} F6000
    
    CARTOGRAPHER_THRESHOLD_SCAN MIN={ts_min} MAX={ts_max} STEP={ts_step} SPEED={ts_speed}
    
    {% if auto_save %}
        SAVE_CONFIG
    {% endif %}


