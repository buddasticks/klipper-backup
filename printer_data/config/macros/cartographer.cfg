    {% set auto_save = params.AUTO_SAVE|default(1)|int %}
    
    RESPOND TYPE=command MSG=">>> Touch Offset (MODEL={model}) <<<"
    
    {% if not 'x' in printer.toolhead.homed_axes or not 'y' in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    
    G0 X{x_pos} Y{y_pos} F6000
    
    CARTOGRAPHER_TOUCH_CALIBRATE MAX_VERIFY_RANGE={max_verify} MODEL={model} SPEED={speed} START={start} MAX={max_val} VERIFICATION_SAMPLES={verification}
    
