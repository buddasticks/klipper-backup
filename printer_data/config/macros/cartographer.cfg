    {% endif %}


# ==============================================================================
[gcode_macro CARTO_BACKLASH]
description: Measure Z-axis backlash. Params: CALIBRATE, ITERATIONS, DELTA, CORNER
gcode:
    {% set calibrate = params.CALIBRATE|default(0)|int %}
    {% set iterations = params.ITERATIONS|default(10)|int %}
    {% set delta = params.DELTA|default(0.2)|float %}
    {% set corner = params.CORNER|default("center")|string|lower %}
    {% set x_max = printer.toolhead.axis_maximum.x|float %}
    {% set y_max = printer.toolhead.axis_maximum.y|float %}
    
    RESPOND TYPE=command MSG=">>> Backlash at {corner} <<<"
    
    G28
    
    ; Move to requested corner
    {% if corner == "center" %}
        G0 X{x_max/2} Y{y_max/2} F6000
    {% elif corner == "front_left" %}
        G0 X{x_max*0.1} Y{y_max*0.1} F6000
    {% elif corner == "front_right" %}
        G0 X{x_max*0.9} Y{y_max*0.1} F6000
    {% elif corner == "back_left" %}
        G0 X{x_max*0.1} Y{y_max*0.9} F6000
    {% elif corner == "back_right" %}
        G0 X{x_max*0.9} Y{y_max*0.9} F6000
    {% else %}
        RESPOND TYPE=error MSG="Unknown corner: {corner}"
    {% endif %}
    
    ; Position at optimal scan height before measuring
    G0 Z2.5 F1000
    
    {% if calibrate %}
        CARTOGRAPHER_ESTIMATE_BACKLASH CALIBRATE=yes ITERATIONS={iterations} DELTA={delta}
    {% else %}
        CARTOGRAPHER_ESTIMATE_BACKLASH CALIBRATE=no ITERATIONS={iterations} DELTA={delta}
    {% endif %}
    
    G0 Z10 F1000
    RESPOND TYPE=command MSG="Copy 'delta' into backlash_comp: or re-run with CALIBRATE=1"


# ==============================================================================
[gcode_macro CARTO_TEMP_CALIBRATE]
description: Temperature compensation. Params: MIN_TEMP, MAX_TEMP, BED_TEMP, Z_SPEED, AUTO_SAVE
gcode:
    {% set min_temp = params.MIN_TEMP|default(40)|int %}
    {% set max_temp = params.MAX_TEMP|default(60)|int %}
    {% set bed_temp = params.BED_TEMP|default(90)|int %}
    {% set z_speed = params.Z_SPEED|default(5)|int %}
    {% set auto_save = params.AUTO_SAVE|default(1)|int %}
    
    RESPOND TYPE=command MSG=">>> Temp Comp (1-3+ hours) <<<"
    
    G28
    
    ; Move to center and safe starting height
    G0 X{printer.toolhead.axis_maximum.x|float / 2} Y{printer.toolhead.axis_maximum.y|float / 2} F6000
    G0 Z5 F1000
    
    CARTOGRAPHER_TEMPERATURE_CALIBRATE MIN_TEMP={min_temp} MAX_TEMP={max_temp} BED_TEMP={bed_temp} Z_SPEED={z_speed}
    
    {% if auto_save %}
        SAVE_CONFIG
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_SCAN_ACCURACY]
description: Test scan probe repeatability. MUST have scan model. Params: READINGS, SAMPLES, X_POS, Y_POS, HEIGHT
gcode:
    {% set readings = params.READINGS|default(20)|int %}
    {% set samples = params.SAMPLES|default(100)|int %}
    {% set x_pos = params.X_POS|default(printer.toolhead.axis_maximum.x|float / 2)|float %}
    {% set y_pos = params.Y_POS|default(printer.toolhead.axis_maximum.y|float / 2)|float %}
    {% set height = params.HEIGHT|default(2.5)|float %}
    
    ; Check if scan model exists
    {% if not printer.configfile.config["cartographer scan_model default"] is defined %}
        RESPOND TYPE=error MSG="No scan model found! Run CARTO_SCAN_CALIBRATE first."
    {% endif %}
    
    RESPOND TYPE=command MSG=">>> Scan Accuracy at Z={height}mm <<<"
    
    G28
    
    G0 X{x_pos} Y{y_pos} F6000
    G0 Z{height} F1000
    
    CARTOGRAPHER_SCAN_ACCURACY READINGS={readings} SAMPLES={samples}
    
    G0 Z10 F1000


# ==============================================================================
[gcode_macro CARTO_TOUCH_ACCURACY]
description: Test touch probe repeatability. Params: LIFT_SPEED, SAMPLE_RETRACT_DIST, SAMPLES, X_POS, Y_POS
gcode:
    {% set lift_speed = params.LIFT_SPEED|default(5)|float %}
    {% set retract_dist = params.SAMPLE_RETRACT_DIST|default(1.0)|float %}
    {% set samples = params.SAMPLES|default(5)|int %}
    {% set x_pos = params.X_POS|default(printer.toolhead.axis_maximum.x|float / 2)|float %}
    {% set y_pos = params.Y_POS|default(printer.toolhead.axis_maximum.y|float / 2)|float %}
    
    RESPOND TYPE=command MSG=">>> Touch Accuracy ({samples} samples) <<<"
    
    G28
    
    G0 X{x_pos} Y{y_pos} F6000
    
    CARTOGRAPHER_TOUCH_ACCURACY LIFT_SPEED={lift_speed} SAMPLE_RETRACT_DIST={retract_dist} SAMPLES={samples}


# ==============================================================================
[gcode_macro CARTO_TOUCH_PROBE]
description: Single touch probe at current position. No params.
gcode:
    RESPOND TYPE=command MSG=">>> Single Touch Probe <<<"
    
    {% if not 'z' in printer.toolhead.homed_axes %}
        G28 Z
    {% endif %}
    
    CARTOGRAPHER_TOUCH_PROBE


# ==============================================================================
[gcode_macro CARTO_SWITCH_MODE]
description: Switch between SCAN and TOUCH modes. Params: MODE
gcode:
    {% set mode = params.MODE|default("scan")|string|lower %}
    
    {% if mode not in ["scan", "touch"] %}
        RESPOND TYPE=error MSG="MODE must be 'scan' or 'touch'"
    {% else %}
        PROBE_SWITCH MODE={mode}
        SAVE_CONFIG
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_SCAN_MODEL]
description: Manage scan models. Params: ACTION, NAME
gcode:
    {% set action = params.ACTION|default("list")|string|lower %}
    {% set name = params.NAME|default("")|string %}
    
    {% if action == "list" %}
        CARTOGRAPHER_SCAN_MODEL
    {% elif action == "load" %}
        CARTOGRAPHER_SCAN_MODEL LOAD={name}
    {% elif action == "remove" %}
        CARTOGRAPHER_SCAN_MODEL REMOVE={name}
        SAVE_CONFIG
    {% else %}
        RESPOND TYPE=error MSG="ACTION must be: list, load, remove"
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_TOUCH_MODEL]
description: Manage touch models. Params: ACTION, NAME
gcode:
    {% set action = params.ACTION|default("list")|string|lower %}
    {% set name = params.NAME|default("")|string %}
    
    {% if action == "list" %}
        CARTOGRAPHER_TOUCH_MODEL
    {% elif action == "load" %}
        CARTOGRAPHER_TOUCH_MODEL LOAD={name}
    {% elif action == "remove" %}
        CARTOGRAPHER_TOUCH_MODEL REMOVE={name}
        SAVE_CONFIG
    {% else %}
        RESPOND TYPE=error MSG="ACTION must be: list, load, remove"
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_BED_MESH]
description: Full bed mesh with optional QGL/Z_TILT. Params: MESH_PROFILE, RUN_QGL, METHOD, HEIGHT, RUNS, PATH, DIRECTION, SPEED, ADAPTIVE, ADAPTIVE_MARGIN, PROBE_TEMP
gcode:
    {% set mesh_profile = params.MESH_PROFILE|default("default")|string %}
    {% set run_qgl = params.RUN_QGL|default(1)|int %}
    {% set method = params.METHOD|default("scan")|string %}
    {% set height = params.HEIGHT|default(5.0)|float %}
    {% set runs = params.RUNS|default(1)|int %}
    {% set path = params.PATH|default("snake")|string %}
    {% set direction = params.DIRECTION|default("x")|string %}
    {% set speed = params.SPEED|default(50.0)|float %}
    {% set adaptive = params.ADAPTIVE|default(0)|int %}
    {% set adaptive_margin = params.ADAPTIVE_MARGIN|default(0.0)|float %}
    {% set probe_temp = params.PROBE_TEMP|default(0)|int %}
    
    RESPOND TYPE=command MSG=">>> Bed Mesh (METHOD={method}) <<<"
    
    G28
    
    {% if run_qgl %}
        {% if printer.configfile.settings.quad_gantry_level is defined %}
            QUAD_GANTRY_LEVEL
            G28 Z
        {% elif printer.configfile.settings.z_tilt is defined %}
            Z_TILT_ADJUST
            G28 Z
        {% endif %}
    {% endif %}
    
    {% if probe_temp > 0 %}
        M104 S{probe_temp}
        M109 S{probe_temp}
    {% endif %}
    
    BED_MESH_CALIBRATE METHOD={method} HEIGHT={height} RUNS={runs} PATH={path} DIRECTION={direction} SPEED={speed} ADAPTIVE={adaptive} ADAPTIVE_MARGIN={adaptive_margin} PROFILE={mesh_profile}
    BED_MESH_PROFILE SAVE={mesh_profile}
    
    RESPOND TYPE=command MSG="Mesh '{mesh_profile}' saved"


# ==============================================================================
[gcode_macro CARTO_QUICK_CHECK]
description: Quick health check. Detects missing models. Params: SCAN_HEIGHT
gcode:
    {% set scan_height = params.SCAN_HEIGHT|default(2.5)|float %}
    
    RESPOND TYPE=command MSG=">>> Quick Health Check <<<"
    
    G28
    
    ; Scan accuracy (only if scan model exists)
    {% if printer.configfile.config["cartographer scan_model default"] is defined %}
        RESPOND TYPE=command MSG="Scan model found - testing scan accuracy..."
        CARTO_SCAN_ACCURACY READINGS=20 SAMPLES=50 HEIGHT={scan_height}
    {% else %}
        RESPOND TYPE=warning MSG="No scan model - skipping scan accuracy"
    {% endif %}
    
    ; Touch accuracy (only if touch model exists)
    {% if printer.configfile.config["cartographer touch_model default"] is defined %}
        RESPOND TYPE=command MSG="Touch model found - testing touch accuracy..."
        CARTO_TOUCH_ACCURACY SAMPLES=3 LIFT_SPEED=5
    {% else %}
        RESPOND TYPE=warning MSG="No touch model - skipping touch accuracy"
    {% endif %}
    
    RESPOND TYPE=command MSG=">>> Health Check Complete <<<"


# ==============================================================================
[gcode_macro CARTO_AXIS_TWIST]
description: Scan+touch axis twist compensation. Params: AXIS, SAMPLE_COUNT, USE_TOUCH_BOUNDARIES, START, END, LINE
gcode:
    {% set axis = params.AXIS|default("x")|string|lower %}
    {% set sample_count = params.SAMPLE_COUNT|default(5)|int %}
    {% set use_touch = params.USE_TOUCH_BOUNDARIES|default(0)|int %}
    {% set start = params.START|default(none) %}
    {% set end = params.END|default(none) %}
    {% set line = params.LINE|default(none) %}
    
    RESPOND TYPE=command MSG=">>> Axis Twist (AXIS={axis}) <<<"
    
    G28
    
    {% if use_touch %}
        {% set touch_flag = "yes" %}
    {% else %}
        {% set touch_flag = "no" %}
    {% endif %}
    
    {% if start is not none and end is not none and line is not none %}
        CARTOGRAPHER_AXIS_TWIST_COMPENSATION USE_TOUCH_BOUNDARIES={touch_flag} AXIS={axis} SAMPLE_COUNT={sample_count} START={start} END={end} LINE={line}
    {% elif start is not none and end is not none %}
        CARTOGRAPHER_AXIS_TWIST_COMPENSATION USE_TOUCH_BOUNDARIES={touch_flag} AXIS={axis} SAMPLE_COUNT={sample_count} START={start} END={end}
    {% else %}
        CARTOGRAPHER_AXIS_TWIST_COMPENSATION USE_TOUCH_BOUNDARIES={touch_flag} AXIS={axis} SAMPLE_COUNT={sample_count}
    {% endif %}
    
    SAVE_CONFIG
    RESPOND TYPE=command MSG="Saved. RESTART required."