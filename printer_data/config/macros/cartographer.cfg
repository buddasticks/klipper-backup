# Cartographer V4 - USB + Scan mode
[mcu cartographer]
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_400038000C50315447313620-if00
restart_method: command

[cartographer scan]
mesh_runs: 2

[axis_twist_compensation] 

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 48
verbose: yes #no

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

[quad_gantry_level]
gantry_corners:
    50, -5
    326, 250

points:
    56, -3
    56, 250
    320, 250
    320, -3
  
speed: 300
horizontal_move_z: 2 
retry_tolerance: 0.005
retries: 10
max_adjust: 10




[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    # Coarse pass using touch to handle badly unlevel gantry
    _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=4 RETRY_TOLERANCE=0.1
    # Fine pass - scan takes over at low z
    _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=2 RETRY_TOLERANCE=0.005




[bed_mesh]
zero_reference_position: 175, 130

speed: 400
horizontal_move_z: 2
mesh_min: 30, 42
mesh_max: 340, 320

probe_count: 10,10
adaptive_margin: 10
mesh_pps: 0, 0 #2, 2
algorithm: bicubic

fade_start: 1                       
fade_end: 10                    
fade_target: 0

    



# [adxl345 carto]
# # Select 1 of the cs_pin below depending on the probe you have. 
# # Having the wrong one selected will cause an Endless Bootloop
# # Cartographer V4 has int2 connected to the probes PA1 pin

# cs_pin: cartographer:PA0 # For Cartographer V4
# spi_bus: spi1
# axes_map: y, -x, z

# # [resonance_tester]
# # accel_chip: adxl345
# # probe_points:
# #     175, 175, 50












# ==============================================================================
# CARTOGRAPHER CALIBRATION SUITE - Mainsail UI Ready
# ==============================================================================
# All macros expose parameters via Jinja2 'params' so Mainsail renders UI fields.
# Defaults are pulled from printer.configfile.settings where possible.
# ==============================================================================

[gcode_macro CARTO_FULL_CALIBRATION]
description: Full Cartographer calibration pipeline: Scan model + Touch threshold + Touch offset
gcode:
    {% set mode = params.MODE|default("touch")|string|lower %}
    {% set scan_method = params.SCAN_METHOD|default("manual")|string|lower %}
    {% set ts_min = params.TS_MIN|default(500)|int %}
    {% set ts_max = params.TS_MAX|default(5000)|int %}
    {% set ts_step = params.TS_STEP|default(250)|int %}
    {% set ts_speed = params.TS_SPEED|default(2)|int %}
    {% set touch_speed = params.TOUCH_SPEED|default(3)|float %}
    {% set touch_accel = params.TOUCH_ACCEL|default(100)|int %}
    {% set touch_samples = params.TOUCH_SAMPLES|default(3)|int %}
    {% set touch_tolerance = params.TOUCH_TOLERANCE|default(0.01)|float %}
    {% set touch_retries = params.TOUCH_RETRIES|default(10)|int %}
    {% set touch_retract = params.TOUCH_RETRACT|default(2)|float %}
    {% set debug = params.DEBUG|default(0)|int %}
    {% set bed_temp = params.BED_TEMP|default(0)|int %}
    {% set nozzle_temp = params.NOZZLE_TEMP|default(0)|int %}
    {% set auto_save = params.AUTO_SAVE|default(1)|int %}
    {% set x_pos = params.X_POS|default(printer.toolhead.axis_maximum.x|float / 2)|float %}
    {% set y_pos = params.Y_POS|default(printer.toolhead.axis_maximum.y|float / 2)|float %}
    
    RESPOND TYPE=command MSG=">>> Starting Full Cartographer Calibration <<<"
    
    ; Safety: ensure axes are known
    {% if not printer.toolhead.homed_axes %}
        RESPOND TYPE=error MSG="Axes not homed! Homing X/Y first..."
        G28 X Y
    {% endif %}
    
    ; Preheat if requested
    {% if bed_temp > 0 %}
        RESPOND TYPE=command MSG="Heating bed to {bed_temp}C..."
        M140 S{bed_temp}
        M190 S{bed_temp}
    {% endif %}
    {% if nozzle_temp > 0 %}
        RESPOND TYPE=command MSG="Heating nozzle to {nozzle_temp}C..."
        M104 S{nozzle_temp}
        M109 S{nozzle_temp}
    {% endif %}
    
    ; Move to center
    G0 X{x_pos} Y{y_pos} F6000
    
    ; Step 1: Scan calibration
    RESPOND TYPE=command MSG="Step 1/3: Scan calibration (METHOD={scan_method})"
    {% if scan_method == "touch" %}
        CARTOGRAPHER_SCAN_CALIBRATE METHOD=touch
    {% else %}
        CARTOGRAPHER_SCAN_CALIBRATE
        ; Manual paper test - user must ACCEPT when done
        RESPOND TYPE=command MSG="Lower nozzle with TESTZ until paper catches, then ACCEPT"
    {% endif %}
    
    ; Step 2: Threshold scan (only for touch mode)
    {% if mode == "touch" %}
        RESPOND TYPE=command MSG="Step 2/3: Threshold scan (MIN={ts_min}, MAX={ts_max})"
        CARTOGRAPHER_THRESHOLD_SCAN MIN={ts_min} MAX={ts_max} STEP={ts_step} SPEED={ts_speed}
    {% endif %}
    
    ; Step 3: Touch offset calibration
    {% if mode == "touch" %}
        RESPOND TYPE=command MSG="Step 3/3: Touch offset calibration"
        CARTOGRAPHER_CALIBRATE SPEED={touch_speed} ACCEL={touch_accel} SAMPLES={touch_samples} TOLERANCE={touch_tolerance} RETRIES={touch_retries} RETRACT={touch_retract} DEBUG={debug}
    {% endif %}
    
    ; Save if requested
    {% if auto_save %}
        RESPOND TYPE=command MSG="Saving configuration..."
        SAVE_CONFIG
    {% else %}
        RESPOND TYPE=command MSG="Calibration complete. Run SAVE_CONFIG to persist."
    {% endif %}
    
    RESPOND TYPE=command MSG=">>> Full Calibration Complete <<<"


# ==============================================================================
[gcode_macro CARTO_SCAN_CALIBRATE]
description: Calibrate the Cartographer scan model. Params: METHOD, X_POS, Y_POS, AUTO_SAVE
gcode:
    {% set method = params.METHOD|default("manual")|string|lower %}
    {% set x_pos = params.X_POS|default(printer.toolhead.axis_maximum.x|float / 2)|float %}
    {% set y_pos = params.Y_POS|default(printer.toolhead.axis_maximum.y|float / 2)|float %}
    {% set auto_save = params.AUTO_SAVE|default(0)|int %}
    {% set bed_temp = params.BED_TEMP|default(0)|int %}
    
    RESPOND TYPE=command MSG=">>> Scan Model Calibration <<<"
    
    {% if not 'x' in printer.toolhead.homed_axes or not 'y' in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    
    {% if bed_temp > 0 %}
        M140 S{bed_temp}
        M190 S{bed_temp}
    {% endif %}
    
    G0 X{x_pos} Y{y_pos} F6000
    
    {% if method == "touch" %}
        RESPOND TYPE=command MSG="Running scan cal with touch method (no paper test)"
        CARTOGRAPHER_SCAN_CALIBRATE METHOD=touch
    {% else %}
        RESPOND TYPE=command MSG="Running manual scan cal. Use TESTZ Z=-0.01 then ACCEPT"
        CARTOGRAPHER_SCAN_CALIBRATE
    {% endif %}
    
    {% if auto_save %}
        SAVE_CONFIG
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_TOUCH_CALIBRATE]
description: Survey Touch calibration. Params: START, MAX, MIN, AUTO_SAVE
gcode:
    {% set start = params.START|default(-1)|int %}
    {% set max_val = params.MAX|default(5000)|int %}
    {% set min_val = params.MIN|default(100)|int %}
    {% set auto_save = params.AUTO_SAVE|default(1)|int %}
    {% set x_pos = params.X_POS|default(printer.toolhead.axis_maximum.x|float / 2)|float %}
    {% set y_pos = params.Y_POS|default(printer.toolhead.axis_maximum.y|float / 2)|float %}
    
    RESPOND TYPE=command MSG=">>> Survey Touch Calibration <<<"
    
    {% if not 'x' in printer.toolhead.homed_axes or not 'y' in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    
    G0 X{x_pos} Y{y_pos} F6000
    
    {% if start > 0 %}
        RESPOND TYPE=command MSG="Starting from threshold {start}"
        CARTOGRAPHER_TOUCH_CALIBRATE START={start} MAX={max_val} MIN={min_val}
    {% else %}
        RESPOND TYPE=command MSG="Auto-detecting threshold..."
        CARTOGRAPHER_TOUCH_CALIBRATE MAX={max_val} MIN={min_val}
    {% endif %}
    
    {% if auto_save %}
        SAVE_CONFIG
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_THRESHOLD_SCAN]
description: Find optimal touch threshold. Params: MIN, MAX, STEP, SPEED, AUTO_SAVE
gcode:
    {% set ts_min = params.MIN|default(500)|int %}
    {% set ts_max = params.MAX|default(5000)|int %}
    {% set ts_step = params.STEP|default(250)|int %}
    {% set ts_speed = params.SPEED|default(2)|int %}
    {% set auto_save = params.AUTO_SAVE|default(0)|int %}
    {% set x_pos = params.X_POS|default(printer.toolhead.axis_maximum.x|float / 2)|float %}
    {% set y_pos = params.Y_POS|default(printer.toolhead.axis_maximum.y|float / 2)|float %}
    {% set nozzle_clean = params.CLEAN_NOZZLE|default(1)|int %}
    
    RESPOND TYPE=command MSG=">>> Threshold Scan <<<"
    
    {% if not 'x' in printer.toolhead.homed_axes or not 'y' in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    
    ; Safety warning
    {% if nozzle_clean %}
        RESPOND TYPE=command MSG="Ensure nozzle is CLEAN and bed is CLEAN before proceeding!"
        RESPOND TYPE=command MSG="Probe should be 2.6-3mm above nozzle. Waiting 5s..."
        G4 P5000
    {% endif %}
    
    G0 X{x_pos} Y{y_pos} F6000
    
    CARTOGRAPHER_THRESHOLD_SCAN MIN={ts_min} MAX={ts_max} STEP={ts_step} SPEED={ts_speed}
    
    {% if auto_save %}
        SAVE_CONFIG
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_TOUCH_OFFSET]
description: Calibrate Z offset via touch. Params: SPEED, ACCEL, SAMPLES, TOLERANCE, RETRIES, THRESHOLD, RETRACT, FUZZY, DEBUG
gcode:
    {% set speed = params.SPEED|default(3)|float %}
    {% set accel = params.ACCEL|default(100)|int %}
    {% set samples = params.SAMPLES|default(3)|int %}
    {% set tolerance = params.TOLERANCE|default(0.01)|float %}
    {% set retries = params.RETRIES|default(10)|int %}
    
    ; FIXED: Use 'cartographer' not 'scanner'
    {% set threshold = params.THRESHOLD|default(printer.configfile.settings.cartographer.scanner_touch_threshold|default(2500))|int %}
    
    {% set retract = params.RETRACT|default(2)|float %}
    {% set retract_speed = params.RETRACT_SPEED|default(10)|float %}
    {% set fuzzy = params.FUZZY|default(0)|float %}
    {% set debug = params.DEBUG|default(0)|int %}
    {% set x_pos = params.X_POS|default(printer.toolhead.axis_maximum.x|float / 2)|float %}
    {% set y_pos = params.Y_POS|default(printer.toolhead.axis_maximum.y|float / 2)|float %}
    {% set auto_save = params.AUTO_SAVE|default(1)|int %}
    
    RESPOND TYPE=command MSG=">>> Touch Offset Calibration <<<"
    RESPOND TYPE=command MSG="Speed={speed} Accel={accel} Samples={samples} Threshold={threshold}"
    
    {% if not 'x' in printer.toolhead.homed_axes or not 'y' in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    
    G0 X{x_pos} Y{y_pos} F6000
    
    CARTOGRAPHER_CALIBRATE SPEED={speed} ACCEL={accel} SAMPLES={samples} TOLERANCE={tolerance} RETRIES={retries} THRESHOLD={threshold} RETRACT={retract} RETRACT_SPEED={retract_speed} FUZZY={fuzzy} DEBUG={debug}
    
    {% if auto_save %}
        SAVE_CONFIG
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_BACKLASH]
description: Measure Z-axis backlash. Params: CORNER, AUTO_SAVE
gcode:
    {% set corner = params.CORNER|default("center")|string|lower %}
    {% set auto_save = params.AUTO_SAVE|default(0)|int %}
    {% set x_max = printer.toolhead.axis_maximum.x|float %}
    {% set y_max = printer.toolhead.axis_maximum.y|float %}
    
    RESPOND TYPE=command MSG=">>> Backlash Estimation at {corner} <<<"
    
    {% if not 'x' in printer.toolhead.homed_axes or not 'y' in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    
    ; Move to requested corner
    {% if corner == "center" %}
        G0 X{x_max/2} Y{y_max/2} F6000
    {% elif corner == "front_left" %}
        G0 X{x_max*0.1} Y{y_max*0.1} F6000
    {% elif corner == "front_right" %}
        G0 X{x_max*0.9} Y{y_max*0.1} F6000
    {% elif corner == "back_left" %}
        G0 X{x_max*0.1} Y{y_max*0.9} F6000
    {% elif corner == "back_right" %}
        G0 X{x_max*0.9} Y{y_max*0.9} F6000
    {% else %}
        RESPOND TYPE=error MSG="Unknown corner: {corner}. Use: center, front_left, front_right, back_left, back_right"
    {% endif %}
    
    CARTOGRAPHER_ESTIMATE_BACKLASH
    
    RESPOND TYPE=command MSG="Copy the 'delta' value into your config as backlash_comp: <value>"
    
    {% if auto_save %}
        RESPOND TYPE=warning MSG="AUTO_SAVE not recommended for backlash - verify value first!"
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_TEMP_CALIBRATE]
description: Full temperature compensation calibration. Params: MIN_TEMP, MAX_TEMP, BED_TEMP, Z_SPEED, AUTO_SAVE
gcode:
    {% set min_temp = params.MIN_TEMP|default(40)|int %}
    {% set max_temp = params.MAX_TEMP|default(70)|int %}
    {% set bed_temp = params.BED_TEMP|default(110)|int %}
    {% set z_speed = params.Z_SPEED|default(5)|float %}
    {% set auto_save = params.AUTO_SAVE|default(1)|int %}
    
    RESPOND TYPE=command MSG=">>> Temperature Compensation Calibration <<<"
    RESPOND TYPE=command MSG="This will take 1-3+ hours. MIN={min_temp} MAX={max_temp} BED={bed_temp}"
    
    {% if not 'x' in printer.toolhead.homed_axes or not 'y' in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    
    CARTOGRAPHER_TEMPERATURE_CALIBRATE MIN_TEMP={min_temp} MAX_TEMP={max_temp} BED_TEMP={bed_temp} Z_SPEED={z_speed}
    
    {% if auto_save %}
        SAVE_CONFIG
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_PROBE_ACCURACY]
description: Test probe repeatability at a specific location. Params: SAMPLES, X_POS, Y_POS
gcode:
    {% set samples = params.SAMPLES|default(10)|int %}
    {% set x_pos = params.X_POS|default(printer.toolhead.axis_maximum.x|float / 2)|float %}
    {% set y_pos = params.Y_POS|default(printer.toolhead.axis_maximum.y|float / 2)|float %}
    
    RESPOND TYPE=command MSG=">>> Probe Accuracy Test ({samples} samples) <<<"
    
    {% if not 'x' in printer.toolhead.homed_axes or not 'y' in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    
    G0 X{x_pos} Y{y_pos} F6000
    
    PROBE_ACCURACY SAMPLES={samples}


# ==============================================================================
[gcode_macro CARTO_TOUCH_TEST]
description: Single touch probe test at location. Params: all CARTOGRAPHER_TOUCH options
gcode:
    {% set speed = params.SPEED|default(3)|float %}
    {% set accel = params.ACCEL|default(100)|int %}
    {% set samples = params.SAMPLES|default(3)|int %}
    {% set tolerance = params.TOLERANCE|default(0.01)|float %}
    {% set retries = params.RETRIES|default(3)|int %}
    
    ; FIXED: Use 'cartographer' not 'scanner'
    {% set threshold = params.THRESHOLD|default(printer.configfile.settings.cartographer.scanner_touch_threshold|default(2500))|int %}
    
    {% set retract = params.RETRACT|default(2)|float %}
    {% set fuzzy = params.FUZZY|default(0)|float %}
    {% set debug = params.DEBUG|default(0)|int %}
    {% set x_pos = params.X_POS|default(printer.toolhead.axis_maximum.x|float / 2)|float %}
    {% set y_pos = params.Y_POS|default(printer.toolhead.axis_maximum.y|float / 2)|float %}
    
    RESPOND TYPE=command MSG=">>> Touch Test at X{x_pos} Y{y_pos} <<<"
    
    {% if not 'x' in printer.toolhead.homed_axes or not 'y' in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    
    G0 X{x_pos} Y{y_pos} F6000
    
    CARTOGRAPHER_TOUCH SPEED={speed} ACCEL={accel} SAMPLES={samples} TOLERANCE={tolerance} RETRIES={retries} THRESHOLD={threshold} RETRACT={retract} FUZZY={fuzzy} DEBUG={debug}


# ==============================================================================
[gcode_macro CARTO_SWITCH_MODE]
description: Switch between SCAN and TOUCH modes. Params: MODE
gcode:
    {% set mode = params.MODE|default("scan")|string|lower %}
    
    {% if mode not in ["scan", "touch"] %}
        RESPOND TYPE=error MSG="MODE must be 'scan' or 'touch'"
    {% else %}
        PROBE_SWITCH MODE={mode}
        SAVE_CONFIG
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_MODEL_MANAGE]
description: Save, select, or remove a calibration model. Params: ACTION, NAME
gcode:
    {% set action = params.ACTION|default("list")|string|lower %}
    {% set name = params.NAME|default("default")|string %}
    
    {% if action == "list" %}
        CARTOGRAPHER_MODEL_LIST
    {% elif action == "save" %}
        CARTOGRAPHER_MODEL_SAVE NAME={name}
        SAVE_CONFIG
        RESPOND TYPE=command MSG="Model '{name}' saved"
    {% elif action == "select" %}
        CARTOGRAPHER_MODEL_SELECT NAME={name}
        SAVE_CONFIG
        RESPOND TYPE=command MSG="Model '{name}' selected"
    {% elif action == "remove" %}
        CARTOGRAPHER_MODEL_REMOVE NAME={name}
        SAVE_CONFIG
        RESPOND TYPE=command MSG="Model '{name}' removed"
    {% else %}
        RESPOND TYPE=error MSG="ACTION must be: list, save, select, remove"
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_BED_MESH]
description: Full bed mesh with optional QGL/Z_TILT. Params: MESH_PROFILE, RUN_QGL, PROBE_TEMP
gcode:
    {% set mesh_profile = params.MESH_PROFILE|default("default")|string %}
    {% set run_qgl = params.RUN_QGL|default(1)|int %}
    {% set probe_temp = params.PROBE_TEMP|default(0)|int %}
    {% set x_pos = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_pos = printer.toolhead.axis_maximum.y|float / 2 %}
    
    RESPOND TYPE=command MSG=">>> Bed Mesh Calibration <<<"
    
    G28
    
    {% if run_qgl %}
        {% if printer.configfile.settings.quad_gantry_level is defined %}
            RESPOND TYPE=command MSG="Running Quad Gantry Level..."
            QUAD_GANTRY_LEVEL
            G28 Z
        {% elif printer.configfile.settings.z_tilt is defined %}
            RESPOND TYPE=command MSG="Running Z Tilt Adjust..."
            Z_TILT_ADJUST
            G28 Z
        {% endif %}
    {% endif %}
    
    {% if probe_temp > 0 %}
        RESPOND TYPE=command MSG="Stabilizing probe at {probe_temp}C..."
        M104 S{probe_temp}
        M109 S{probe_temp}
    {% endif %}
    
    BED_MESH_CALIBRATE PROFILE={mesh_profile}
    BED_MESH_PROFILE SAVE={mesh_profile}
    
    RESPOND TYPE=command MSG="Bed mesh '{mesh_profile}' complete"


# ==============================================================================
[gcode_macro CARTO_QUICK_CHECK]
description: Quick health check: home, probe accuracy, touch test. Params: none
gcode:
    RESPOND TYPE=command MSG=">>> Cartographer Quick Health Check <<<"
    
    G28
    CARTO_PROBE_ACCURACY SAMPLES=5
    CARTO_TOUCH_TEST SAMPLES=3 DEBUG=0
    
    RESPOND TYPE=command MSG=">>> Health Check Complete <<<"