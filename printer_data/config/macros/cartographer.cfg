# Cartographer V4 - USB + Scan mode
[mcu cartographer]
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_400038000C50315447313620-if00
restart_method: command

[cartographer scan]
mesh_runs: 2

[axis_twist_compensation] 

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 48
verbose: yes #no

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

[quad_gantry_level]
gantry_corners:
    50, -5
    326, 250

points:
    56, -3
    56, 250
    320, 250
    320, -3
  
speed: 300
horizontal_move_z: 2 
retry_tolerance: 0.005
retries: 10
max_adjust: 10




[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    # Coarse pass using touch to handle badly unlevel gantry
    _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=4 RETRY_TOLERANCE=0.1
    # Fine pass - scan takes over at low z
    _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=2 RETRY_TOLERANCE=0.005




[bed_mesh]
zero_reference_position: 175, 130

speed: 400
horizontal_move_z: 2
mesh_min: 30, 42
mesh_max: 340, 320

probe_count: 10,10
adaptive_margin: 10
mesh_pps: 0, 0 #2, 2
algorithm: bicubic

fade_start: 1                       
fade_end: 10                    
fade_target: 0

    



# [adxl345 carto]
# # Select 1 of the cs_pin below depending on the probe you have. 
# # Having the wrong one selected will cause an Endless Bootloop
# # Cartographer V4 has int2 connected to the probes PA1 pin

# cs_pin: cartographer:PA0 # For Cartographer V4
# spi_bus: spi1
# axes_map: y, -x, z

# # [resonance_tester]
# # accel_chip: adxl345
# # probe_points:
# #     175, 175, 50












# ==============================================================================
# CARTOGRAPHER CALIBRATION SUITE - Mainsail UI Ready
# Updated against official docs: docs.cartographer3d.com (May 2026)
# ==============================================================================

[gcode_macro CARTO_FULL_CALIBRATION]
description: Full pipeline: Scan model + Touch cal. Params: MODE, SCAN_METHOD, SCAN_MODEL, TS_SPEED, TOUCH_SPEED, TOUCH_MAX_VERIFY_RANGE, TOUCH_MODEL, TOUCH_START, TOUCH_MAX, BED_TEMP, NOZZLE_TEMP, AUTO_SAVE
gcode:
    {% set mode = params.MODE|default("scan")|string|lower %}
    {% set scan_method = params.SCAN_METHOD|default("manual")|string|lower %}
    {% set scan_model = params.SCAN_MODEL|default("default")|string %}
    {% set ts_speed = params.TS_SPEED|default(2)|int %}
    {% set touch_speed = params.TOUCH_SPEED|default(2)|int %}
    {% set touch_max_verify = params.TOUCH_MAX_VERIFY_RANGE|default(0.5)|float %}
    {% set touch_model = params.TOUCH_MODEL|default("default")|string %}
    {% set touch_start = params.TOUCH_START|default(500)|int %}
    {% set touch_max = params.TOUCH_MAX|default(5000)|int %}
    {% set touch_verification = params.TOUCH_VERIFICATION_SAMPLES|default(10)|int %}
    {% set bed_temp = params.BED_TEMP|default(0)|int %}
    {% set nozzle_temp = params.NOZZLE_TEMP|default(0)|int %}
    {% set auto_save = params.AUTO_SAVE|default(1)|int %}
    {% set x_pos = params.X_POS|default(printer.toolhead.axis_maximum.x|float / 2)|float %}
    {% set y_pos = params.Y_POS|default(printer.toolhead.axis_maximum.y|float / 2)|float %}
    
    RESPOND TYPE=command MSG=">>> Full Cartographer Calibration (MODE={mode}) <<<"
    
    {% if not printer.toolhead.homed_axes %}
        RESPOND TYPE=error MSG="Axes not homed! Homing X/Y first..."
        G28 X Y
    {% endif %}
    
    {% if bed_temp > 0 %}
        RESPOND TYPE=command MSG="Heating bed to {bed_temp}C..."
        M140 S{bed_temp}
        M190 S{bed_temp}
    {% endif %}
    {% if nozzle_temp > 0 %}
        RESPOND TYPE=command MSG="Heating nozzle to {nozzle_temp}C..."
        M104 S{nozzle_temp}
        M109 S{nozzle_temp}
    {% endif %}
    
    G0 X{x_pos} Y{y_pos} F6000
    
    ; Step 1: Scan calibration (always do this first)
    RESPOND TYPE=command MSG="Step 1/2: Scan calibration (MODEL={scan_model}, METHOD={scan_method})"
    CARTOGRAPHER_SCAN_CALIBRATE MODEL={scan_model} METHOD={scan_method}
    
    ; Step 2: Touch calibration (only if touch mode requested)
    {% if mode == "touch" %}
        RESPOND TYPE=command MSG="Step 2/2: Touch calibration (MODEL={touch_model})"
        CARTOGRAPHER_TOUCH_CALIBRATE MAX_VERIFY_RANGE={touch_max_verify} MODEL={touch_model} SPEED={touch_speed} START={touch_start} MAX={touch_max} VERIFICATION_SAMPLES={touch_verification}
    {% endif %}
    
    {% if auto_save %}
        SAVE_CONFIG
    {% else %}
        RESPOND TYPE=command MSG="Calibration complete. Run SAVE_CONFIG to persist."
    {% endif %}
    
    RESPOND TYPE=command MSG=">>> Full Calibration Complete <<<"


# ==============================================================================
[gcode_macro CARTO_SCAN_CALIBRATE]
description: Calibrate scan model. Params: MODEL, METHOD, X_POS, Y_POS, AUTO_SAVE
gcode:
    {% set model = params.MODEL|default("default")|string %}
    {% set method = params.METHOD|default("manual")|string|lower %}
    {% set x_pos = params.X_POS|default(printer.toolhead.axis_maximum.x|float / 2)|float %}
    {% set y_pos = params.Y_POS|default(printer.toolhead.axis_maximum.y|float / 2)|float %}
    {% set auto_save = params.AUTO_SAVE|default(0)|int %}
    {% set bed_temp = params.BED_TEMP|default(0)|int %}
    
    RESPOND TYPE=command MSG=">>> Scan Model Calibration (MODEL={model}) <<<"
    
    {% if not 'x' in printer.toolhead.homed_axes or not 'y' in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    
    {% if bed_temp > 0 %}
        M140 S{bed_temp}
        M190 S{bed_temp}
    {% endif %}
    
    G0 X{x_pos} Y{y_pos} F6000
    
    {% if method == "touch" %}
        RESPOND TYPE=command MSG="Running scan cal with touch method"
        CARTOGRAPHER_SCAN_CALIBRATE MODEL={model} METHOD=touch
    {% else %}
        RESPOND TYPE=command MSG="Running manual scan cal. Use TESTZ Z=-0.01 then ACCEPT"
        CARTOGRAPHER_SCAN_CALIBRATE MODEL={model} METHOD=manual
    {% endif %}
    
    {% if auto_save %}
        SAVE_CONFIG
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_TOUCH_CALIBRATE]
description: Survey Touch calibration. Params: MAX_VERIFY_RANGE, MODEL, SPEED, START, MAX, VERIFICATION_SAMPLES, AUTO_SAVE
gcode:
    {% set max_verify = params.MAX_VERIFY_RANGE|default(0.5)|float %}
    {% set model = params.MODEL|default("default")|string %}
    {% set speed = params.SPEED|default(2)|int %}
    {% set start = params.START|default(500)|int %}
    {% set max_val = params.MAX|default(5000)|int %}
    {% set verification = params.VERIFICATION_SAMPLES|default(10)|int %}
    {% set auto_save = params.AUTO_SAVE|default(1)|int %}
    {% set x_pos = params.X_POS|default(printer.toolhead.axis_maximum.x|float / 2)|float %}
    {% set y_pos = params.Y_POS|default(printer.toolhead.axis_maximum.y|float / 2)|float %}
    
    RESPOND TYPE=command MSG=">>> Survey Touch Calibration (MODEL={model}) <<<"
    
    {% if not 'x' in printer.toolhead.homed_axes or not 'y' in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    
    G0 X{x_pos} Y{y_pos} F6000
    
    CARTOGRAPHER_TOUCH_CALIBRATE MAX_VERIFY_RANGE={max_verify} MODEL={model} SPEED={speed} START={start} MAX={max_val} VERIFICATION_SAMPLES={verification}
    
    {% if auto_save %}
        SAVE_CONFIG
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_THRESHOLD_SCAN]
description: Find optimal touch threshold. Params: MIN, MAX, STEP, SPEED, AUTO_SAVE
gcode:
    {% set ts_min = params.MIN|default(500)|int %}
    {% set ts_max = params.MAX|default(5000)|int %}
    {% set ts_step = params.STEP|default(250)|int %}
    {% set ts_speed = params.SPEED|default(2)|int %}
    {% set auto_save = params.AUTO_SAVE|default(0)|int %}
    {% set x_pos = params.X_POS|default(printer.toolhead.axis_maximum.x|float / 2)|float %}
    {% set y_pos = params.Y_POS|default(printer.toolhead.axis_maximum.y|float / 2)|float %}
    {% set nozzle_clean = params.CLEAN_NOZZLE|default(1)|int %}
    
    RESPOND TYPE=command MSG=">>> Threshold Scan <<<"
    
    {% if not 'x' in printer.toolhead.homed_axes or not 'y' in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    
    {% if nozzle_clean %}
        RESPOND TYPE=command MSG="Ensure nozzle is CLEAN and bed is CLEAN!"
        RESPOND TYPE=command MSG="Probe should be 2.6-3mm above nozzle. Waiting 5s..."
        G4 P5000
    {% endif %}
    
    G0 X{x_pos} Y{y_pos} F6000
    
    CARTOGRAPHER_THRESHOLD_SCAN MIN={ts_min} MAX={ts_max} STEP={ts_step} SPEED={ts_speed}
    
    {% if auto_save %}
        SAVE_CONFIG
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_TOUCH_OFFSET]
description: Calibrate Z offset via touch. Params: MAX_VERIFY_RANGE, MODEL, SPEED, START, MAX, VERIFICATION_SAMPLES, AUTO_SAVE
gcode:
    {% set max_verify = params.MAX_VERIFY_RANGE|default(0.5)|float %}
    {% set model = params.MODEL|default("default")|string %}
    {% set speed = params.SPEED|default(2)|int %}
    {% set start = params.START|default(500)|int %}
    {% set max_val = params.MAX|default(5000)|int %}
    {% set verification = params.VERIFICATION_SAMPLES|default(10)|int %}
    {% set x_pos = params.X_POS|default(printer.toolhead.axis_maximum.x|float / 2)|float %}
    {% set y_pos = params.Y_POS|default(printer.toolhead.axis_maximum.y|float / 2)|float %}
    {% set auto_save = params.AUTO_SAVE|default(1)|int %}
    
    RESPOND TYPE=command MSG=">>> Touch Offset Calibration (MODEL={model}) <<<"
    RESPOND TYPE=command MSG="Speed={speed} START={start} MAX={max_val}"
    
    {% if not 'x' in printer.toolhead.homed_axes or not 'y' in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    
    G0 X{x_pos} Y{y_pos} F6000
    
    ; This runs the full touch calibration which sets Z offset
    CARTOGRAPHER_TOUCH_CALIBRATE MAX_VERIFY_RANGE={max_verify} MODEL={model} SPEED={speed} START={start} MAX={max_val} VERIFICATION_SAMPLES={verification}
    
    {% if auto_save %}
        SAVE_CONFIG
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_BACKLASH]
description: Measure Z-axis backlash. Params: CALIBRATE, ITERATIONS, DELTA, CORNER
gcode:
    {% set calibrate = params.CALIBRATE|default(0)|int %}
    {% set iterations = params.ITERATIONS|default(10)|int %}
    {% set delta = params.DELTA|default(0.2)|float %}
    {% set corner = params.CORNER|default("center")|string|lower %}
    {% set x_max = printer.toolhead.axis_maximum.x|float %}
    {% set y_max = printer.toolhead.axis_maximum.y|float %}
    
    RESPOND TYPE=command MSG=">>> Backlash Estimation at {corner} <<<"
    
    {% if not 'x' in printer.toolhead.homed_axes or not 'y' in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    
    ; Move to requested corner
    {% if corner == "center" %}
        G0 X{x_max/2} Y{y_max/2} F6000
    {% elif corner == "front_left" %}
        G0 X{x_max*0.1} Y{y_max*0.1} F6000
    {% elif corner == "front_right" %}
        G0 X{x_max*0.9} Y{y_max*0.1} F6000
    {% elif corner == "back_left" %}
        G0 X{x_max*0.1} Y{y_max*0.9} F6000
    {% elif corner == "back_right" %}
        G0 X{x_max*0.9} Y{y_max*0.9} F6000
    {% else %}
        RESPOND TYPE=error MSG="Unknown corner: {corner}. Use: center, front_left, front_right, back_left, back_right"
    {% endif %}
    
    {% if calibrate %}
        CARTOGRAPHER_ESTIMATE_BACKLASH CALIBRATE=yes ITERATIONS={iterations} DELTA={delta}
    {% else %}
        CARTOGRAPHER_ESTIMATE_BACKLASH CALIBRATE=no ITERATIONS={iterations} DELTA={delta}
    {% endif %}
    
    RESPOND TYPE=command MSG="If CALIBRATE=yes, value was saved. Otherwise copy 'delta' into backlash_comp:"


# ==============================================================================
[gcode_macro CARTO_TEMP_CALIBRATE]
description: Temperature compensation calibration. Params: MIN_TEMP, MAX_TEMP, BED_TEMP, Z_SPEED, AUTO_SAVE
gcode:
    {% set min_temp = params.MIN_TEMP|default(40)|int %}
    {% set max_temp = params.MAX_TEMP|default(60)|int %}
    {% set bed_temp = params.BED_TEMP|default(90)|int %}
    {% set z_speed = params.Z_SPEED|default(5)|int %}
    {% set auto_save = params.AUTO_SAVE|default(1)|int %}
    
    RESPOND TYPE=command MSG=">>> Temperature Compensation Calibration <<<"
    RESPOND TYPE=command MSG="This will take 1-3+ hours. MIN={min_temp} MAX={max_temp} BED={bed_temp}"
    
    {% if not 'x' in printer.toolhead.homed_axes or not 'y' in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    
    CARTOGRAPHER_TEMPERATURE_CALIBRATE MIN_TEMP={min_temp} MAX_TEMP={max_temp} BED_TEMP={bed_temp} Z_SPEED={z_speed}
    
    {% if auto_save %}
        SAVE_CONFIG
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_SCAN_ACCURACY]
description: Test scan probe repeatability. Params: READINGS, SAMPLES, X_POS, Y_POS
gcode:
    {% set readings = params.READINGS|default(20)|int %}
    {% set samples = params.SAMPLES|default(100)|int %}
    {% set x_pos = params.X_POS|default(printer.toolhead.axis_maximum.x|float / 2)|float %}
    {% set y_pos = params.Y_POS|default(printer.toolhead.axis_maximum.y|float / 2)|float %}
    
    RESPOND TYPE=command MSG=">>> Scan Accuracy Test (READINGS={readings}, SAMPLES={samples}) <<<"
    
    {% if not 'x' in printer.toolhead.homed_axes or not 'y' in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    
    G0 X{x_pos} Y{y_pos} F6000
    
    CARTOGRAPHER_SCAN_ACCURACY READINGS={readings} SAMPLES={samples}


# ==============================================================================
[gcode_macro CARTO_TOUCH_ACCURACY]
description: Test touch probe repeatability. Params: LIFT_SPEED, SAMPLE_RETRACT_DIST, SAMPLES, X_POS, Y_POS
gcode:
    {% set lift_speed = params.LIFT_SPEED|default(5)|float %}
    {% set retract_dist = params.SAMPLE_RETRACT_DIST|default(1.0)|float %}
    {% set samples = params.SAMPLES|default(5)|int %}
    {% set x_pos = params.X_POS|default(printer.toolhead.axis_maximum.x|float / 2)|float %}
    {% set y_pos = params.Y_POS|default(printer.toolhead.axis_maximum.y|float / 2)|float %}
    
    RESPOND TYPE=command MSG=">>> Touch Accuracy Test ({samples} samples) <<<"
    
    {% if not 'x' in printer.toolhead.homed_axes or not 'y' in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    
    G0 X{x_pos} Y{y_pos} F6000
    
    CARTOGRAPHER_TOUCH_ACCURACY LIFT_SPEED={lift_speed} SAMPLE_RETRACT_DIST={retract_dist} SAMPLES={samples}


# ==============================================================================
[gcode_macro CARTO_TOUCH_PROBE]
description: Single touch probe at current position. No params.
gcode:
    RESPOND TYPE=command MSG=">>> Single Touch Probe <<<"
    CARTOGRAPHER_TOUCH_PROBE


# ==============================================================================
[gcode_macro CARTO_SWITCH_MODE]
description: Switch between SCAN and TOUCH modes. Params: MODE
gcode:
    {% set mode = params.MODE|default("scan")|string|lower %}
    
    {% if mode not in ["scan", "touch"] %}
        RESPOND TYPE=error MSG="MODE must be 'scan' or 'touch'"
    {% else %}
        PROBE_SWITCH MODE={mode}
        SAVE_CONFIG
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_SCAN_MODEL]
description: Manage scan models. Params: ACTION, NAME
gcode:
    {% set action = params.ACTION|default("list")|string|lower %}
    {% set name = params.NAME|default("")|string %}
    
    {% if action == "list" %}
        CARTOGRAPHER_SCAN_MODEL
    {% elif action == "load" %}
        CARTOGRAPHER_SCAN_MODEL LOAD={name}
        RESPOND TYPE=command MSG="Scan model '{name}' loaded"
    {% elif action == "remove" %}
        CARTOGRAPHER_SCAN_MODEL REMOVE={name}
        SAVE_CONFIG
        RESPOND TYPE=command MSG="Scan model '{name}' removed"
    {% else %}
        RESPOND TYPE=error MSG="ACTION must be: list, load, remove"
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_TOUCH_MODEL]
description: Manage touch models. Params: ACTION, NAME
gcode:
    {% set action = params.ACTION|default("list")|string|lower %}
    {% set name = params.NAME|default("")|string %}
    
    {% if action == "list" %}
        CARTOGRAPHER_TOUCH_MODEL
    {% elif action == "load" %}
        CARTOGRAPHER_TOUCH_MODEL LOAD={name}
        RESPOND TYPE=command MSG="Touch model '{name}' loaded"
    {% elif action == "remove" %}
        CARTOGRAPHER_TOUCH_MODEL REMOVE={name}
        SAVE_CONFIG
        RESPOND TYPE=command MSG="Touch model '{name}' removed"
    {% else %}
        RESPOND TYPE=error MSG="ACTION must be: list, load, remove"
    {% endif %}


# ==============================================================================
[gcode_macro CARTO_BED_MESH]
description: Full bed mesh with optional QGL/Z_TILT. Params: MESH_PROFILE, RUN_QGL, METHOD, HEIGHT, RUNS, PATH, DIRECTION, SPEED, PROBE_TEMP
gcode:
    {% set mesh_profile = params.MESH_PROFILE|default("default")|string %}
    {% set run_qgl = params.RUN_QGL|default(1)|int %}
    {% set method = params.METHOD|default("scan")|string %}
    {% set height = params.HEIGHT|default(5.0)|float %}
    {% set runs = params.RUNS|default(1)|int %}
    {% set path = params.PATH|default("snake")|string %}
    {% set direction = params.DIRECTION|default("x")|string %}
    {% set speed = params.SPEED|default(50.0)|float %}
    {% set probe_temp = params.PROBE_TEMP|default(0)|int %}
    
    RESPOND TYPE=command MSG=">>> Bed Mesh Calibration <<<"
    
    G28
    
    {% if run_qgl %}
        {% if printer.configfile.settings.quad_gantry_level is defined %}
            RESPOND TYPE=command MSG="Running Quad Gantry Level..."
            QUAD_GANTRY_LEVEL
            G28 Z
        {% elif printer.configfile.settings.z_tilt is defined %}
            RESPOND TYPE=command MSG="Running Z Tilt Adjust..."
            Z_TILT_ADJUST
            G28 Z
        {% endif %}
    {% endif %}
    
    {% if probe_temp > 0 %}
        RESPOND TYPE=command MSG="Stabilizing probe at {probe_temp}C..."
        M104 S{probe_temp}
        M109 S{probe_temp}
    {% endif %}
    
    BED_MESH_CALIBRATE METHOD={method} HEIGHT={height} RUNS={runs} PATH={path} DIRECTION={direction} SPEED={speed} PROFILE={mesh_profile}
    BED_MESH_PROFILE SAVE={mesh_profile}
    
    RESPOND TYPE=command MSG="Bed mesh '{mesh_profile}' complete"


# ==============================================================================
[gcode_macro CARTO_QUICK_CHECK]
description: Quick health check: home, scan accuracy, touch accuracy. Params: none
gcode:
    RESPOND TYPE=command MSG=">>> Cartographer Quick Health Check <<<"
    
    G28
    CARTO_SCAN_ACCURACY READINGS=20 SAMPLES=50
    CARTO_TOUCH_ACCURACY SAMPLES=3 LIFT_SPEED=5
    
    RESPOND TYPE=command MSG=">>> Health Check Complete <<<"


# ==============================================================================
[gcode_macro CARTO_AXIS_TWIST]
description: Scan and touch to calculate axis twist compensation. Params: AXIS, SAMPLE_COUNT, USE_TOUCH_BOUNDARIES, START, END, LINE
gcode:
    {% set axis = params.AXIS|default("x")|string|lower %}
    {% set sample_count = params.SAMPLE_COUNT|default(5)|int %}
    {% set use_touch = params.USE_TOUCH_BOUNDARIES|default(0)|int %}
    {% set start = params.START|default(none) %}
    {% set end = params.END|default(none) %}
    {% set line = params.LINE|default(none) %}
    
    RESPOND TYPE=command MSG=">>> Axis Twist Compensation (AXIS={axis}) <<<"
    
    {% if not 'x' in printer.toolhead.homed_axes or not 'y' in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    
    {% if use_touch %}
        {% if start is not none and end is not none and line is not none %}
            CARTOGRAPHER_AXIS_TWIST_COMPENSATION USE_TOUCH_BOUNDARIES=yes AXIS={axis} SAMPLE_COUNT={sample_count} START={start} END={end} LINE={line}
        {% elif start is not none and end is not none %}
            CARTOGRAPHER_AXIS_TWIST_COMPENSATION USE_TOUCH_BOUNDARIES=yes AXIS={axis} SAMPLE_COUNT={sample_count} START={start} END={end}
        {% else %}
            CARTOGRAPHER_AXIS_TWIST_COMPENSATION USE_TOUCH_BOUNDARIES=yes AXIS={axis} SAMPLE_COUNT={sample_count}
        {% endif %}
    {% else %}
        {% if start is not none and end is not none and line is not none %}
            CARTOGRAPHER_AXIS_TWIST_COMPENSATION USE_TOUCH_BOUNDARIES=no AXIS={axis} SAMPLE_COUNT={sample_count} START={start} END={end} LINE={line}
        {% elif start is not none and end is not none %}
            CARTOGRAPHER_AXIS_TWIST_COMPENSATION USE_TOUCH_BOUNDARIES=no AXIS={axis} SAMPLE_COUNT={sample_count} START={start} END={end}
        {% else %}
            CARTOGRAPHER_AXIS_TWIST_COMPENSATION USE_TOUCH_BOUNDARIES=no AXIS={axis} SAMPLE_COUNT={sample_count}
        {% endif %}
    {% endif %}
    
    SAVE_CONFIG
    RESPOND TYPE=command MSG="Axis twist compensation saved. Restart required."