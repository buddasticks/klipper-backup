[gcode_macro PARK_NOZZLE]
description: Park nozzle during heating — respects toolchanger state
variable_park_x: 340
variable_park_y: 2
variable_park_z: 5
variable_park_z_clearance: 10
gcode:
  {% set PARK_X = params.X | default(printer["gcode_macro PARK_NOZZLE"].park_x) | float %}
  {% set PARK_Y = params.Y | default(printer["gcode_macro PARK_NOZZLE"].park_y) | float %}
  {% set PARK_Z = params.Z | default(printer["gcode_macro PARK_NOZZLE"].park_z) | float %}
  {% set PARK_Z_CLEARANCE = params.Z_CLEARANCE | default(printer["gcode_macro PARK_NOZZLE"].park_z_clearance) | float %}
  {% set F = params.F | default(15000) | int %}
  G90
  G0 Z{PARK_Z_CLEARANCE} F1200
  G0 X{PARK_X} Y{PARK_Y} F{F}
  G0 Z{PARK_Z} F1200
  M117 Parked at X{PARK_X} Y{PARK_Y} Z{PARK_Z}