################################
# INTERNAL STATE (legacy kept for UI compatibility only)
################################
[gcode_macro _HEAT_SOAK_STATE]
variable_enabled: 1
gcode:


################################
# LOAD SAVED STATE ON STARTUP
################################
[delayed_gcode HEAT_SOAK_BOOT]
initial_duration: 5
gcode:
  {% set sv = printer.save_variables.variables %}
  {% set heat = sv.heat_soak_enabled | default(1) | int %}

  # sync legacy UI state with real persisted state
  SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=enabled VALUE={heat}

  {% if heat == 1 %}
    M117 Heat Soak: ENABLED
    RESPOND PREFIX="HeatSoak" MSG="ENABLED (boot)"
  {% else %}
    M117 Heat Soak: DISABLED
    RESPOND PREFIX="HeatSoak" MSG="DISABLED (boot)"
  {% endif %}


################################
# TOGGLE (MAINSAIL BUTTON)
################################
[gcode_macro HEAT_SOAK_TOGGLE]
description: Toggle Heat Soak ON/OFF (persistent)
gcode:
  {% set state = printer.save_variables.variables.heat_soak_enabled | default(1) | int %}
  {% set new = 0 if state == 1 else 1 %}

  # persist FIRST (source of truth)
  SAVE_VARIABLE VARIABLE=heat_soak_enabled VALUE={new}

  # sync UI state
  SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_STATE VARIABLE=enabled VALUE={new}

  {% if new == 1 %}
    RESPOND MSG="Heat soak ENABLED (saved)"
    M117 Soak ON
  {% else %}
    RESPOND MSG="Heat soak DISABLED (saved)"
    M117 Soak OFF
  {% endif %}


################################
# OPTIONAL STATUS CHECK
################################
[gcode_macro HEAT_SOAK_STATUS]
description: Show heat soak state + chamber temp
gcode:
  {% set state = printer.save_variables.variables.heat_soak_enabled | default(1) | int %}
  {% set chamber = printer["temperature_sensor Chamber"].temperature | default(0) | float %}

  RESPOND MSG="Heat soak: {'ENABLED' if state == 1 else 'DISABLED'} | Chamber: {chamber}C"
  M117 Soak: {"ON" if state == 1 else "OFF"}


################################
# MAIN HEAT SOAK MACRO
################################
[gcode_macro HEAT_SOAK]
description: Heat bed and soak (respects toggle + chamber logic)
gcode:
  {% set BED       = params.BED       | default(0)  | int %}
  {% set CHAMBER   = params.CHAMBER   | default(0)  | int %}
  {% set SOAK_TIME = params.SOAK_TIME | default(5)  | int %}
  {% set FILAMENT  = params.FILAMENT  | default("PLA") | upper %}

  {% set chamber_temp = printer["temperature_sensor Chamber"].temperature | default(0) | float %}

  # SINGLE SOURCE OF TRUTH (NO LEGACY STATE READ HERE)
  #{% set ENABLED = printer.save_variables.variables.heat_soak_enabled | default(1) | int %}
  {% set ENABLED = printer["gcode_macro _HEAT_SOAK_STATE"].enabled | int %}
  
  {% if ENABLED == 0 %}
    RESPOND MSG="Heat soak DISABLED — heating bed only"
    M140 S{BED}
    M190 S{BED}
  
  {% elif FILAMENT not in ["ABS", "ASA", "PC", "PA", "PETG"] %}
    RESPOND MSG="No soak needed for {FILAMENT}"
    M140 S{BED}
    M190 S{BED}
  
  {% elif CHAMBER > 0 and chamber_temp >= CHAMBER %}
    RESPOND MSG="Chamber already at temp ({chamber_temp}C)"
    M140 S{BED}
    M190 S{BED}
  
  {% else %}
    RESPOND MSG="Heat soaking {SOAK_TIME} min @ {BED}C"
    M117 Heat soaking...
  
    M140 S{BED}
    M190 S{BED}
  
    G4 P{SOAK_TIME * 60 * 1000}
  
    {% if CHAMBER > 0 %}
      TEMPERATURE_WAIT SENSOR="temperature_sensor Chamber" MINIMUM={CHAMBER}
    {% endif %}
  
    RESPOND MSG="Heat soak complete"
    M117 Done
  {% endif %}