################################################################################
# TOOL OFFSET PERSISTENCE
# Saves/loads gcode_x/y/z_offset to saved_variables.cfg instead of printer.cfg
################################################################################

# ── Auto-load offsets 2s after Klipper starts ─────────────────────────────
[delayed_gcode LOAD_TOOL_OFFSETS]
initial_duration: 2
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set tc  = printer.toolchanger %}
    {% for tool_name in tc.tool_names %}
        {% set tool = printer[tool_name] %}
        {% set tn   = tool.tool_number %}
        {% if ('t' ~ tn ~ '_gcode_x_offset') in svv %}
            SET_TOOL_PARAMETER T={tn} PARAMETER=gcode_x_offset VALUE={svv['t' ~ tn ~ '_gcode_x_offset']}
            SET_TOOL_PARAMETER T={tn} PARAMETER=gcode_y_offset VALUE={svv['t' ~ tn ~ '_gcode_y_offset']}
            SET_TOOL_PARAMETER T={tn} PARAMETER=gcode_z_offset VALUE={svv['t' ~ tn ~ '_gcode_z_offset']}
            RESPOND MSG="Loaded offsets T{tn}: X={svv['t' ~ tn ~ '_gcode_x_offset']} Y={svv['t' ~ tn ~ '_gcode_y_offset']} Z={svv['t' ~ tn ~ '_gcode_z_offset']}"
        {% else %}
            RESPOND MSG="No saved offsets for T{tn} — using config defaults (0.0)"
        {% endif %}
    {% endfor %}


# ── Persist all tool offsets to saved_variables.cfg ───────────────────────
[gcode_macro SAVE_TOOL_OFFSETS]
description: Save all tool gcode offsets to saved_variables.cfg
gcode:
    {% set tc = printer.toolchanger %}
    {% for tool_name in tc.tool_names %}
        {% set tool = printer[tool_name] %}
        {% set tn   = tool.tool_number %}
        SAVE_VARIABLE VARIABLE=t{tn}_gcode_x_offset VALUE={tool.gcode_x_offset}
        SAVE_VARIABLE VARIABLE=t{tn}_gcode_y_offset VALUE={tool.gcode_y_offset}
        SAVE_VARIABLE VARIABLE=t{tn}_gcode_z_offset VALUE={tool.gcode_z_offset}
        RESPOND MSG="Saved T{tn}: X={tool.gcode_x_offset} Y={tool.gcode_y_offset} Z={tool.gcode_z_offset}"
    {% endfor %}
    M117 Tool offsets saved


# ── Set one axis at a time and immediately persist ────────────────────────
# Usage: SET_AND_SAVE_TOOL_OFFSET T=1 X=1.25 Y=-0.5 Z=0.12
[gcode_macro SET_AND_SAVE_TOOL_OFFSET]
description: Set a tool gcode offset at runtime and save it
gcode:
    {% set tn = params.T | default(0) | int %}
    {% set x  = params.X | default(none) %}
    {% set y  = params.Y | default(none) %}
    {% set z  = params.Z | default(none) %}
    {% if x is not none %}
        SET_TOOL_PARAMETER T={tn} PARAMETER=gcode_x_offset VALUE={x}
        SAVE_VARIABLE VARIABLE=t{tn}_gcode_x_offset VALUE={x}
    {% endif %}
    {% if y is not none %}
        SET_TOOL_PARAMETER T={tn} PARAMETER=gcode_y_offset VALUE={y}
        SAVE_VARIABLE VARIABLE=t{tn}_gcode_y_offset VALUE={y}
    {% endif %}
    {% if z is not none %}
        SET_TOOL_PARAMETER T={tn} PARAMETER=gcode_z_offset VALUE={z}
        SAVE_VARIABLE VARIABLE=t{tn}_gcode_z_offset VALUE={z}
    {% endif %}
    RESPOND MSG="T{tn} offset updated and saved"