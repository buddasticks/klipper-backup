#==============================================================================
# CHAMBER FAN CONTROLLER (ENUM STATE MACHINE - STABLE VERSION)
#==============================================================================

#==============================================================================
# SENSOR
#==============================================================================

[temperature_sensor Chamber]
sensor_type: Generic 3950
sensor_pin: hexa:PA1
min_temp: -10
max_temp: 100


#==============================================================================
# FAN
#==============================================================================

[fan_generic chamber_fan]
pin: hexa:PA8
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.75
off_below: 0.15
cycle_time: 0.01


#==============================================================================
# STATE MACHINE (NUMERIC ENUMS)
#==============================================================================

[gcode_macro _CHAMBER_STATE]

# 0=IDLE, 1=AUTO, 2=MANUAL, 3=PURGE
variable_state: 0

variable_active: False

variable_manual_speed: 0.0
variable_target_temp: -1

variable_hysteresis: 2

# filament temps (safe scalars)
variable_PLA: 30
variable_TPU: 30
variable_PETG: 35
variable_ABS: 55
variable_ASA: 55
variable_PC: 55
variable_PA: 55
variable_NYLON: 55


gcode:


#==============================================================================
# FAN INTERCEPT (UI + MACROS)
#==============================================================================

[gcode_macro SET_FAN_SPEED]
rename_existing: SET_FAN_SPEED_BASE
gcode:

    {% set fan = params.FAN|default("") %}
    {% set speed = params.SPEED|float %}
    {% set st = printer["gcode_macro _CHAMBER_STATE"] %}

    SET_FAN_SPEED_BASE FAN={fan} SPEED={speed}

    {% if fan == "chamber_fan" %}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_STATE VARIABLE=manual_speed VALUE={speed}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_STATE VARIABLE=state VALUE=2
    {% endif %}


#==============================================================================
# START PRINT
#==============================================================================

[gcode_macro CHAMBER_START]
gcode:
    {% set filament = params.FILAMENT|default("PLA")|upper %}
    {% set st = printer["gcode_macro _CHAMBER_STATE"] %}

    {% set target = 30 %}

    {% if filament == "PLA" %}{% set target = st.PLA %}
    {% elif filament == "TPU" %}{% set target = st.TPU %}
    {% elif filament == "PETG" %}{% set target = st.PETG %}
    {% elif filament == "ABS" %}{% set target = st.ABS %}
    {% elif filament == "ASA" %}{% set target = st.ASA %}
    {% elif filament == "PC" %}{% set target = st.PC %}
    {% elif filament == "PA" %}{% set target = st.PA %}
    {% elif filament == "NYLON" %}{% set target = st.NYLON %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_CHAMBER_STATE VARIABLE=target_temp VALUE={target}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_STATE VARIABLE=active VALUE=True
    SET_GCODE_VARIABLE MACRO=_CHAMBER_STATE VARIABLE=state VALUE=1

    RESPOND MSG="Chamber AUTO started ({filament}) target {target}C"

    UPDATE_DELAYED_GCODE ID=_CHAMBER_LOOP DURATION=2


#==============================================================================
# STOP PRINT
#==============================================================================

[gcode_macro CHAMBER_STOP]
gcode:
    {% set st = printer["gcode_macro _CHAMBER_STATE"] %}

    SET_GCODE_VARIABLE MACRO=_CHAMBER_STATE VARIABLE=active VALUE=False
    SET_GCODE_VARIABLE MACRO=_CHAMBER_STATE VARIABLE=state VALUE=0
    SET_GCODE_VARIABLE MACRO=_CHAMBER_STATE VARIABLE=manual_speed VALUE=0

    SET_FAN_SPEED FAN=chamber_fan SPEED=0

    UPDATE_DELAYED_GCODE ID=_CHAMBER_LOOP DURATION=0

    RESPOND MSG="Chamber IDLE"


#==============================================================================
# MANUAL MODE
#==============================================================================

[gcode_macro CHAMBER_MANUAL]
gcode:
    {% set speed = params.SPEED|default(0)|float %}

    SET_GCODE_VARIABLE MACRO=_CHAMBER_STATE VARIABLE=state VALUE=2
    SET_GCODE_VARIABLE MACRO=_CHAMBER_STATE VARIABLE=manual_speed VALUE={speed}

    SET_FAN_SPEED FAN=chamber_fan SPEED={speed}


#==============================================================================
# PURGE MODE
#==============================================================================

[gcode_macro CHAMBER_PURGE]
gcode:
    SET_GCODE_VARIABLE MACRO=_CHAMBER_STATE VARIABLE=state VALUE=3

    SET_FAN_SPEED FAN=chamber_fan SPEED=1.0

    UPDATE_DELAYED_GCODE ID=_CHAMBER_PURGE_STOP DURATION=600


[delayed_gcode _CHAMBER_PURGE_STOP]
gcode:
    SET_GCODE_VARIABLE MACRO=_CHAMBER_STATE VARIABLE=state VALUE=1
    SET_FAN_SPEED FAN=chamber_fan SPEED=0
    RESPOND MSG="Purge complete → AUTO"


#==============================================================================
# MAIN LOOP
#==============================================================================

[delayed_gcode _CHAMBER_LOOP]
gcode:

    {% set st = printer["gcode_macro _CHAMBER_STATE"] %}
    {% set temp = printer["temperature_sensor Chamber"].temperature|default(0) %}

    {% if st.active %}

        {% if st.state == 3 %}
            # PURGE owns fan

        {% elif st.state == 2 %}
            SET_FAN_SPEED FAN=chamber_fan SPEED={st.manual_speed}

        {% elif st.state == 1 %}

            {% set on = st.target_temp %}
            {% set off = st.target_temp - st.hysteresis %}

            {% if temp >= on %}
                SET_FAN_SPEED FAN=chamber_fan SPEED=1.0
            {% elif temp <= off %}
                SET_FAN_SPEED FAN=chamber_fan SPEED=0
            {% endif %}

        {% else %}
            SET_FAN_SPEED FAN=chamber_fan SPEED=0

        {% endif %}

        UPDATE_DELAYED_GCODE ID=_CHAMBER_LOOP DURATION=5

    {% endif %}





















































