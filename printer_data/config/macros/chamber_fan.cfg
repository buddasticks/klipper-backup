#==============================================================================
# Chamber Exhaust Control (UPDATED WITH PRINT MODE LOCK)
#==============================================================================



#==============================================================================
# Chamber Sensor
#==============================================================================

[temperature_sensor Chamber]
sensor_type: Generic 3950
sensor_pin: hexa:PA1
min_temp: -10
max_temp: 100



#==============================================================================
# Fan Hardware
#==============================================================================

[output_pin _chamber_fan_io6_enable]
pin: hexa:PB15
value: 1
shutdown_value: 0


[fan_generic chamber_fan]
pin: hexa:PA8
max_power: 0.50
shutdown_speed: 0.0
kick_start_time: 0.75
off_below: 0.15
cycle_time: 0.01



#==============================================================================
# CONFIG
#==============================================================================

[gcode_macro _CHAMBER_FAN_CONFIG]

variable_filament_temps: {
    'PLA':30,
    'TPU':30,
    'PETG':35,
    'ABS':55,
    'ASA':55,
    'PC':55,
    'PA':55,
    'NYLON':55
}

variable_fan_name: "chamber_fan"

variable_fan_speed_low: 0.40
variable_fan_speed_high: 1.00

variable_temp_hysteresis: 3.0
variable_loop_interval: 10
variable_warmup_delay: 300
variable_purge_time: 600

# NEW: PRINT MODE CONTROL
# 0 = IDLE (fan allowed)
# 1 = PRINTING (fan controlled by macro ONLY)
variable_print_mode: 0

variable_active: False
variable_target_temp: -1

gcode:



#==============================================================================
# PRINT START → LOCK CONTROL (NO EXTERNAL OVERRIDE)
#==============================================================================

[gcode_macro CHAMBER_FAN_START]
gcode:

    {% set filament = params.FILAMENT|default("PLA")|upper %}
    {% set cfg = printer["gcode_macro _CHAMBER_FAN_CONFIG"] %}
    {% set temps = cfg.filament_temps %}

    {% if filament in temps %}
        {% set target = temps[filament]|int %}
    {% else %}
        {% set target = -1 %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN_CONFIG VARIABLE=target_temp VALUE={target}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN_CONFIG VARIABLE=active VALUE=True

    # NEW: lock into PRINTING MODE
    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN_CONFIG VARIABLE=print_mode VALUE=1

    {% if target >= 0 %}
        RESPOND MSG="Chamber AUTO mode (PRINT LOCK) - {filament}"
        UPDATE_DELAYED_GCODE ID=_CHAMBER_FAN_LOOP DURATION={cfg.warmup_delay}
    {% endif %}



#==============================================================================
# PRINT END → UNLOCK CONTROL
#==============================================================================

[gcode_macro CHAMBER_FAN_STOP]
gcode:

    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN_CONFIG VARIABLE=active VALUE=False
    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN_CONFIG VARIABLE=target_temp VALUE=-1

    # NEW: unlock printing mode
    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN_CONFIG VARIABLE=print_mode VALUE=0

    UPDATE_DELAYED_GCODE ID=_CHAMBER_FAN_LOOP DURATION=0
    SET_FAN_SPEED FAN=chamber_fan SPEED=0

    RESPOND MSG="Chamber AUTO OFF"



#==============================================================================
# MANUAL OVERRIDE (ONLY WHEN NOT PRINTING)
#==============================================================================

[gcode_macro CHAMBER_FAN_ON]
gcode:

    {% set cfg = printer["gcode_macro _CHAMBER_FAN_CONFIG"] %}

    {% if cfg.print_mode == 1 %}
        RESPOND MSG="Blocked: chamber fan locked in PRINT mode"
    {% else %}
        SET_FAN_SPEED FAN=chamber_fan SPEED={params.SPEED|default(1.0)}
    {% endif %}



[gcode_macro CHAMBER_FAN_OFF]
gcode:
    SET_FAN_SPEED FAN=chamber_fan SPEED=0



#==============================================================================
# PURGE AFTER PRINT
#==============================================================================

[gcode_macro CHAMBER_PURGE]
gcode:

    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN_CONFIG VARIABLE=print_mode VALUE=0
    SET_FAN_SPEED FAN=chamber_fan SPEED=1.0

    UPDATE_DELAYED_GCODE ID=_CHAMBER_PURGE_STOP DURATION={printer["gcode_macro _CHAMBER_FAN_CONFIG"].purge_time}



[delayed_gcode _CHAMBER_PURGE_STOP]
gcode:
    SET_FAN_SPEED FAN=chamber_fan SPEED=0
    RESPOND MSG="Chamber purge done"



#==============================================================================
# CONTROL LOOP (ONLY ACTIVE DURING PRINT MODE)
#==============================================================================

[delayed_gcode _CHAMBER_FAN_LOOP]
gcode:

    {% set cfg = printer["gcode_macro _CHAMBER_FAN_CONFIG"] %}

    {% if cfg.active and cfg.target_temp >= 0 and cfg.print_mode == 1 %}

        {% set chamber = printer["temperature_sensor Chamber"].temperature %}
        {% set target = cfg.target_temp %}
        {% set hyst = cfg.temp_hysteresis %}

        {% if chamber > target %}
            SET_FAN_SPEED FAN={cfg.fan_name} SPEED={cfg.fan_speed_high}

        {% elif chamber > (target - hyst) %}
            SET_FAN_SPEED FAN={cfg.fan_name} SPEED={cfg.fan_speed_low}

        {% else %}
            SET_FAN_SPEED FAN={cfg.fan_name} SPEED=0
        {% endif %}

        UPDATE_DELAYED_GCODE ID=_CHAMBER_FAN_LOOP DURATION={cfg.loop_interval}

    {% endif %}


































































































