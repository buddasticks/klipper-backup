#==============================================================================
# CHAMBER MODULE (BLACK BOX CONTROLLER)
#==============================================================================

[temperature_sensor Chamber]
sensor_type: Generic 3950
sensor_pin: hexa:PA1
min_temp: -10
max_temp: 100


[fan_generic chamber_fan]
pin: hexa:PA8
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.75
off_below: 0.15
cycle_time: 0.01


#==============================================================================
# INTERNAL STATE
#==============================================================================

[gcode_macro CHAMBER_STATE]
variable_active: 0
variable_mode: 0          # 0 idle, 1 auto, 2 manual, 3 purge
variable_manual_speed: 0.0
variable_target_temp: 30
variable_hysteresis: 2
variable_last_filament: "PLA"
gcode:


#==============================================================================
# START
#==============================================================================

[gcode_macro CHAMBER_START]
gcode:

    {% set filament = params.FILAMENT|default("PLA")|upper %}

    {% set temps = {
        'PLA':30,
        'TPU':30,
        'PETG':35,
        'ABS':55,
        'ASA':55,
        'PC':55,
        'PA':55,
        'NYLON':55
    } %}

    {% set target = temps.get(filament, 30) %}

    SET_GCODE_VARIABLE MACRO=CHAMBER_STATE VARIABLE=active VALUE=1
    SET_GCODE_VARIABLE MACRO=CHAMBER_STATE VARIABLE=mode VALUE=1
    SET_GCODE_VARIABLE MACRO=CHAMBER_STATE VARIABLE=target_temp VALUE={target}
    SET_GCODE_VARIABLE MACRO=CHAMBER_STATE VARIABLE=last_filament VALUE="'{filament}'"

    RESPOND MSG="CHAMBER START ({filament}) target {target}"

    UPDATE_DELAYED_GCODE ID=CHAMBER_LOOP DURATION=2


#==============================================================================
# STOP (CLEAN EXIT)
#==============================================================================

[gcode_macro CHAMBER_STOP]
gcode:

    SET_GCODE_VARIABLE MACRO=CHAMBER_STATE VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=CHAMBER_STATE VARIABLE=mode VALUE=0

    SET_FAN_SPEED FAN=chamber_fan SPEED=0

    UPDATE_DELAYED_GCODE ID=CHAMBER_LOOP DURATION=0

    RESPOND MSG="CHAMBER STOPPED"


#==============================================================================
# PURGE (AUTONOMOUS)
#==============================================================================

[gcode_macro CHAMBER_PURGE]
gcode:

    SET_GCODE_VARIABLE MACRO=CHAMBER_STATE VARIABLE=mode VALUE=3

    SET_FAN_SPEED FAN=chamber_fan SPEED=1.0

    UPDATE_DELAYED_GCODE ID=CHAMBER_PURGE_TIMER DURATION=600

    RESPOND MSG="CHAMBER PURGE STARTED"


#==============================================================================
# PURGE TIMER END
#==============================================================================

[delayed_gcode CHAMBER_PURGE_TIMER]
gcode:

    SET_GCODE_VARIABLE MACRO=CHAMBER_STATE VARIABLE=mode VALUE=1
    SET_FAN_SPEED FAN=chamber_fan SPEED=0

    RESPOND MSG="CHAMBER PURGE COMPLETE → AUTO"


#==============================================================================
# MAIN LOOP (SELF-CONTAINED)
#==============================================================================

[delayed_gcode CHAMBER_LOOP]
gcode:

    {% set st = printer["gcode_macro CHAMBER_STATE"] %}
    {% set temp = printer["temperature_sensor Chamber"].temperature|default(0) %}

    {% if st.active == 1 %}

        {% if st.mode == 3 %}
            # purge owns fan

        {% elif st.mode == 2 %}
            SET_FAN_SPEED FAN=chamber_fan SPEED={st.manual_speed}

        {% elif st.mode == 1 %}

            {% if temp >= st.target_temp %}
                SET_FAN_SPEED FAN=chamber_fan SPEED=1.0
            {% elif temp <= st.target_temp - st.hysteresis %}
                SET_FAN_SPEED FAN=chamber_fan SPEED=0
            {% endif %}

        {% else %}
            SET_FAN_SPEED FAN=chamber_fan SPEED=0

        {% endif %}

        UPDATE_DELAYED_GCODE ID=CHAMBER_LOOP DURATION=5

    {% endif %}



[gcode_macro CHAMBER_RESET]
description: Reset chamber system to safe idle state before print
gcode:

  {% set st = printer["gcode_macro CHAMBER_STATE"] %}

  # ── Stop chamber loop cleanly ─────────────────────────────
  SET_GCODE_VARIABLE MACRO=CHAMBER_STATE VARIABLE=active VALUE=0
  SET_GCODE_VARIABLE MACRO=CHAMBER_STATE VARIABLE=mode VALUE=0
  SET_GCODE_VARIABLE MACRO=CHAMBER_STATE VARIABLE=manual_speed VALUE=0.0

  # ── Stop all fan activity ─────────────────────────────────
  SET_FAN_SPEED FAN=chamber_fan SPEED=0

  # ── Cancel any purge timer safely ─────────────────────────
  UPDATE_DELAYED_GCODE ID=CHAMBER_PURGE_TIMER DURATION=0

  # ── Optional safety reset message ─────────────────────────
  RESPOND MSG="CHAMBER: reset → idle state (fan off, purge cleared)"
















































