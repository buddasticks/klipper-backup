#==============================================================================
# Chamber Exhaust Control (EVENT-DRIVEN / NO POLLING CONFLICT)
#==============================================================================

#==============================================================================
# Chamber Sensor
#==============================================================================

[temperature_sensor Chamber]
sensor_type: Generic 3950
sensor_pin: hexa:PA1
min_temp: -10
max_temp: 100


#==============================================================================
# Fan Hardware
#==============================================================================

[output_pin _chamber_fan_io6_enable]
pin: hexa:PB15
value: 1
shutdown_value: 0


[fan_generic chamber_fan]
pin: hexa:PA8
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.75
off_below: 0.15
cycle_time: 0.01


#==============================================================================
# CONFIG
#==============================================================================

[gcode_macro _CHAMBER_FAN_CONFIG]

variable_filament_temps: {
    'PLA':30, 'TPU':30, 'PETG':35,
    'ABS':55, 'ASA':55,
    'PC':55, 'PA':55, 'NYLON':55
}

variable_voc_filaments: ['ABS','ASA','PC','PA','NYLON']

variable_fan_name: "chamber_fan"
variable_fan_speed: 1.0

variable_active: False
variable_target_temp: -1

# internal state
variable_manual_override: False


gcode:
    # config holder only


#==============================================================================
# FAN COMMAND INTERCEPT (THIS IS THE CORE)
#==============================================================================

[gcode_macro SET_FAN_SPEED]
rename_existing: SET_FAN_SPEED_BASE
gcode:

    {% set fan = params.FAN|default("") %}
    {% set speed = params.SPEED|float %}

    {% set cfg = printer["gcode_macro _CHAMBER_FAN_CONFIG"] %}

    # Always pass command through first (never break system)
    SET_FAN_SPEED_BASE FAN={fan} SPEED={speed}

    # Only react to chamber fan
    {% if fan == cfg.fan_name %}

        # If user manually changes fan, disable auto control
        SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN_CONFIG VARIABLE=manual_override VALUE=True

    {% endif %}


#==============================================================================
# START PRINT
#==============================================================================

[gcode_macro CHAMBER_FAN_START]
gcode:
    {% set filament = params.FILAMENT|default("PLA")|upper %}
    {% set cfg = printer["gcode_macro _CHAMBER_FAN_CONFIG"] %}

    {% set target = cfg.filament_temps.get(filament, -1) %}

    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN_CONFIG VARIABLE=target_temp VALUE={target}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN_CONFIG VARIABLE=active VALUE=True
    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN_CONFIG VARIABLE=manual_override VALUE=False

    RESPOND MSG="Chamber AUTO started for {filament}, target {target}C"

    UPDATE_DELAYED_GCODE ID=_CHAMBER_FAN_LOOP DURATION=2


#==============================================================================
# STOP PRINT
#==============================================================================

[gcode_macro CHAMBER_FAN_STOP]
gcode:
    {% set cfg = printer["gcode_macro _CHAMBER_FAN_CONFIG"] %}
    {% set filament = params.FILAMENT|default("PLA")|upper %}

    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN_CONFIG VARIABLE=active VALUE=False
    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN_CONFIG VARIABLE=target_temp VALUE=-1
    SET_GCODE_VARIABLE MACRO=_CHAMBER_FAN_CONFIG VARIABLE=manual_override VALUE=False

    SET_FAN_SPEED FAN=chamber_fan SPEED=0

    UPDATE_DELAYED_GCODE ID=_CHAMBER_FAN_LOOP DURATION=0

    RESPOND MSG="Chamber control stopped"

    {% if filament in cfg.voc_filaments %}
        RESPOND MSG="VOC filament detected → purge starting"
        UPDATE_DELAYED_GCODE ID=_CHAMBER_PURGE_START DURATION=1
    {% else %}
        RESPOND MSG="No VOC purge required"
    {% endif %}


#==============================================================================
# AUTO CONTROL LOOP (ONLY WHEN NOT MANUAL OVERRIDE)
#==============================================================================

[delayed_gcode _CHAMBER_FAN_LOOP]
gcode:

    {% set cfg = printer["gcode_macro _CHAMBER_FAN_CONFIG"] %}

    {% if cfg.active and cfg.target_temp > 0 and not cfg.manual_override %}

        {% set chamber = printer["temperature_sensor Chamber"].temperature | default(0) %}

        {% if chamber >= cfg.target_temp %}
            SET_FAN_SPEED FAN={cfg.fan_name} SPEED={cfg.fan_speed}
        {% else %}
            SET_FAN_SPEED FAN={cfg.fan_name} SPEED=0
        {% endif %}

        UPDATE_DELAYED_GCODE ID=_CHAMBER_FAN_LOOP DURATION=10

    {% elif cfg.active %}

        # still active but manual override is controlling it
        UPDATE_DELAYED_GCODE ID=_CHAMBER_FAN_LOOP DURATION=10

    {% endif %}


#==============================================================================
# VOC PURGE
#==============================================================================

[delayed_gcode _CHAMBER_PURGE_START]
gcode:
    SET_FAN_SPEED FAN=chamber_fan SPEED=1.0
    UPDATE_DELAYED_GCODE ID=_CHAMBER_PURGE_STOP DURATION=600


[delayed_gcode _CHAMBER_PURGE_STOP]
gcode:
    SET_FAN_SPEED FAN=chamber_fan SPEED=0
    RESPOND MSG="Chamber VOC purge complete"
























































