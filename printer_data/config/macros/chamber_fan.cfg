#==============================================================================
# SIMPLE CHAMBER CONTROLLER (CLEAN VERSION)
#==============================================================================
[temperature_sensor Chamber]
sensor_type: Generic 3950
sensor_pin: hexa:PA1
min_temp: -10
max_temp: 100

[fan_generic chamber_fan]
pin: hexa:PA8
max_power: 0.50
shutdown_speed: 0.0
kick_start_time: 0.45
off_below: 0.15
#cycle_time: 0.01

#==============================================================================
# STATE
#==============================================================================
[gcode_macro CHAMBER]
variable_enabled: 0
variable_mode: "auto"   # auto / manual / purge
variable_target: 30
variable_manual_speed: 0.0
gcode:

#==============================================================================
# START
#==============================================================================
[gcode_macro CHAMBER_START]
gcode:
    {% set filament = params.FILAMENT|default("PLA")|upper %}
    {% set temps = {
        'PLA':30,
        'TPU':30,
        'PETG':35,
        'ABS':40,
        'ASA':40,
        'PC':55,
        'PA':55,
        'NYLON':55
    } %}
    {% set target = temps.get(filament, 30) %}
    SET_GCODE_VARIABLE MACRO=CHAMBER VARIABLE=enabled VALUE=1
    SET_GCODE_VARIABLE MACRO=CHAMBER VARIABLE=mode VALUE="'auto'"
    SET_GCODE_VARIABLE MACRO=CHAMBER VARIABLE=target VALUE={target}
    UPDATE_DELAYED_GCODE ID=CHAMBER_LOOP DURATION=1
    RESPOND MSG="Chamber ON ({filament}) → {target}C"

#==============================================================================
# STOP
#==============================================================================
[gcode_macro CHAMBER_STOP]
gcode:
    SET_GCODE_VARIABLE MACRO=CHAMBER VARIABLE=enabled VALUE=0
    SET_FAN_SPEED FAN=chamber_fan SPEED=0
    UPDATE_DELAYED_GCODE ID=CHAMBER_LOOP DURATION=0
    RESPOND MSG="Chamber OFF"

#==============================================================================
# PURGE
#==============================================================================
[gcode_macro CHAMBER_PURGE]
gcode:
    SET_GCODE_VARIABLE MACRO=CHAMBER VARIABLE=mode VALUE="'purge'"
    SET_FAN_SPEED FAN=chamber_fan SPEED=1.0
    UPDATE_DELAYED_GCODE ID=CHAMBER_PURGE_END DURATION=600
    RESPOND MSG="Chamber PURGE started"

[delayed_gcode CHAMBER_PURGE_END]
gcode:
    {% set c = printer["gcode_macro CHAMBER"] %}
    SET_GCODE_VARIABLE MACRO=CHAMBER VARIABLE=mode VALUE="'auto'"
    # If chamber is disabled, kill fan immediately; loop won't rescue it
    {% if c.enabled == 0 %}
        SET_FAN_SPEED FAN=chamber_fan SPEED=0
    {% endif %}
    RESPOND MSG="Chamber PURGE ended → auto mode"

#==============================================================================
# MAIN LOOP (CORE CONTROL)
#==============================================================================
[delayed_gcode CHAMBER_LOOP]
gcode:
    {% set c = printer["gcode_macro CHAMBER"] %}
    {% set temp = printer["temperature_sensor Chamber"].temperature|default(0) %}
    {% if c.enabled == 1 %}
        {% if c.mode == "manual" %}
            SET_FAN_SPEED FAN=chamber_fan SPEED={c.manual_speed}
        {% elif c.mode == "auto" %}
            # Always set definitive speed — no dead zone where purge speed lingers
            {% if temp >= c.target %}
                SET_FAN_SPEED FAN=chamber_fan SPEED=1.0
            {% else %}
                SET_FAN_SPEED FAN=chamber_fan SPEED=0
            {% endif %}
        {% elif c.mode == "purge" %}
            # purge owns fan
        {% endif %}
        UPDATE_DELAYED_GCODE ID=CHAMBER_LOOP DURATION=5
    {% endif %}

#==============================================================================
# RESET
#==============================================================================
[gcode_macro CHAMBER_RESET]
gcode:
    SET_GCODE_VARIABLE MACRO=CHAMBER VARIABLE=enabled VALUE=0
    SET_GCODE_VARIABLE MACRO=CHAMBER VARIABLE=mode VALUE="'auto'"
    SET_GCODE_VARIABLE MACRO=CHAMBER VARIABLE=manual_speed VALUE=0.0
    SET_FAN_SPEED FAN=chamber_fan SPEED=0
    UPDATE_DELAYED_GCODE ID=CHAMBER_LOOP DURATION=0
    RESPOND MSG="Chamber reset → idle"











































