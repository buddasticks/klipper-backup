#==============================================================================
# Chamber Exhaust Control
#------------------------------------------------------------------------------
# Features
#   • Automatic chamber temperature control by filament
#   • Warm-up delay (prevents fighting chamber heat-up)
#   • Automatic exhaust while printing
#   • Post-print purge
#   • Manual fan control
#   • Single configuration section for all tuning
#
# Usage
#
#   PRINT_START:
#       CHAMBER_FAN_START FILAMENT=ABS
#
#   PRINT_END:
#       CHAMBER_FAN_STOP
#       CHAMBER_PURGE
#
# Manual:
#       CHAMBER_FAN_ON
#       CHAMBER_FAN_ON SPEED=0.5
#       CHAMBER_FAN_OFF
#       CHAMBER_PURGE
#
#==============================================================================



#==============================================================================
# Chamber Temperature Sensor
#==============================================================================

[temperature_sensor Chamber]
sensor_type: Generic 3950
sensor_pin: hexa:PA1
min_temp: -200
max_temp: 300



#==============================================================================
# Exhaust Fan Hardware
#==============================================================================

[output_pin _chamber_fan_io6_enable]
pin: hexa:PB15
value: 1
shutdown_value: 0


[fan_generic chamber_fan]
pin: hexa:PA8
max_power: 0.50
shutdown_speed: 0.0
kick_start_time: 0.75
off_below: 0.15
cycle_time: 0.01



#==============================================================================
# Configuration
#==============================================================================

[gcode_macro _CHAMBER_FAN_CONFIG]

#--------------------------------------------------------------------------
# Chamber targets
#
# Fan attempts to keep chamber BELOW these temperatures.
# Unknown materials disable automatic control.
#--------------------------------------------------------------------------

variable_filament_temps: {
    'PLA':30,
    'TPU':30,
    'PETG':35,
    'ABS':55,
    'ASA':55,
    'PC':55,
    'PA':55,
    'NYLON':55
}

#--------------------------------------------------------------------------
# Fan
#--------------------------------------------------------------------------

variable_fan_name: "chamber_fan"

variable_fan_speed_low: 0.40
variable_fan_speed_high: 1.00

# Degrees below target before fan turns completely off.
variable_temp_hysteresis: 3.0

# Seconds between control updates.
variable_loop_interval: 10

# Delay before automatic control starts.
# Prevents exhausting hot air while chamber is heating.
variable_warmup_delay: 300

# Purge duration after print (seconds)
variable_purge_time: 600

# Runtime variables
variable_active: False
variable_target_temp: -1

gcode:



#==============================================================================
# Start Automatic Control
#==============================================================================

[gcode_macro CHAMBER_FAN_START]
description: Enable automatic chamber exhaust

gcode:

    {% set filament = params.FILAMENT|default("PLA")|upper %}
    {% set cfg = printer["gcode_macro _CHAMBER_FAN_CONFIG"] %}
    {% set temps = cfg.filament_temps %}

    {% if filament in temps %}
        {% set target = temps[filament]|int %}
    {% else %}
        {% set target = -1 %}
    {% endif %}

    SET_GCODE_VARIABLE \
        MACRO=_CHAMBER_FAN_CONFIG \
        VARIABLE=target_temp \
        VALUE={target}

    SET_GCODE_VARIABLE \
        MACRO=_CHAMBER_FAN_CONFIG \
        VARIABLE=active \
        VALUE=True

    {% if target >= 0 %}

        RESPOND MSG="Chamber exhaust enabled ({filament}) Target < {target}°C"

        UPDATE_DELAYED_GCODE \
            ID=_CHAMBER_FAN_LOOP \
            DURATION={cfg.warmup_delay}

    {% else %}

        RESPOND MSG="Unknown filament '{filament}' - automatic chamber control disabled"

    {% endif %}



#==============================================================================
# Stop Automatic Control
#==============================================================================

[gcode_macro CHAMBER_FAN_STOP]
description: Disable chamber exhaust automation

gcode:

    SET_GCODE_VARIABLE \
        MACRO=_CHAMBER_FAN_CONFIG \
        VARIABLE=active \
        VALUE=False

    SET_GCODE_VARIABLE \
        MACRO=_CHAMBER_FAN_CONFIG \
        VARIABLE=target_temp \
        VALUE=-1

    UPDATE_DELAYED_GCODE \
        ID=_CHAMBER_FAN_LOOP \
        DURATION=0

    SET_FAN_SPEED FAN=chamber_fan SPEED=0

    RESPOND MSG="Chamber exhaust stopped"



#==============================================================================
# Manual Fan On
#==============================================================================

[gcode_macro CHAMBER_FAN_ON]
description: Turn chamber fan on manually

gcode:

    {% set speed=params.SPEED|default(1.0)|float %}

    UPDATE_DELAYED_GCODE ID=_CHAMBER_FAN_LOOP DURATION=0

    SET_GCODE_VARIABLE \
        MACRO=_CHAMBER_FAN_CONFIG \
        VARIABLE=active \
        VALUE=False

    SET_FAN_SPEED FAN=chamber_fan SPEED={speed}



#==============================================================================
# Manual Fan Off
#==============================================================================

[gcode_macro CHAMBER_FAN_OFF]
description: Turn chamber fan off

gcode:

    UPDATE_DELAYED_GCODE ID=_CHAMBER_FAN_LOOP DURATION=0

    SET_GCODE_VARIABLE \
        MACRO=_CHAMBER_FAN_CONFIG \
        VARIABLE=active \
        VALUE=False

    SET_FAN_SPEED FAN=chamber_fan SPEED=0



#==============================================================================
# Purge Chamber
#==============================================================================

[gcode_macro CHAMBER_PURGE]
description: Exhaust chamber for configured purge time

gcode:

    {% set cfg = printer["gcode_macro _CHAMBER_FAN_CONFIG"] %}

    UPDATE_DELAYED_GCODE ID=_CHAMBER_FAN_LOOP DURATION=0

    SET_GCODE_VARIABLE \
        MACRO=_CHAMBER_FAN_CONFIG \
        VARIABLE=active \
        VALUE=False

    SET_FAN_SPEED FAN={cfg.fan_name} SPEED=1.0

    RESPOND MSG="Purging chamber..."

    UPDATE_DELAYED_GCODE \
        ID=_CHAMBER_PURGE_STOP \
        DURATION={cfg.purge_time}



#==============================================================================
# Purge Stop
#==============================================================================

[delayed_gcode _CHAMBER_PURGE_STOP]

gcode:

    SET_FAN_SPEED FAN=chamber_fan SPEED=0

    RESPOND MSG="Chamber purge complete"



#==============================================================================
# Automatic Control Loop
#==============================================================================

[delayed_gcode _CHAMBER_FAN_LOOP]

gcode:

    {% set cfg = printer["gcode_macro _CHAMBER_FAN_CONFIG"] %}

    {% if cfg.active and cfg.target_temp >= 0 %}

        {% if printer["temperature_sensor Chamber"] is defined %}

            {% set chamber = printer["temperature_sensor Chamber"].temperature %}
            {% set target = cfg.target_temp|float %}
            {% set hyst = cfg.temp_hysteresis|float %}

            {% if chamber > target %}

                SET_FAN_SPEED FAN={cfg.fan_name} SPEED={cfg.fan_speed_high}

            {% elif chamber > (target - hyst) %}

                SET_FAN_SPEED FAN={cfg.fan_name} SPEED={cfg.fan_speed_low}

            {% else %}

                SET_FAN_SPEED FAN={cfg.fan_name} SPEED=0

            {% endif %}

        {% else %}

            # Fail safe
            SET_FAN_SPEED FAN={cfg.fan_name} SPEED=1.0

        {% endif %}

        UPDATE_DELAYED_GCODE \
            ID=_CHAMBER_FAN_LOOP \
            DURATION={cfg.loop_interval}

    {% endif %}


































































































