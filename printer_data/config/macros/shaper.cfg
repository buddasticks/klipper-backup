################################################################################
# SHAKE&TUNE CONFIGURATION FOR TOOLCHANGER
# Complete configuration for per-tool input shaper calibration
# T0: ADXL345
# T1: ADXL345
# T2: ADXL345
# T3: ADXL345
################################################################################

################################################################################
# SHAKE&TUNE BASE CONFIGURATION
################################################################################

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep: 5
keep_raw_data: False
show_macros_in_webui: True
timeout: 600
measurements_chunk_size: 2


################################################################################
# HELPER MACRO - GET ACCELEROMETER CHIP NAME
################################################################################

[gcode_macro _GET_ACCEL_CHIP]
description: Internal helper to get correct accelerometer chip name for tool
gcode:
    {% set tool_num = params.TOOL_NUM|int %}
    {% if tool_num == 0 %}
        {% set chip_name = "adxl345 tool0" %}
    {% elif tool_num == 1 %}
        {% set chip_name = "adxl345 tool1" %}
    {% elif tool_num == 2 %}
        {% set chip_name = "adxl345 tool2" %}
    {% elif tool_num == 3 %}
        {% set chip_name = "adxl345 tool3" %}
    {% else %}
        {action_raise_error("Invalid tool number: " ~ tool_num ~ ". Only T0–T3 are configured.")}
    {% endif %}
    RESPOND MSG="Using accelerometer: {chip_name}"


################################################################################
# PER-TOOL CALIBRATION MACROS
################################################################################

[gcode_macro AXES_SHAPER_CALIBRATIONS_CURRENT_TOOL]
description: Run Shake&Tune axes shaper calibration for current tool
gcode:
    {% set current_tool = printer.toolchanger.tool %}
    {% set freq_start = params.FREQ_START|default(5)|float %}
    {% set freq_end = params.FREQ_END|default(133)|float %}
    {% set hz_per_sec = params.HZ_PER_SEC|default(1)|float %}
    
    {% if current_tool is none or current_tool == -1 or current_tool == "" %}
        {action_raise_error("No tool selected! Please select a tool first (T0–T3)")}
    {% else %}
        {% set tool_num = current_tool.split()[-1][1:]|int %}
        
        {% if tool_num == 0 %}
            {% set accel_chip = "adxl345 tool0" %}
        {% elif tool_num == 1 %}
            {% set accel_chip = "adxl345 tool1" %}
        {% elif tool_num == 2 %}
            {% set accel_chip = "adxl345 tool2" %}
        {% elif tool_num == 3 %}
            {% set accel_chip = "adxl345 tool3" %}
        {% else %}
            {action_raise_error("Invalid tool number: " ~ tool_num ~ ". Only T0–T3 are configured.")}
        {% endif %}
        
        RESPOND MSG="=========================================="
        RESPOND MSG="Running Shake&Tune axes shaper calibration"
        RESPOND MSG="Tool: T{tool_num}"
        RESPOND MSG="Accelerometer: {accel_chip}"
        RESPOND MSG="Frequency range: {freq_start} - {freq_end} Hz"
        RESPOND MSG="=========================================="
        
        AXES_SHAPER_CALIBRATION ACCEL_CHIP="'{accel_chip}'" FREQ_START={freq_start} FREQ_END={freq_end} HZ_PER_SEC={hz_per_sec}
        
        RESPOND MSG="=========================================="
        RESPOND MSG="Calibration complete for T{tool_num}!"
        RESPOND MSG="Check ~/printer_data/config/ShakeTune_results"
        RESPOND MSG="Update T{tool_num} input shaper values"
        RESPOND MSG="=========================================="
    {% endif %}


################################################################################
# AXES MAP CALIBRATION CURRENT TOOL
################################################################################

[gcode_macro AXES_MAP_CALIBRATION_CURRENT_TOOL]
description: Run Shake&Tune axes map calibration for current tool
gcode:
    {% set current_tool = printer.toolchanger.tool %}
    {% set accel = params.ACCEL|default(1500)|int %}
    {% set speed = params.SPEED|default(80)|int %}
    
    {% if current_tool is none or current_tool == -1 or current_tool == "" %}
        {action_raise_error("No tool selected! Please select a tool first (T0–T3)")}
    {% else %}
        {% set tool_num = current_tool.split()[-1][1:]|int %}
        
        {% if tool_num == 0 %}
            {% set accel_chip = "adxl345 tool0" %}
        {% elif tool_num == 1 %}
            {% set accel_chip = "adxl345 tool1" %}
        {% elif tool_num == 2 %}
            {% set accel_chip = "adxl345 tool2" %}
        {% elif tool_num == 3 %}
            {% set accel_chip = "adxl345 tool3" %}
        {% else %}
            {action_raise_error("Invalid tool number: " ~ tool_num ~ ". Only T0–T3 are configured.")}
        {% endif %}
        
        RESPOND MSG="=========================================="
        RESPOND MSG="Running axes map calibration for T{tool_num}"
        RESPOND MSG="Expected chip: {accel_chip}"
        RESPOND MSG=""
        RESPOND MSG="Update [resonance_tester] accel_chip manually if needed"
        RESPOND MSG="=========================================="
        
        AXES_MAP_CALIBRATION ACCEL={accel} SPEED={speed}
        
        RESPOND MSG="=========================================="
        RESPOND MSG="Axes map complete for T{tool_num}"
        RESPOND MSG="=========================================="
    {% endif %}


################################################################################
# CREATE VIBRATION PROFILE CURRENT TOOL
################################################################################

[gcode_macro CREATE_VIBRATIONS_PROFILE_CURRENT_TOOL]
description: Run vibrations profile for current tool
gcode:
    {% set current_tool = printer.toolchanger.tool %}
    {% set size = params.SIZE|default(60)|int %}
    {% set speed_increment = params.SPEED_INCREMENT|default(2)|float %}
    
    {% if current_tool is none or current_tool == -1 or current_tool == "" %}
        {action_raise_error("No tool selected! Please select a tool first (T0–T3)")}
    {% else %}
        {% set tool_num = current_tool.split()[-1][1:]|int %}
        
        {% if tool_num == 0 %}
            {% set accel_chip = "adxl345 tool0" %}
        {% elif tool_num == 1 %}
            {% set accel_chip = "adxl345 tool1" %}
        {% elif tool_num == 2 %}
            {% set accel_chip = "adxl345 tool2" %}
        {% elif tool_num == 3 %}
            {% set accel_chip = "adxl345 tool3" %}
        {% else %}
            {action_raise_error("Invalid tool number: " ~ tool_num ~ ". Only T0–T3 are configured.")}
        {% endif %}
        
        RESPOND MSG="=========================================="
        RESPOND MSG="Creating vibrations profile for T{tool_num}"
        RESPOND MSG="=========================================="
        
        CREATE_VIBRATIONS_PROFILE ACCEL_CHIP="'{accel_chip}'" SIZE={size} SPEED_INCREMENT={speed_increment}
        
        RESPOND MSG="Vibrations profile complete for T{tool_num}"
        RESPOND MSG="=========================================="
    {% endif %}


################################################################################
# COMPARE BELT RESPONSES CURRENT TOOL
################################################################################

[gcode_macro COMPARE_BELTS_RESPONSES_CURRENT_TOOL]
description: Compare belt responses for current tool
gcode:
    {% set current_tool = printer.toolchanger.tool %}
    {% set freq_start = params.FREQ_START|default(5)|float %}
    {% set freq_end = params.FREQ_END|default(133.33)|float %}
    {% set hz_per_sec = params.HZ_PER_SEC|default(1)|float %}
    
    {% if current_tool is none or current_tool == -1 or current_tool == "" %}
        {action_raise_error("No tool selected! Please select a tool first (T0–T3)")}
    {% else %}
        {% set tool_num = current_tool.split()[-1][1:]|int %}
        
        {% if tool_num == 0 %}
            {% set accel_chip = "adxl345 tool0" %}
        {% elif tool_num == 1 %}
            {% set accel_chip = "adxl345 tool1" %}
        {% elif tool_num == 2 %}
            {% set accel_chip = "adxl345 tool2" %}
        {% elif tool_num == 3 %}
            {% set accel_chip = "adxl345 tool3" %}
        {% else %}
            {action_raise_error("Invalid tool number: " ~ tool_num ~ ". Only T0–T3 are configured.")}
        {% endif %}
        
        RESPOND MSG="=========================================="
        RESPOND MSG="Comparing belt responses for T{tool_num}"
        RESPOND MSG="=========================================="
        
        COMPARE_BELTS_RESPONSES ACCEL_CHIP="'{accel_chip}'" FREQ_START={freq_start} FREQ_END={freq_end} HZ_PER_SEC={hz_per_sec}
        
        RESPOND MSG="Belt comparison complete for T{tool_num}"
        RESPOND MSG="=========================================="
    {% endif %}


################################################################################
# CALIBRATE ALL TOOLS SHAKE&TUNE
################################################################################

[gcode_macro CALIBRATE_ALL_TOOLS_SHAKETUNE]
description: Run full Shake&Tune calibration for all tools
gcode:
    {% set calibration = params.CALIBRATION|default("axes")|lower %}
    
    RESPOND MSG="=========================================="
    RESPOND MSG="Shake&Tune Full Calibration (T0–T3)"
    RESPOND MSG="=========================================="
    
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    
    # TOOL 0
    RESPOND MSG="=== Tool 0 ==="
    T0
    G4 P2000
    {% if calibration == "axes" %}
        AXES_SHAPER_CALIBRATION ACCEL_CHIP="'adxl345 tool0'"
    {% elif calibration == "belts" %}
        COMPARE_BELTS_RESPONSES ACCEL_CHIP="'adxl345 tool0'"
    {% elif calibration == "vibrations" %}
        CREATE_VIBRATIONS_PROFILE ACCEL_CHIP="'adxl345 tool0'"
    {% endif %}
    
    # TOOL 1
    RESPOND MSG="=== Tool 1 ==="
    T1
    G4 P2000
    {% if calibration == "axes" %}
        AXES_SHAPER_CALIBRATION ACCEL_CHIP="'adxl345 tool1'"
    {% elif calibration == "belts" %}
        COMPARE_BELTS_RESPONSES ACCEL_CHIP="'adxl345 tool1'"
    {% elif calibration == "vibrations" %}
        CREATE_VIBRATIONS_PROFILE ACCEL_CHIP="'adxl345 tool1'"
    {% endif %}
    
    # TOOL 2
    RESPOND MSG="=== Tool 2 ==="
    T2
    G4 P2000
    {% if calibration == "axes" %}
        AXES_SHAPER_CALIBRATION ACCEL_CHIP="'adxl345 tool2'"
    {% elif calibration == "belts" %}
        COMPARE_BELTS_RESPONSES ACCEL_CHIP="'adxl345 tool2'"
    {% elif calibration == "vibrations" %}
        CREATE_VIBRATIONS_PROFILE ACCEL_CHIP="'adxl345 tool2'"
    {% endif %}
    
    # TOOL 3
    RESPOND MSG="=== Tool 3 ==="
    T3
    G4 P2000
    {% if calibration == "axes" %}
        AXES_SHAPER_CALIBRATION ACCEL_CHIP="'adxl345 tool3'"
    {% elif calibration == "belts" %}
        COMPARE_BELTS_RESPONSES ACCEL_CHIP="'adxl345 tool3'"
    {% elif calibration == "vibrations" %}
        CREATE_VIBRATIONS_PROFILE ACCEL_CHIP="'adxl345 tool3'"
    {% endif %}
    
    RESPOND MSG="=========================================="
    RESPOND MSG="ALL TOOLS COMPLETE (T0–T3)"
    RESPOND MSG="=========================================="

    

    
