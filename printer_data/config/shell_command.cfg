[gcode_shell_command hello_world]
command: echo hello world
timeout: 2.
verbose: True
[gcode_macro HELLO_WORLD]
gcode:
    RUN_SHELL_COMMAND CMD=hello_world


[gcode_shell_command backup_klipper]
command: bash -c 'cd /home/biqu/klipper-backup && bash script.sh 2>&1'
timeout: 30.
verbose: True

[gcode_macro BACKUP_NOW]
description: Force a manual backup of all Klipper config files to GitHub
gcode:
    M118 Starting Klipper-Backup...
    RUN_SHELL_COMMAND CMD=backup_klipper
    M118 Backup complete! Check GitHub for results.






# ============================================================
# KlipperScreen Branch Switcher
# ============================================================


[gcode_shell_command klipperscreen_offset]
command: bash -c 'cd ~/KlipperScreen && git fetch origin && git checkout offset && git reset --hard origin/offset && sudo systemctl restart KlipperScreen && sudo systemctl restart moonraker'
timeout: 120.
verbose: True


[gcode_macro KLIPPERSCREEN_OFFSET]
description: Switch KlipperScreen to toolchanger offset branch
gcode:
    M118 Switching KlipperScreen to OFFSET...
    RUN_SHELL_COMMAND CMD=klipperscreen_offset
    M118 KlipperScreen OFFSET loaded


[gcode_shell_command klipperscreen_master]
command: bash -c 'cd ~/KlipperScreen && git fetch origin && git checkout master && git reset --hard origin/master && sudo systemctl restart KlipperScreen && sudo systemctl restart moonraker'
timeout: 120.
verbose: True


[gcode_macro KLIPPERSCREEN_MASTER]
description: Switch KlipperScreen back to master branch
gcode:
    M118 Switching KlipperScreen to MASTER...
    RUN_SHELL_COMMAND CMD=klipperscreen_master
    M118 KlipperScreen MASTER loaded