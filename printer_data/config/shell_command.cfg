[gcode_shell_command hello_world]
command: echo hello world
timeout: 2.
verbose: True
[gcode_macro HELLO_WORLD]
gcode:
    RUN_SHELL_COMMAND CMD=hello_world


[gcode_shell_command backup_klipper]
command: bash -c 'cd /home/biqu/klipper-backup && bash script.sh 2>&1'
timeout: 30.
verbose: True

[gcode_macro BACKUP_NOW]
description: Force a manual backup of all Klipper config files to GitHub
gcode:
    M118 Starting Klipper-Backup...
    RUN_SHELL_COMMAND CMD=backup_klipper
    M118 Backup complete! Check GitHub for results.






# ============================================================
# KlipperScreen Git Branch Management
# Offset <-> Master switching
# ============================================================


# ------------------------------------------------------------
# Switch KlipperScreen to OFFSET branch
# ------------------------------------------------------------

[gcode_shell_command klipperscreen_offset]
command: bash -c 'cd ~/KlipperScreen && git fetch origin && git checkout offset && git pull --ff-only && sudo systemctl restart KlipperScreen && sudo systemctl restart moonraker'
timeout: 120.
verbose: True


[gcode_macro KLIPPERSCREEN_OFFSET]
description: Switch KlipperScreen to offset branch (toolchanger)
gcode:
    M118 Switching KlipperScreen to OFFSET branch...
    RUN_SHELL_COMMAND CMD=klipperscreen_offset
    M118 KlipperScreen OFFSET branch active


# ------------------------------------------------------------
# Switch KlipperScreen to MASTER branch
# ------------------------------------------------------------

[gcode_shell_command klipperscreen_master]
command: bash -c 'cd ~/KlipperScreen && git fetch origin && git checkout master && git pull --ff-only && sudo systemctl restart KlipperScreen && sudo systemctl restart moonraker'
timeout: 120.
verbose: True


[gcode_macro KLIPPERSCREEN_MASTER]
description: Switch KlipperScreen to master branch
gcode:
    M118 Switching KlipperScreen to MASTER branch...
    RUN_SHELL_COMMAND CMD=klipperscreen_master
    M118 KlipperScreen MASTER branch active


# ------------------------------------------------------------
# Show current branch and git status
# ------------------------------------------------------------

[gcode_shell_command klipperscreen_status]
command: bash -c 'cd ~/KlipperScreen && echo Branch: $(git branch --show-current) && git status -sb'
timeout: 10.
verbose: True


[gcode_macro KLIPPERSCREEN_STATUS]
description: Show current KlipperScreen git branch
gcode:
    M118 Checking KlipperScreen branch...
    RUN_SHELL_COMMAND CMD=klipperscreen_status


# ------------------------------------------------------------
# Restart KlipperScreen only
# ------------------------------------------------------------

[gcode_shell_command restart_klipperscreen]
command: sudo systemctl restart KlipperScreen
timeout: 20.
verbose: True


[gcode_macro RESTART_KLIPPERSCREEN]
description: Restart KlipperScreen service
gcode:
    M118 Restarting KlipperScreen...
    RUN_SHELL_COMMAND CMD=restart_klipperscreen
    M118 KlipperScreen restarted


# ------------------------------------------------------------
# Update current branch only
# ------------------------------------------------------------

[gcode_shell_command update_klipperscreen]
command: bash -c 'cd ~/KlipperScreen && git fetch origin && git pull --ff-only'
timeout: 120.
verbose: True


[gcode_macro UPDATE_KLIPPERSCREEN]
description: Update current KlipperScreen branch
gcode:
    M118 Updating current KlipperScreen branch...
    RUN_SHELL_COMMAND CMD=update_klipperscreen
    M118 KlipperScreen update complete