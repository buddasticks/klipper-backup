[gcode_shell_command hello_world]
command: echo hello world
timeout: 2.
verbose: True
[gcode_macro HELLO_WORLD]
gcode:
    RUN_SHELL_COMMAND CMD=hello_world


[gcode_shell_command backup_klipper]
command: bash -c 'cd /home/biqu/klipper-backup && bash script.sh 2>&1'
timeout: 30.
verbose: True

[gcode_macro BACKUP_NOW]
description: Force a manual backup of all Klipper config files to GitHub
gcode:
    M118 Starting Klipper-Backup...
    RUN_SHELL_COMMAND CMD=backup_klipper
    M118 Backup complete! Check GitHub for results.