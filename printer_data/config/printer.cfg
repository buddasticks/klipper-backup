
# INCLUDE FILES
################################################################################
# These files contain additional configuration components that are loaded
# into the main configuration. Keeping them separate improves organization
# and maintainability.

[include hexa.cfg]
[include mainsail.cfg]              # Mainsail web interface configuration
[include shell_command.cfg]
#[include timelapse.cfg]             # Timelapse plugin - REQUIRES PLUGIN INSTALLATION
#[include lcd/*.cfg]         # LCD display configuration files
[include barf_leds.cfg]

#  Toolchanger System Configuration
[include toolchanger/readonly-configs/toolchanger-include.cfg]
[include pause_resume.cfg]
[include macros/*.cfg]              # Custom G-code macros



################################################################################
# MICROCONTROLLER CONFIGURATION
################################################################################
# MCU settings define communication with the printer's control board.
# The serial ID is unique to each board and ensures correct connection.

[mcu]
# Main controller board connection
# Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_36FFDD054755303914542557-if00
restart_method: command             # Method used to restart the MCU


################################################################################
# VIRTUAL SD CARD
################################################################################
# Enables G-code file management through the web interface

# [virtual_sdcard]
# path: ~/printer_data/gcodes         # Path where G-code files are stored
# on_error_gcode: CANCEL_PRINT        # Macro to run if an error occurs during printing

[display_status]

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: _VIRTUAL_SDCARD_ON_ERROR

[gcode_macro _VIRTUAL_SDCARD_ON_ERROR]
gcode:
    # Do nothing - toolchange error handler manages recovery


###############################################################################
#VARIABLE STORAGE
###############################################################################
#Persistent storage for variables across restarts
[save_variables]
filename = ~/printer_data/config/saved_variables.cfg


################################################################################
# PRINT CONTROL FEATURES
################################################################################

# Pause/Resume functionality
[pause_resume]

# Object exclusion (skip failed objects during print)
[exclude_object]

################################################################################
# PRINTER KINEMATICS & MOTION SETTINGS
################################################################################
# Core motion parameters that define how the printer moves and accelerates.
# These settings significantly impact print quality and speed.

[printer]
kinematics: corexy                  # CoreXY motion system (X and Y motors work together)
max_velocity: 350 #500                   # Maximum travel speed in mm/s
max_accel: 8000 #10000                    # Maximum acceleration in mm/s² (high performance setting)
minimum_cruise_ratio: 0.50      # Minimum ratio of cruising speed vs max speed
max_z_velocity: 50 #30                 # Maximum Z-axis speed in mm/s
max_z_accel: 200 #500                   # Maximum Z-axis acceleration in mm/s²
square_corner_velocity: 5       # Speed for cornering maneuvers (mm/s)

#####################################################################
