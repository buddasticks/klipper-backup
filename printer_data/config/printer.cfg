################################################################################
#X-AXIS STEPPER MOTOR CONFIGURATION
################################################################################
#X-axis motor controls horizontal movement (right side in CoreXY system)
[stepper_x]
step_pin: PE2                       # Pin for step signal
dir_pin: !PE0                       # Pin for direction signal (! inverts direction)
enable_pin: !PE3                    # Pin to enable/disable motor (! means active low)
rotation_distance: 40               # Distance traveled per full rotation (mm) - typically belt pitch × teeth
microsteps: 16                      # Microstepping resolution (smoother motion)
full_steps_per_rotation: 200        # Steps per revolution (1.8° stepper = 200 steps)
endstop_pin: tmc2209_stepper_x: virtual_endstop  # Using sensorless homing via TMC driver
position_min: 0                     # Minimum X position (mm)
position_endstop: 350               # X home position (mm) - corrected from 355
position_max: 350                   # Maximum X travel distance (mm) - match endstop
homing_speed:  50                   # Speed during homing operation (mm/s)
homing_retract_dist: 0              # No retract for sensorless homing
homing_positive_dir: True           # Home toward maximum position

# X-axis TMC2209 Stepper Driver Configuration
[tmc2209 stepper_x]
uart_pin: PE1                       # UART communication pin
interpolate: True                   # Enable 256 microstep interpolation for smoother motion
run_current: 1.1                    # Motor current during movement (Amps)
#hold_current: 1.2                  # Current when motor is holding position (deprecated)
sense_resistor: 0.150               # Current sense resistor value (Ohms)
#stealthchop_threshold: 0           # Velocity threshold for StealthChop (commented out for autotune)
uart_address: 3                     # UART address for multi-driver communication
#driver_sgthrs: 70                  # StallGuard threshold for sensorless homing (commented out for autotune)
diag_pin: PE15                      # Diagnostic pin for StallGuard detection

################################################################################
# Y-AXIS STEPPER MOTOR CONFIGURATION
################################################################################
# Y-axis motor controls horizontal movement (left side in CoreXY system)
[stepper_y]
step_pin: PB8                       # Pin for step signal
dir_pin: !PB6                       # Pin for direction signal (! inverts direction)
enable_pin: !PB9                    # Pin to enable/disable motor
rotation_distance: 40               # Distance traveled per full rotation (mm)
microsteps: 16                      # Microstepping resolution
full_steps_per_rotation: 200        # Steps per revolution
endstop_pin: tmc2209_stepper_y: virtual_endstop  # Sensorless homing via TMC driver
position_min: -10                     # Minimum Y position (mm)
position_endstop: 358               # Y home position (mm) - corrected from 364 (~6mm sensorless offset)
position_max: 358                   # Maximum Y travel distance (mm) - match endstop
homing_speed: 50                    # Speed during homing operation (mm/s)
homing_retract_dist: 0              # No retract for sensorless homing
homing_positive_dir: true           # Home toward maximum position

# Y-axis TMC2209 Stepper Driver Configuration
[tmc2209 stepper_y]
uart_pin: PB7                       # UART communication pin
interpolate: True                   # Enable 256 microstep interpolation
run_current: 1.1                    # Motor current during movement (Amps)
#hold_current: 1.2                  # Current when holding (deprecated)
sense_resistor: 0.150               # Current sense resistor value (Ohms)
#stealthchop_threshold: 0           # Commented out for autotune
uart_address: 3                     # UART address
#driver_sgthrs: 70                  # StallGuard threshold (commented out for autotune)
diag_pin: PE13                      # Diagnostic pin for StallGuard detection


################################################################################
# Z-AXIS STEPPER MOTOR CONFIGURATION (4 MOTORS - QUAD GANTRY)
################################################################################
# Z-axis uses 4 independent motors for quad gantry leveling system.
# This ensures the gantry remains level even with uneven loads.


[stepper_z]
step_pin: PC0                       # Pin for step signal
dir_pin: PE5                        # Pin for direction signal
enable_pin: !PC1                    # Pin to enable/disable motor
rotation_distance: 40               # Distance per full rotation (mm)
gear_ratio: 80:12                   # Gear reduction ratio (improves resolution and torque)
microsteps: 16                      # Microstepping resolution
endstop_pin: probe:z_virtual_endstop  # Use probe for Z homing (auto bed leveling)
position_max: 347                   # Maximum Z height (mm)
position_min: -3                    # Minimum Z position - allows going below 0 for adjustments
#position_endstop: 0                # Not used with probe-based homing
homing_speed: 10                    # Initial homing speed (mm/s)
homing_retract_dist: 0             # Distance to retract after initial trigger (mm)
homing_retract_speed: 15            # Speed during retract move (mm/s)
second_homing_speed: 3              # Slower second homing pass for accuracy (mm/s)


# Primary Z Motor Driver Configuration
[tmc2209 stepper_z]
uart_pin: PE6                       # UART communication pin
interpolate: true                   # Enable 256 microstep interpolation
run_current: 0.75                    # Motor current during movement (Amps)
#hold_current: 0.58                 # Current when holding (deprecated)
sense_resistor: 0.150               # Current sense resistor value (Ohms)
#stealthchop_threshold: 0           # Commented out for autotune
uart_address: 3                     # UART address

# Second Z Motor (Z1 on motherboard)
[stepper_z1]
step_pin: PD3                       # Pin for step signal
dir_pin: !PD1                       # Pin for direction signal (! inverts)
enable_pin: !PD4                    # Pin to enable/disable motor
rotation_distance: 40               # Distance per full rotation (mm)
gear_ratio: 80:12                   # Gear reduction ratio
microsteps: 16                      # Microstepping resolution

# Second Z Motor Driver Configuration
[tmc2209 stepper_z1]
uart_pin: PD2                       # UART communication pin
interpolate: true                   # Enable 256 microstep interpolation
run_current: 0.75                    # Motor current during movement (Amps)
#hold_current: 0.58                 # Current when holding (deprecated)
sense_resistor: 0.150               # Current sense resistor value (Ohms)
#stealthchop_threshold: 0           # Commented out for autotune
uart_address: 3                     # UART address

# Third Z Motor (Z2 on motherboard)
[stepper_z2]
step_pin: PD7                       # Pin for step signal
dir_pin: PD5                        # Pin for direction signal
enable_pin: !PB5                    # Pin to enable/disable motor
rotation_distance: 40               # Distance per full rotation (mm)
gear_ratio: 80:12                   # Gear reduction ratio
microsteps: 16                      # Microstepping resolution

# Third Z Motor Driver Configuration
[tmc2209 stepper_z2]
uart_pin: PD6                       # UART communication pin
interpolate: true                   # Enable 256 microstep interpolation
run_current: 0.75                    # Motor current during movement (Amps)
#hold_current: 0.58                 # Current when holding (deprecated)
sense_resistor: 0.150               # Current sense resistor value (Ohms)
#stealthchop_threshold: 0           # Commented out for autotune
uart_address: 3                     # UART address

# Fourth Z Motor (Z4 on motherboard)
[stepper_z3]
step_pin: PD11                      # Pin for step signal
dir_pin: !PD9                       # Pin for direction signal (! inverts)
enable_pin: !PD12                   # Pin to enable/disable motor
rotation_distance: 40               # Distance per full rotation (mm)
gear_ratio: 80:12                   # Gear reduction ratio
microsteps: 16                      # Microstepping resolution

# Fourth Z Motor Driver Configuration
[tmc2209 stepper_z3]
uart_pin: PD10                      # UART communication pin
interpolate: true                   # Enable 256 microstep interpolation
run_current: 0.75                    # Motor current during movement (Amps)
#hold_current: 0.58                 # Current when holding (deprecated)
sense_resistor: 0.150               # Current sense resistor value (Ohms)
uart_address: 3                     # UART address
#stealthchop_threshold: 0           # Commented out for autotune

################################################################################
# HEATED BED CONFIGURATION
################################################################################
# Heated bed configuration with custom thermistor calibration

# # Custom Thermistor Definition for Heated Bed
# [thermistor my_thermistor]
# temperature1:25                     # First calibration point: 25°C
# resistance1:100000                  # Resistance at 25°C (Ohms)
# temperature2:50                     # Second calibration point: 50°C
# resistance2:18085.4                 # Resistance at 50°C (Ohms)
# temperature3:100                    # Third calibration point: 100°C
# resistance3:5362.6                  # Resistance at 100°C (Ohms)

# Heated Bed Configuration
[heater_bed]
heater_pin: PA0                     # Bed heater control pin (SSR or MOSFET)
sensor_type: NTC 100K MGB18-104F39050L32       # my_thermistor     
sensor_pin: PC5                     # Temperature sensor pin
max_power: 1.0                      # Maximum heater power (0.0-1.0)
min_temp: 5                         # Minimum safe temperature (°C)
max_temp: 130         # Maximum safe temperature (°C)
#control : pid                       # PID temperature control
#pid_kp : 73.065                     # PID proportional value
#pid_ki : 2.591                      # PID integral value
#pid_kd : 515.107                    # PID derivative value

# Heated Bed Safety Verification
[verify_heater heater_bed]
max_error: 120                      # Maximum temperature error before shutdown (°C)
check_gain_time:40                  # Time window to check heating progress (seconds)
hysteresis: 5                       # Temperature hysteresis (°C)
heating_gain: 2                     # Minimum temperature gain required (°C)

################################################################################
# FIRMWARE RETRACTION
################################################################################
# Firmware-controlled retraction settings for reducing stringing and oozing

[firmware_retraction]
#Per tool setting in t#.cfg

################################################################################
# MCU COOLING FAN (CONTROLLER FAN)
################################################################################
# Temperature-controlled fan for motherboard cooling
# Runs continuously with PID control based on host temperature

[temperature_fan CB1_fan]
pin: PA1                            # Fan control pin
kick_start_time: 0.5                # Time to run at full speed on startup (seconds)
max_power: 1.0                      # Maximum fan power (0.0-1.0)
min_temp: 0                         # Minimum temperature (°C)
max_temp: 90                        # Maximum temperature (°C)
hardware_pwm: true                  # Use hardware PWM for smoother control
target_temp: 50                     # Target temperature to maintain (°C)
sensor_type: temperature_host       # Use Raspberry Pi temperature as reference
max_speed: 1.0                     # Maximum fan speed (0.0-1.0)
min_speed: 0.0                     # Minimum fan speed when running (0.0-1.0)
control: pid                        # PID temperature control
pid_Kp: 2.0                         # PID proportional value
pid_Ki: 5.0                         # PID integral value
pid_Kd: 0.5                         # PID derivative value
pid_deriv_time: 2.0                 # Derivative time constant


################################################################################
# TEMPERATURE SENSORS
################################################################################
# Additional temperature monitoring sensors

[temperature_sensor MCU_temp]
sensor_type: temperature_mcu        # Internal MCU temperature sensor
min_temp: 0                         # Minimum temperature (°C)
max_temp: 100                       # Maximum temperature (°C)


################################################################################
# G-CODE ARCS SUPPORT
################################################################################
# Enables G2/G3 arc movement commands (smoother curved paths)

[gcode_arcs]
resolution: 1.0                     # Maximum arc segment length (mm)

################################################################################
# LED LIGHTING CONTROL
################################################################################
# Main LED strip control (defined as LED for easy brightness control)

[led main_led]
white_pin: PA3                      # LED control pin
cycle_time: 0.010                   # PWM cycle time (seconds)
hardware_pwm: False                 # Use software PWM
initial_WHITE: 0.4                  # Initial brightness on startup (0.0-1.0)

################################################################################
# ------------------------ RESONANCE TESTER ---------------------------------- #
################################################################################
# Resonance testing configuration

[resonance_tester]
accel_chip:  adxl345 tool1 #  adxl345 tool0 adxl345 carto
probe_points:
   175, 175, 30

accel_per_hz: 35
min_freq: 5
max_freq: 121 #90
max_smoothing: 0.1
hz_per_sec: 0.5 #1.0

    
# Input shaper configuration (reduces ringing/ghosting in prints)
[input_shaper]
damping_ratio_x: 0.001              # Damping ratio for X-axis
damping_ratio_y: 0.001 # Damping ratio for Y-axis
shaper_type_x = mzv                
shaper_freq_x = 35                  
shaper_type_y = mzv                
shaper_freq_y = 35                 

################################################################################
# IDLE TIMEOUT
################################################################################
# Automatic actions after period of inactivity

[idle_timeout]
gcode: _IDLE_TIMEOUT                # Macro to run on timeout
timeout: 2400                        # Timeout duration (seconds) - 20 minutes


[gcode_macro _IDLE_TIMEOUT]
description: Actions to perform on idle timeout (currently disabled)
gcode:
  TURN_OFF_HEATERS  # Uncomment to turn off heaters on timeout
  M84               # Uncomment to disable steppers on timeout

